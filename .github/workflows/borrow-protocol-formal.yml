name: borrow-protocol-formal

on:
  pull_request:
    paths:
      - "verification/borrow_protocol_model.py"
      - ".github/workflows/borrow-protocol-formal.yml"
      - "src/main/java/dev/oreslang/types/OwnershipChecker.java"
      - "src/main/cpp/oreslang/types/OwnershipChecker.cpp"
      - "src/test/java/dev/oreslang/BorrowFormalBoundaryRegressionTest.java"
      - "tests/native_borrow_admission.py"
  push:
    branches: [main]
    paths:
      - "verification/borrow_protocol_model.py"
      - ".github/workflows/borrow-protocol-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exhaust bounded loan states and require mutation counterexamples
        run: python3 verification/borrow_protocol_model.py
