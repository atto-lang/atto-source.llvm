name: Native tenant-domain host admission

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/TenantDomainHost.*'
      - 'tests/native_tenant_domain_host_test.c'
      - 'docs/TENANT_DOMAIN_HOST_ADMISSION.md'
      - 'CMakeLists.txt'
      - '.github/workflows/native-tenant-domain-host.yml'
  workflow_dispatch:

jobs:
  trusted-host-substrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ASan and UBSan security admission
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -O1 -g -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/main/cpp src/main/cpp/oreslang/runtime/TenantDomainHost.c \
            tests/native_tenant_domain_host_test.c -o /tmp/tenant-domain-asan
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 /tmp/tenant-domain-asan
      - name: LLVM IR -> host link -> native execution
        run: |
          clang -std=c11 -O1 -Wall -Wextra -Werror -S -emit-llvm \
            -Isrc/main/cpp tests/native_tenant_domain_host_test.c \
            -o /tmp/tenant-domain-fixture.ll
          grep -q 'target triple' /tmp/tenant-domain-fixture.ll
          clang -std=c11 -O2 -pthread -Wall -Wextra -Werror \
            /tmp/tenant-domain-fixture.ll \
            src/main/cpp/oreslang/runtime/TenantDomainHost.c \
            -o /tmp/tenant-domain-llvm
          /tmp/tenant-domain-llvm
      - name: Trust-boundary release gate
        run: |
          echo 'Host-only substrate verified. No LLVM guest source or hostile-native parity claims.'
