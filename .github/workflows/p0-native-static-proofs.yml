name: P0 native static proof contracts (host compiler helper only)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/types/NativeAssociatedWitnessContract.hpp'
      - 'src/main/cpp/oreslang/types/NativeSessionProofContract.hpp'
      - 'src/main/cpp/oreslang/types/NativeRefinementProofContract.hpp'
      - 'tests/native_associated_witness_contract_test.cpp'
      - 'tests/native_p0_session_refinement_test.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/p0-native-static-proofs.yml'
  push:
    paths:
      - 'src/main/cpp/oreslang/types/NativeAssociatedWitnessContract.hpp'
      - 'src/main/cpp/oreslang/types/NativeSessionProofContract.hpp'
      - 'src/main/cpp/oreslang/types/NativeRefinementProofContract.hpp'
      - 'tests/native_associated_witness_contract_test.cpp'
      - 'tests/native_p0_session_refinement_test.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/p0-native-static-proofs.yml'
permissions:
  contents: read
jobs:
  cpp17-static-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "SRC_SHA=$EXPECTED_HEAD"
          echo "SRC_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Compile C++17 P0 proof helper tests with Clang and GCC
        shell: bash
        run: |
          set -euo pipefail
          for cxx in clang++ g++; do
            "$cxx" --version | head -n 1
            for test in tests/native_associated_witness_contract_test.cpp tests/native_p0_session_refinement_test.cpp; do
              exe="$(mktemp /tmp/oreslang-p0-XXXXXX)"
              "$cxx" -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -I src/main/cpp "$test" -o "$exe"
              "$exe"
              rm -f "$exe"
            done
          done

# Host-level LLVM frontend static helper only. No .ores compilation, no LLVM
# IR/codegen/native guest executable, no Graal proof or hard RT certification.
