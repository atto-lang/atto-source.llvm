name: AttoLang LLVM compiler-backed test parity
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/main/cpp/oreslang/**'
      - 'tests/fixtures/*.atto'
      - 'tests/rust-harness/**'
      - '.github/workflows/atto-native-test-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-backed-atto:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact source head and full tree before code execution
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ATTO_EXACT_SOURCE_HEAD=$EXPECTED_SOURCE_HEAD"
          echo "ATTO_EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install native LLVM test toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev cargo rustc python3
          clang --version | head -n 1
          rustc --version
      - name: Execute independent Rust source-fuzz oracle tests
        run: cargo test --manifest-path tests/rust-harness/Cargo.toml --locked
      - name: Compile LLVM frontend and Rust parity harness
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target oreslang-llvmc oreslang-rust-test-harness --parallel 2
      - name: Require a real inventory of canonical AttoLang native tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N -R '^atto_(llvm|native)_' > atto-ctest-inventory.txt
          cat atto-ctest-inventory.txt
          grep -Eq 'Total Tests: 4$' atto-ctest-inventory.txt
      - name: Compile, link and execute canonical .atto guests and negative controls
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --timeout 180 \
            -R '^atto_(llvm|native)_' 
          echo "ATTO_LLVM_NATIVE_TEST_PARITY_EXECUTED=4"
