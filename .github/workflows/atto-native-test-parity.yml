name: AttoLang LLVM compiler-backed test parity
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/main/cpp/oreslang/**'
      - 'tests/fixtures/*.atto'
      - 'tests/rust-harness/**'
      - '.github/workflows/atto-native-test-parity.yml'
      - 'scripts/build-native-atto-fuzz-target.sh'
      - 'scripts/test-native-atto-fuzz-target.sh'
      - 'scripts/test-native-atto-fuzz-adapter-source-free.sh'
      - 'tests/native_atto_fuzz_stdin_adapter.c'
      - 'examples/atto-native-fuzz-project/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-backed-atto:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact Git head and tree before tests
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'ATTO_EXACT_SOURCE_HEAD=%s\n' "$EXPECTED_SOURCE_HEAD"
          printf 'ATTO_EXACT_SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - name: Install LLVM and Rust host toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev cargo rustc python3
          clang --version
          rustc --version
      - name: Verify source-free native LLVM IR stdin adapter controls
        shell: bash
        run: bash scripts/test-native-atto-fuzz-adapter-source-free.sh "$(command -v clang)"
      - name: Verify Rust source-fuzz host oracle
        run: cargo test --manifest-path tests/rust-harness/Cargo.toml --locked
      - name: Build actual LLVM compiler and Rust native test harness
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target oreslang-llvmc oreslang-rust-test-harness oreslang-no-gc-ir-audit-build --parallel 2
      - name: Require all six exact native parity tests to be discovered
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N -R '^atto_(llvm|native)_' > atto-ctest-inventory.txt
          cat atto-ctest-inventory.txt
          grep -Fqx 'Total Tests: 6' atto-ctest-inventory.txt
      - name: Execute compiled .atto source, actor sanitizer, and negative tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --timeout 180 -R '^atto_(llvm|native)_'
          echo "ATTO_LLVM_NATIVE_TEST_PARITY_EXECUTED=6"
