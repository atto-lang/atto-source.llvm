name: AttoLang LLVM implicit-const scalar guest parity
on:
  pull_request:
    paths:
      - 'contracts/implicit-const-scalar-v1/**'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'tests/implicit_const_scalar_execution.mjs'
      - '.github/workflows/implicit-const-scalar-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-llvm-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable exact HEAD
        shell: bash
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(git status --porcelain)"
          test "$(find contracts/implicit-const-scalar-v1 -maxdepth 1 -type f -name '*.atto' | wc -l)" -eq 11
          echo "SOURCE_HEAD=$SOURCE_HEAD SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install LLVM compiler and observer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm-dev cmake ninja-build nodejs
          llvm-config --version
      - name: Build exact-head LLVM guest compiler
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B "$RUNNER_TEMP/implicit-const-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build "$RUNNER_TEMP/implicit-const-build" --target oreslang-llvmc --parallel 2
          test -x "$RUNNER_TEMP/implicit-const-build/oreslang-llvmc"
      - name: Compile and execute all four positive guests at O0 and O2; prove four targeted rejections
        env:
          ORESLANG_LLVMC: ${{ runner.temp }}/implicit-const-build/oreslang-llvmc
          CLANG: clang
        run: |
          set -euo pipefail
          node tests/implicit_const_scalar_execution.mjs
