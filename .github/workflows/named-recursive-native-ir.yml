name: Named recursive scalar LLVM IR native proof
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/backend/NamedRecursiveScalarIr.hpp'
      - 'tests/named-recursive-native-ir/**'
      - 'scripts/test-named-recursive-native-ir.sh'
      - '.github/workflows/named-recursive-native-ir.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-guest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout and execute native guest controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}'
          clang --version
          g++ --version
          bash scripts/test-named-recursive-native-ir.sh
          test -z "$(git status --porcelain --untracked-files=all)"
