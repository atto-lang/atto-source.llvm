name: Atto LLVM generational actor Ref32 host pilot
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorRef32Heap.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorSlabHeap32.hpp'
      - 'tests/actor_ref32_heap_test.cpp'
      - '.github/workflows/actor-ref32-host-pilot.yml'
  workflow_dispatch:

jobs:
  ref32-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: GCC C++17 optimized host adapter test
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -Isrc/main/cpp tests/actor_ref32_heap_test.cpp -o /tmp/ref32-host-gcc
          /tmp/ref32-host-gcc | tee /tmp/ref32-gcc.log
          grep -q '^ATTO_REF32_HOST_PASS checks=' /tmp/ref32-gcc.log
      - name: Clang ASan UBSan host adapter test
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc/main/cpp tests/actor_ref32_heap_test.cpp -o /tmp/ref32-host-san
          ASAN_OPTIONS=detect_leaks=1 /tmp/ref32-host-san | tee /tmp/ref32-san.log
          grep -q '^ATTO_REF32_HOST_PASS checks=' /tmp/ref32-san.log
      - name: Evidence boundary
        run: |
          echo "HOST_REF32_ADAPTER_ONLY: NOT compiled .atto guest; NOT ABI v5; NOT sandbox; NOT full LLVM parity"
