name: Native VM NIO exact-head lifecycle sanitizers (no LLVM dependency)

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeOresVM.*'
      - 'src/main/cpp/oreslang/runtime/NativeOresVMNio.*'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.*'
      - 'src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h'
      - 'src/main/cpp/oreslang/runtime/NativeEpollReactor*'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipChecker.cpp'
      - 'tests/native_vm_nio_lifecycle_test.c'
      - 'tests/native_epoll_reactor*'
      - 'tests/actor_max_threads_source_admission_test.cpp'
      - 'tests/test_native_nio_source_integrity.py'
      - 'scripts/verify-native-nio-source-local.py'
      - 'scripts/test-native-vm-nio-host-sanitizers.sh'
      - '.github/workflows/native-vm-nio-source-local-sanitizers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-vm-nio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact pull-request source head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable source head, tree and worktree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD)" = "$EXPECTED_HEAD"
          actual_tree="$(git rev-parse --verify HEAD^{tree})"
          python3 -I scripts/verify-native-nio-source-local.py "$EXPECTED_HEAD" "$actual_tree"
          echo "NIO_EXACT_SOURCE_COMMIT=$EXPECTED_HEAD"
          echo "NIO_EXACT_SOURCE_TREE=$actual_tree"
      - name: Exercise fail-closed worktree security fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -m unittest discover -s tests -p test_native_nio_source_integrity.py -v
          python3 -I scripts/verify-native-nio-source-local.py \
            "$(git rev-parse --verify HEAD)" "$(git rev-parse --verify HEAD^{tree})"

  native-vm-nio:
    needs: source-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pull-request source head without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin exact worktree before compilation
        id: identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse --verify HEAD)"
          actual_tree="$(git rev-parse --verify HEAD^{tree})"
          test "$actual_head" = "$EXPECTED_HEAD"
          python3 -I scripts/verify-native-nio-source-local.py "$actual_head" "$actual_tree"
          echo "tree=$actual_tree" >> "$GITHUB_OUTPUT"
          echo "NIO_VM_COMPILED_SOURCE_HEAD=$actual_head"
          echo "NIO_VM_COMPILED_SOURCE_TREE=$actual_tree"
      - name: Compile real C VM, actor scheduler and C++ NIO under both sanitizers
        shell: bash
        env:
          ORES_NIO_EXPECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ORES_NIO_EXPECT_TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          bash scripts/test-native-vm-nio-host-sanitizers.sh
          python3 -I scripts/verify-native-nio-source-local.py \
            "$ORES_NIO_EXPECT_HEAD" "$ORES_NIO_EXPECT_TREE"
          echo "NIO_VM_NATIVE_EXACT_TREE_SANITIZERS_PASS"
