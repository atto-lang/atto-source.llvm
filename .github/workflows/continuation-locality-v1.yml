name: Continuation locality contract v1
on:
  pull_request:
    paths:
      - "contracts/v2/CONTINUATION_LOCALITY_V1.md"
      - "contracts/v2/test_continuation_locality_v1.py"
      - "src/**"
      - "runtime/**"
      - "tests/**"
      - "verification/**"
      - ".github/workflows/continuation-locality-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA" || exit 1
          git rev-parse HEAD
      - name: Run host-only reference policy checks (NOT guest parity)
        run: python3 -m unittest -v contracts/v2/test_continuation_locality_v1.py
  native-llvm-actor-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head for backend probe
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Native compiler toolchain availability
        run: command -v cmake && command -v clang && command -v llvm-config
      - name: Build native actor, continuation and source-compiled Oreslang tests
        run: |
          cmake -S . -B build-locality -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build build-locality --target oreslang-llvmc oreslang-source-task-i64-e2e-build oreslang-native-actor-ready-queue-test oreslang-native-continuation-wake-escrow-test oreslang-native-continuation-ready-resume-test -j2
          ctest --test-dir build-locality --output-on-failure -R 'native_actor_nonblocking_ready_queue|native_continuation_wake_escrow_stop_cancel_aba|native_continuation_ready_cancel_resume_race|native_source_task_i64_compiled_execution'
