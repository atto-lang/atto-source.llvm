name: Actor invocation frame native lease bridge exact-head

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorInvocationFrameBridge.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorInvocationFrameAbiV1.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorInvocationFrames.hpp'
      - 'tests/native_actor_invocation_frame_bridge_test.cpp'
      - 'CMakeLists.txt'
      - 'docs/ACTOR_INVOCATION_FRAME_NATIVE_ABI_M4.md'
      - '.github/workflows/actor-invocation-frame-lease-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-frame-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout original immutable source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out head tree and frame/runtime blob identities
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          echo "EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
          for path in \
            src/main/cpp/oreslang/runtime/ActorInvocationFrameBridge.hpp \
            src/main/cpp/oreslang/runtime/ActorInvocationFrameAbiV1.hpp \
            src/main/cpp/oreslang/runtime/ActorInvocationFrames.hpp \
            src/main/cpp/oreslang/runtime/ActorLedgerLeaseAdapter.hpp \
            src/main/cpp/oreslang/runtime/ActorExecutionLedger.hpp \
            src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            src/main/cpp/oreslang/runtime/NativeActorScheduler.h \
            tests/native_actor_invocation_frame_bridge_test.cpp; do
            expected="$(git rev-parse "HEAD:$path")"
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected"
            echo "EXACT_BLOB $path $actual"
          done
      - name: Strict GCC and Clang native DATA WAKE regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/actor-frame-lease
          for cc in gcc clang; do
            case "$cc" in gcc) cxx=g++;; clang) cxx=clang++;; esac
            "$cc" -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -pthread \
              -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
              -o "build/actor-frame-lease/scheduler-$cc.o"
            "$cxx" -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Wpedantic -Werror -pthread \
              -Isrc/main/cpp tests/native_actor_invocation_frame_bridge_test.cpp \
              "build/actor-frame-lease/scheduler-$cc.o" \
              -o "build/actor-frame-lease/bridge-$cc"
            "build/actor-frame-lease/bridge-$cc"
            echo "ACTOR_NATIVE_FRAME_LEASE_HOST_PASS compiler=$cc"
          done
      - name: Clang ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          clang -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o build/actor-frame-lease/scheduler-sanitized.o
          clang++ -std=c++17 -O1 -g -UNDEBUG -Wall -Wextra -Wpedantic -Werror -pthread \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/main/cpp tests/native_actor_invocation_frame_bridge_test.cpp \
            build/actor-frame-lease/scheduler-sanitized.o \
            -o build/actor-frame-lease/bridge-sanitized
          build/actor-frame-lease/bridge-sanitized
          echo "ACTOR_NATIVE_FRAME_LEASE_SANITIZER_HOST_PASS"
      - name: Preserve honesty about guest compiler proof
        shell: bash
        run: |
          echo "HOST_NATIVE_BRIDGE_ONLY"
          echo "LLVM_ATTO_SOURCE_SUSPENDS_NOT_COMPILED"
          echo "COMPILER_GUEST_PARITY_NOT_CERTIFIED"
