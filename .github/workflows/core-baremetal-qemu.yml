name: atto.core bare-metal Cortex-M3 (no libc, QEMU)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-baremetal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-baremetal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          test -s tests/fixtures/core_baremetal/app.atto
          sha256sum tests/fixtures/core_baremetal/app.atto
      - name: Install LLVM, LLD and QEMU (no ARM libc or compiler-rt)
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang lld llvm llvm-dev qemu-system-arm
      - name: Build oreslang-llvmc
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target oreslang-llvmc --parallel 2
      - name: Audit-rule unit tests
        run: cargo test --locked --manifest-path tools/core-baremetal-gate/Cargo.toml
      - name: Compile .atto, link without libc, audit and boot the atto.core image
        run: cargo run --locked --release --manifest-path tools/core-baremetal-gate/Cargo.toml -- --compiler build/oreslang-llvmc
