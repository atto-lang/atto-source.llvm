name: atto.core bare-metal Cortex-M3 (no libc, QEMU)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-baremetal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-baremetal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          test -s tests/fixtures/core_baremetal/app.atto
          sha256sum tests/fixtures/core_baremetal/app.atto
      - name: Install LLVM, LLD and QEMU (no ARM libc or compiler-rt)
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang lld llvm llvm-dev qemu-system-arm
      - name: Verify canonical source and generated compiler embeddings
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path tools/atto-library-embed/Cargo.toml -- --check
      - name: Build oreslang-llvmc
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target oreslang-llvmc --parallel 2
      - name: Audit-rule unit tests
        run: cargo test --locked --manifest-path tools/core-baremetal-gate/Cargo.toml
      - name: Compile .atto, link without libc, audit and boot the atto.core image
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --release --manifest-path tools/core-baremetal-gate/Cargo.toml -- --compiler build/oreslang-llvmc 2>&1 | tee atto-core-qemu.log
          grep -F 'PASS no-libc linker rejects reachable compiler-output helper injection' atto-core-qemu.log
          grep -F 'PASS QEMU Cortex-M3 boots the atto.core .atto image' atto-core-qemu.log
          grep -F 'core bare-metal gate PASS (' atto-core-qemu.log
          printf 'PR_HEAD=%s\nPR_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > atto-core-qemu-receipt.txt
          sha256sum tests/fixtures/core_baremetal/app.atto stdlib/numeric.atto build/oreslang-llvmc >> atto-core-qemu-receipt.txt
      - name: Preserve exact-head QEMU and mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atto-core-cortexm-exact-head-receipt
          path: |
            atto-core-qemu.log
            atto-core-qemu-receipt.txt
          if-no-files-found: warn
