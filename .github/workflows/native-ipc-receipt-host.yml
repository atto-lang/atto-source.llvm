name: LLVM native IPC receipt ledger (host reference)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeIpcReceiptLedger.hpp'
      - 'tests/native_ipc_receipt_ledger_test.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/native-ipc-receipt-host.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-host-ipc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile with GCC and Clang
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -Isrc/main/cpp tests/native_ipc_receipt_ledger_test.cpp -o /tmp/ipc-gcc
          clang++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -Isrc/main/cpp tests/native_ipc_receipt_ledger_test.cpp -o /tmp/ipc-clang
      - name: Exercise native receipt and concurrency cases
        run: |
          /tmp/ipc-gcc
          /tmp/ipc-clang
      - name: Classify evidence
        run: echo 'HOST_REFERENCE_ONLY not authenticated transport, guest compiler or JVM/LLVM parity'
