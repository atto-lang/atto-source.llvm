name: Native Atto LLVM scalar AOT (exact-head)
on:
  push:
    branches: [main, feat/native-atto-http3-policy-20261114]
  pull_request:
    paths: ['Cargo.toml', 'src/**', 'frontend/**', 'tests/fixtures/**', 'ci/**', '.github/workflows/native-aot.yml']
permissions:
  contents: read
jobs:
  scalar-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Pin offline Rust and LLVM toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo --version
          clang --version | head -n 1
      - name: Build native LLVM emitter and execute real Atto fixtures
        run: bash ci/test_native_aot.sh
