name: Actor-owned logical guest frames exact-head
on:
  pull_request:
    paths:
      - src/main/cpp/oreslang/runtime/ActorGuestFrameStack.hpp
      - src/main/cpp/oreslang/runtime/MultiActorCarrier.hpp
      - src/main/cpp/oreslang/runtime/MultiActorCarrier.cpp
      - tests/native_actor_guest_frame_stack_test.cpp
      - CMakeLists.txt
      - .github/workflows/actor-owned-guest-stack-exact-head.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact original private source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact head with clean tree and immutable source receipts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          for source in src/main/cpp/oreslang/runtime/ActorGuestFrameStack.hpp src/main/cpp/oreslang/runtime/MultiActorCarrier.hpp src/main/cpp/oreslang/runtime/MultiActorCarrier.cpp tests/native_actor_guest_frame_stack_test.cpp CMakeLists.txt; do
            git ls-tree HEAD -- "$source"
            git hash-object "$source"
            test "$(git hash-object "$source")" = "$(git rev-parse "HEAD:$source")"
          done
      - name: Execute native host scheduler/frame test with GCC and Clang
        run: |
          set -eu
          for compiler in g++ clang++; do
            command -v "$compiler"
            "$compiler" -std=c++17 -O2 -pthread -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Isrc/main/cpp tests/native_actor_guest_frame_stack_test.cpp src/main/cpp/oreslang/runtime/MultiActorCarrier.cpp -o "/tmp/actor-frames-$compiler"
            "/tmp/actor-frames-$compiler" | tee "/tmp/$compiler.log"
            grep -Fx ACTOR_OWNED_LOGICAL_FRAME_STORE_HOST_PASS "/tmp/$compiler.log"
            sha256sum "/tmp/actor-frames-$compiler"
          done
      - name: Execute Clang ASan and UBSan host scheduler/frame test
        run: |
          set -eu
          clang++ -std=c++17 -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror -UNDEBUG -Isrc/main/cpp tests/native_actor_guest_frame_stack_test.cpp src/main/cpp/oreslang/runtime/MultiActorCarrier.cpp -o /tmp/actor-frames-sanitized
          /tmp/actor-frames-sanitized | tee /tmp/sanitizer.log
          grep -Fx ACTOR_OWNED_LOGICAL_FRAME_STORE_HOST_PASS /tmp/sanitizer.log
          sha256sum /tmp/actor-frames-sanitized
