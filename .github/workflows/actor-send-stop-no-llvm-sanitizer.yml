name: Native actor send-stop exact delivery (no LLVM dependency)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.c'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.h'
      - 'src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h'
      - 'tests/native_actor_send_stop_race_test.c'
      - 'tests/test_barrier.h'
      - '.github/workflows/actor-send-stop-no-llvm-sanitizer.yml'
      - 'scripts/verify-native-sanitizer-controls.sh'
      - 'scripts/test-verify-native-sanitizer-controls.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-send-stop:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gcc
            cc: gcc
            flags: '-O2 -UNDEBUG'
          - flavor: clang-asan-ubsan
            cc: clang
            flags: '-O1 -g -UNDEBUG -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
          - flavor: gcc-tsan
            cc: gcc
            flags: '-O1 -g -UNDEBUG -fPIE -pie -fsanitize=thread -fno-omit-frame-pointer'
    steps:
      - name: Checkout exact PR head with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bind exact PR head and clean Git tree
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "EXACT_SOURCE_HEAD=$EXPECTED_SOURCE_HEAD"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Verify sanitizer controls before instrumented native workload
        if: matrix.flavor != 'gcc'
        shell: bash
        env:
          SANITIZER_CC: ${{ matrix.cc }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          bash scripts/test-verify-native-sanitizer-controls.sh
          if [[ "$FLAVOR" == gcc-tsan ]]; then
            bash scripts/verify-native-sanitizer-controls.sh thread
          else
            bash scripts/verify-native-sanitizer-controls.sh address undefined
          fi
      - name: Compile real actor scheduler + race harness
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          read -r -a options <<< "$FLAGS"
          "$CC" -std=c11 -pthread -Wall -Wextra -Wpedantic -Werror "${options[@]}" \
            -I src/main/cpp -I tests \
            tests/native_actor_send_stop_race_test.c \
            src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o /tmp/oreslang-native-send-stop-race
      - name: Repeated exact-payload race and domain-capability probes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "SEND_STOP_ATTEMPT=$attempt"
            TSAN_OPTIONS=halt_on_error=1:exitcode=86:second_deadlock_stack=1 \
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:exitcode=86 \
            UBSAN_OPTIONS=halt_on_error=1:exitcode=86 \
              timeout 45s /tmp/oreslang-native-send-stop-race | grep -Fx NATIVE_SEND_STOP_RACE_PASS
          done
          echo "NATIVE_SEND_STOP_EXACT_HEAD_PASS attempts=3 flavor=${{ matrix.flavor }}"
