name: No-new-Python migration regression
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prohibit-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Bind exact head and Git tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
      - name: Rust policy checker unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/no-python-check/Cargo.toml
          rustc --edition=2021 -D warnings --test tools/check_no_python.rs -o "$RUNNER_TEMP/strict-python-policy-tests"
          "$RUNNER_TEMP/strict-python-policy-tests"
      - name: Enforce frozen legacy Python non-regression, not strict migration
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path tools/no-python-check/Cargo.toml -- .
          echo 'FULL_RUST_ONLY_MIGRATION=NOT_COMPLETE'
          echo 'STRICT_ZERO_PYTHON_GATE=NOT_CERTIFIED'
