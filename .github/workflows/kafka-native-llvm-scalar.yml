name: Atto Kafka scalar + actor guests — genuine LLVM AOT (not broker)
on:
  pull_request:
    paths:
      - 'tests/fixtures/kafka_*'
      - 'tests/native_kafka_scalar_execution.sh'
      - '.github/workflows/kafka-native-llvm-scalar.yml'
      - 'src/main/cpp/oreslang/frontend/**'
      - 'src/main/cpp/oreslang/backend/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-kafka-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact compiler source and fixtures
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "LLVM_KAFKA_COMPILER_SHA=$(git rev-parse HEAD)"
          echo "LLVM_KAFKA_COMPILER_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "LLVM_KAFKA_SCALAR_BLOB=$(git hash-object tests/fixtures/kafka_partition_scalar_native.atto)"
          bash -n tests/native_kafka_scalar_execution.sh
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm-dev cmake ninja-build
          llvm-config --version
          clang --version | head -1
      - name: Build official LLVM source compiler (exact checkout)
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B "$RUNNER_TEMP/kafka-llvm-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build "$RUNNER_TEMP/kafka-llvm-build" --target oreslang-llvmc --parallel 2
          test -x "$RUNNER_TEMP/kafka-llvm-build/oreslang-llvmc"
          sha256sum "$RUNNER_TEMP/kafka-llvm-build/oreslang-llvmc"
      - name: Execute scalar and native actor Atto O0/O2; reject unsupported durable actor
        run: |
          set -euo pipefail
          bash tests/native_kafka_scalar_execution.sh "$RUNNER_TEMP/kafka-llvm-build/oreslang-llvmc"
      - name: Evidence boundary
        run: |
          echo 'LLVM_KAFKA_SCALAR_AND_I64_ACTOR=COMPILER_GENERATED_NATIVE_GUEST'
          echo 'LLVM_KAFKA_DURABLE_ATTO_ACTOR=NOT_EXECUTED'
          echo 'LLVM_KAFKA_TCP_OR_FSYNC=NOT_EXECUTED'
