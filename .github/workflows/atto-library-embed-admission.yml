name: LLVM library embedding manifest admission
on:
  pull_request:
    paths:
      - 'cmake/AttoLibraryEmbed.cmake'
      - 'stdlib/LIBRARIES.txt'
      - 'tests/atto_library_embed_admission.sh'
      - '.github/workflows/atto-library-embed-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check exact source and run real CMake generator regression
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD^{tree}
          bash tests/atto_library_embed_admission.sh
