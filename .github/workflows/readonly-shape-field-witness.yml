name: LLVM readonly structural-field host witness
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/types/ReadonlyShapeFieldAbi.hpp'
      - 'tests/readonly_shape_field_abi.cpp'
      - '.github/workflows/readonly-shape-field-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and execute real GCC C++20 readonly layout witness
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree}
          g++ -std=c++20 -O2 -UNDEBUG -Wall -Wextra -Werror -pedantic tests/readonly_shape_field_abi.cpp -o /tmp/atto-shape-gcc
          /tmp/atto-shape-gcc | tee /tmp/atto-shape-gcc.log
          grep -q '^LLVM_SHAPE_FIELD_WITNESS_PASS native=83 negatives=12' /tmp/atto-shape-gcc.log
      - name: Execute real Clang ASan UBSan readonly layout witness
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -g -UNDEBUG -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer tests/readonly_shape_field_abi.cpp -o /tmp/atto-shape-san
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/atto-shape-san | tee /tmp/atto-shape-san.log
          grep -q '^LLVM_SHAPE_FIELD_WITNESS_PASS native=83 negatives=12' /tmp/atto-shape-san.log
      - name: Exact witness boundary
        run: |
          echo 'READONLY_HOST_FIELD_LAYOUT=CHECKED'
          echo 'COMPILED_ATTO_FIELD_LOWERING=NOT_PROVEN'
