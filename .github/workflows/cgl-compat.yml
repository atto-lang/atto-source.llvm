name: CGL Linux native pilot (not RT certification)
on:
  pull_request:
    paths:
      - 'scripts/cgl-*'
      - 'scripts/compile-aot.sh'
      - 'src/main/cpp/oreslang/**'
      - 'tests/fixtures/**'
      - 'tests/test_cgl_preflight.py'
      - 'tests/test_cgl_smoke_bounded.py'
      - 'tests/native_cgl_host_admission_test.cpp'
      - 'tests/native_cgl_dispatch_evidence_test.cpp'
      - 'tests/native_cgl_carrier_slice_trace_test.cpp'
      - 'src/main/cpp/oreslang/runtime/CglCarrierDispatchTrace.hpp'
      - 'src/main/cpp/oreslang/runtime/MultiActorCarrier.hpp'
      - 'src/main/cpp/oreslang/runtime/MultiActorCarrier.cpp'
      - 'src/main/cpp/oreslang/runtime/CglDispatchEvidence.hpp'
      - 'tests/fixtures/forward-call-main.ores'
      - 'src/main/cpp/oreslang/runtime/CglHostAdmission.hpp'
      - 'CMakeLists.txt'
      - 'docs/CGL_DEPLOYMENT.md'
      - 'docs/CGL_DISPATCH_EVIDENCE_V1.md'
      - '.github/workflows/cgl-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cgl-linux-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Pull request defaults to a synthetic merge SHA; validate the actual PR head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind test execution to exact immutable source commit
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          echo "CGL_EXACT_HEAD_SHA=$actual"
          echo "CGL_EXACT_TREE_SHA=$(git rev-parse HEAD^{tree})"
      - name: Install LLVM compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev python3
      - name: Preflight negative matrix
        run: PYTHONOPTIMIZE=0 python3 -I -B -m unittest discover -s tests -p test_cgl_preflight.py -v
      - name: Source-free bounded smoke and timeout negative regression
        run: PYTHONOPTIMIZE=0 python3 -I -B -m unittest discover -s tests -p test_cgl_smoke_bounded.py -v
      - name: Build native compiler
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target oreslang-llvmc oreslang-native-cgl-host-admission-test oreslang-native-cgl-dispatch-evidence-test oreslang-native-cgl-carrier-slice-trace-test --parallel 2
      - name: End to end source to ELF64 process on generic Linux
        run: bash scripts/cgl-native-smoke.sh
      - name: Check named CGL/dispatch/source native tests
        shell: bash
        run: |
          set -euo pipefail
          # Fail if any required CTest disappears from the build.
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^native_cgl_linux_host_admission$'
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^native_cgl_timer_to_user_start_evidence$'
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^native_cgl_carrier_slice_timestamp_provenance$'
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^native_source_i64_os_exit_subset$'

