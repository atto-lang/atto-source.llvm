name: LLVM actor pipeline host routing proof
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorPipeContract.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorPipeTransport.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorPipeRouteLedger.hpp'
      - 'tests/native_actor_pipe_contract_test.cpp'
      - 'tests/native_actor_pipe_graph_contract_test.cpp'
      - 'tests/native_actor_pipeline_routing_test.cpp'
      - 'tests/native_actor_pipe_route_ledger_test.cpp'
      - 'scripts/test-actor-pipeline-routing.sh'
      - '.github/workflows/actor-pipeline-routing.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorPipeContract.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorPipeTransport.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorPipeRouteLedger.hpp'
      - 'tests/native_actor_pipe_contract_test.cpp'
      - 'tests/native_actor_pipe_graph_contract_test.cpp'
      - 'tests/native_actor_pipeline_routing_test.cpp'
      - 'tests/native_actor_pipe_route_ledger_test.cpp'
      - 'scripts/test-actor-pipeline-routing.sh'
      - '.github/workflows/actor-pipeline-routing.yml'
permissions:
  contents: read
jobs:
  exact-source-native-host-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require exact PR-head source checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
          git hash-object src/main/cpp/oreslang/runtime/ActorPipeContract.hpp \
            src/main/cpp/oreslang/runtime/NativeActorPipeTransport.hpp \
            src/main/cpp/oreslang/runtime/ActorPipeRouteLedger.hpp
          git hash-object src/main/cpp/oreslang/runtime/ActorPipeContract.hpp \
            src/main/cpp/oreslang/runtime/NativeActorPipeTransport.hpp
      - name: Run full GCC/Clang and sanitizer matrix
        run: sh scripts/test-actor-pipeline-routing.sh
