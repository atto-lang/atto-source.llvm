name: LLVM actor pipeline host routing proof
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorPipeContract.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorPipeTransport.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorPipeRouteLedger.hpp'
      - 'tests/native_actor_pipe_contract_test.cpp'
      - 'tests/native_actor_pipe_graph_contract_test.cpp'
      - 'tests/native_actor_pipeline_routing_test.cpp'
      - 'tests/native_actor_pipe_route_ledger_test.cpp'
      - 'tests/native_actor_pipe_writer_promotion_fault_test.cpp'
      - 'scripts/test-actor-pipeline-routing.sh'
      - 'tests/test_actor_pipeline_script_flags.py'
      - 'contracts/v1/verify_actor_pipeline_v1.py'
      - 'contracts/v1/test_actor_pipeline_v1.py'
      - 'contracts/v1/actor-pipeline-routing-v1.json'
      - 'CMakeLists.txt'
      - '.github/workflows/actor-pipeline-routing.yml'
  push:
    branches: [main]
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorPipeContract.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorPipeTransport.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorPipeRouteLedger.hpp'
      - 'tests/native_actor_pipe_contract_test.cpp'
      - 'tests/native_actor_pipe_graph_contract_test.cpp'
      - 'tests/native_actor_pipeline_routing_test.cpp'
      - 'tests/native_actor_pipe_route_ledger_test.cpp'
      - 'tests/native_actor_pipe_writer_promotion_fault_test.cpp'
      - 'scripts/test-actor-pipeline-routing.sh'
      - 'tests/test_actor_pipeline_script_flags.py'
      - 'contracts/v1/verify_actor_pipeline_v1.py'
      - 'contracts/v1/test_actor_pipeline_v1.py'
      - 'contracts/v1/actor-pipeline-routing-v1.json'
      - 'CMakeLists.txt'
      - '.github/workflows/actor-pipeline-routing.yml'
permissions:
  contents: read
jobs:
  exact-source-native-host-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR-head checkout and record tree identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git hash-object src/main/cpp/oreslang/runtime/ActorPipeContract.hpp \
            src/main/cpp/oreslang/runtime/NativeActorPipeTransport.hpp \
            tests/native_actor_pipe_writer_promotion_fault_test.cpp \
            scripts/test-actor-pipeline-routing.sh
      - name: Verify five-backend typed actor routing contract
        run: |
          python3 contracts/v1/verify_actor_pipeline_v1.py contracts/v1/actor-pipeline-routing-v1.json
          python3 contracts/v1/test_actor_pipeline_v1.py
      - name: Verify production and sanitizer matrix controls
        run: python3 tests/test_actor_pipeline_script_flags.py
      - name: Capture source identity for evidence artifact
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/actor-routing-evidence"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            printf 'repo=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            g++ --version | sed -n '1p'
            clang++ --version | sed -n '1p'
            python3 --version
            git hash-object contracts/v1/verify_actor_pipeline_v1.py \
              contracts/v1/test_actor_pipeline_v1.py \
              contracts/v1/actor-pipeline-routing-v1.json
          } > "$evidence/identity.txt"
      - name: Run full GCC/Clang and sanitizer matrix
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/test-actor-pipeline-routing.sh 2>&1 | \
            tee "$RUNNER_TEMP/actor-routing-evidence/native-tests.log"
      - name: Upload exact-source routing evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llvm-actor-routing-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actor-routing-evidence/
          retention-days: 3
          if-no-files-found: error
