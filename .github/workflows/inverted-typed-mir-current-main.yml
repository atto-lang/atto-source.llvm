name: Inverted typed MIR current-main no-guest smoke
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/types/Inverted*.hpp'
      - 'tests/native_inverted_*'
      - '.github/workflows/inverted-typed-mir-current-main.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpp17-checked-mir-native-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          echo "SOURCE_EXACT_HEAD=$EXPECTED"
          echo "SOURCE_EXACT_TREE=$(git rev-parse HEAD^{tree})"
      - name: Execute checked standalone MIR and generated native IR smoke
        shell: bash
        run: |
          set -euo pipefail
          bash tests/native_inverted_mir_codegen_smoke.sh
          echo 'HOST_MIR_AND_NATIVE_EMITTER_ONLY; production .atto compiler NOT_EXECUTED'
