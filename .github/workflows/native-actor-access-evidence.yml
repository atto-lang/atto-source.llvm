name: Native actor heap access evidence

on:
  push:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.*'
      - 'tests/actor_heap_access_trace_test.c'
      - '.github/workflows/native-actor-access-evidence.yml'
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.*'
      - 'tests/actor_heap_access_trace_test.c'
      - '.github/workflows/native-actor-access-evidence.yml'

permissions:
  contents: read

jobs:
  actor-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and run exact-checkout host ABI tests
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            "$compiler" -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG               -I src/main/cpp               tests/actor_heap_access_trace_test.c               src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c               -o "actor-evidence-${compiler}"
            timeout 30 "./actor-evidence-${compiler}"
          done
      - name: Address and undefined behavior sanitizer run
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG             -fno-omit-frame-pointer -fsanitize=address,undefined             -I src/main/cpp             tests/actor_heap_access_trace_test.c             src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c             -o actor-evidence-sanitized
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1             timeout 30 ./actor-evidence-sanitized
