name: Typed effects v1 LLVM scalar native AOT + effect admission
on:
  pull_request:
    paths:
      - 'src/effect_check.rs'
      - 'src/main.rs'
      - '.github/workflows/typed-effects-v1-llvm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-ir:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1e6e67dc7c1e9271cb6a01da943b21a6df9a4db8 # stable
      - name: Compile Rust frontend and execute typed IR effect tests (not guest execution)
        run: |
          cargo test --bin atto-llvm effect_check -- --nocapture
          cargo test --bin atto-llvm native_main_is_direct_i64_call -- --nocapture
      - name: Run compiled scalar guest with transitive effects (not full-language parity)
        shell: bash
        run: |
          set -euo pipefail
          src_file="$RUNNER_TEMP/effects-call-chain.atto"
          printf 'pub fnc add_one(int x): int { return x + 1; } pub fnc main(): int { return add_one(41); }\n' > "$src_file"
          for profile in pure deterministic no-alloc; do
            executable="$RUNNER_TEMP/effects-${profile}"
            cargo run --bin atto-llvm -- "$src_file" -o "$executable" --effect-check="$profile"
            test -x "$executable"
            set +e
            "$executable"
            code=$?
            set -e
            test "$code" -eq 42
            echo "COMPILED_SCALAR_NATIVE_AOT_EFFECT_PROFILE=${profile}:EXIT_42"
          done
      - name: Reject unresolved ambient IO without clobbering an output file
        shell: bash
        run: |
          set -euo pipefail
          src_file="$RUNNER_TEMP/effects-io.atto"
          out_file="$RUNNER_TEMP/effects-io.ll"
          err_file="$RUNNER_TEMP/effects-io.err"
          printf 'pub fnc main(): int { stdio.println(42); return 42; }\n' > "$src_file"
          printf 'PRESERVE_OUTPUT\n' > "$out_file"
          if cargo run --bin atto-llvm -- "$src_file" -o "$out_file" --emit-llvm --effect-check=pure > /dev/null 2>"$err_file"; then
            echo 'Unexpectedly admitted unverified stdio' >&2
            exit 1
          fi
          grep -F 'E_EFFECT_UNKNOWN:' "$err_file"
          grep -Fx 'PRESERVE_OUTPUT' "$out_file"
      - name: Reject unrecognized profile before publishing an artifact
        shell: bash
        run: |
          set -euo pipefail
          src_file="$RUNNER_TEMP/effects-invalid.atto"
          out_file="$RUNNER_TEMP/effects-invalid.ll"
          err_file="$RUNNER_TEMP/effects-invalid.err"
          printf 'pub fnc main(): int { return 42; }\n' > "$src_file"
          if cargo run --bin atto-llvm -- "$src_file" -o "$out_file" --emit-llvm --effect-check=bogus > /dev/null 2>"$err_file"; then
            echo 'Unexpectedly accepted unrecognized profile' >&2
            exit 1
          fi
          grep -F 'E_EFFECT_PROFILE:' "$err_file"
          test ! -e "$out_file"
