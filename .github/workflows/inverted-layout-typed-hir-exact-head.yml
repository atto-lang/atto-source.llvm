name: Inverted SoA typed HIR / native owner exact-head
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/types/InvertedTypedPlan.hpp'
      - 'src/main/cpp/oreslang/types/InvertedTypedMir.hpp'
      - 'src/main/cpp/oreslang/types/InvertedSchemaMirAdmission.hpp'
      - 'src/main/cpp/oreslang/types/InvertedProductionSourceMir.hpp'
      - 'src/main/cpp/oreslang/main.cpp'
      - 'src/main/cpp/oreslang/frontend/ModuleLoader.cpp'
      - 'tests/native_inverted_production_guest.sh'
      - 'tests/native_inverted_production_mir_test.cpp'
      - 'tests/native_inverted_schema_mir_preflight_test.cpp'
      - 'tests/native_inverted_struct_ast_test.cpp'
      - 'src/main/cpp/oreslang/types/InvertedMirLlvmI64.hpp'
      - 'tests/native_inverted_mir_llvm_guest.cpp'
      - 'tests/native_inverted_mir_ir_guest.sh'
      - 'src/main/cpp/oreslang/types/InvertedNativeMirI64.hpp'
      - 'tests/native_inverted_mir_compiler17_test.cpp'
      - 'tests/native_inverted_typed_mir_test.cpp'
      - 'src/main/cpp/oreslang/runtime/DopInvertedColumns.hpp'
      - 'src/main/cpp/oreslang/runtime/DopFixedRecord.hpp'
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'CMakeLists.txt'
      - 'src/main/cpp/oreslang/frontend/ExperimentalInvertedI64.hpp'
      - 'tests/native_inverted_typed_plan_test.cpp'
      - 'tests/native_inverted_i64_guest.py'
      - 'tests/inverted_i64_standalone_driver.cpp'
      - 'tests/inverted-i64-standalone/**'
      - 'tests/fixtures/inverted-i64/**'
      - '.github/workflows/inverted-layout-typed-hir-exact-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typed-hir-and-guest:
    name: ${{ matrix.compiler }} / ${{ matrix.sanitize }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
            sanitize: none
          - compiler: clang
            cxx: clang++
            sanitize: none
          - compiler: gcc
            cxx: g++
            sanitize: asan-ubsan
          - compiler: clang
            cxx: clang++
            sanitize: asan-ubsan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact tested HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          printf 'SOURCE_HEAD=%s\n' "$actual"
          test "$actual" = "$EXPECTED_HEAD"
      - name: Locate native toolchains
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          "${{ matrix.cxx }}" --version
          clang --version
          python3 --version
      - name: Configure isolated source adapter and typed HIR
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          set -euo pipefail
          flags="-O1 -g"
          if [ "$SANITIZE" = "asan-ubsan" ]; then
            flags="$flags -fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          cmake -S tests/inverted-i64-standalone -B build/inverted-i64-standalone \
            -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$flags" -DBUILD_TESTING=ON
      - name: Build exact-head C++ targets
        run: cmake --build build/inverted-i64-standalone --parallel 2
      - name: Execute guest and checked owner tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build/inverted-i64-standalone --output-on-failure --timeout 180

  production-compiler-and-guest:
    name: production oreslang-llvmc / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact production source commit and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Install native LLVM SDK and Ninja
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-18-dev clang-18 ninja-build
          test -f /usr/lib/llvm-18/lib/cmake/llvm/LLVMConfig.cmake
      - name: Configure complete native project, not the standalone adapter
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          cmake -S . -B build/inverted-production -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
      - name: Build actual production compiler and narrow admission targets
        run: |
          cmake --build build/inverted-production --parallel 2 --target \
            oreslang-llvmc oreslang-native-inverted-struct-ast-test \
            oreslang-inverted-production-mir-test
      - name: Execute default-compiler guest, parser AST and MIR regressions
        run: |
          ctest --test-dir build/inverted-production \
            -R 'native_inverted_(production_source_to_native|struct_schema_ast)|inverted_production_source_mir_cpp17' \
            --output-on-failure --timeout 180
      - name: Build full native CTest tree
        run: cmake --build build/inverted-production --parallel 2
      - name: Execute complete native CTest suite
        run: ctest --test-dir build/inverted-production --output-on-failure --timeout 180 -j 2
