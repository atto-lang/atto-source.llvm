name: Browser copy modes exact-head guests
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/browser-copy-modes-exact-head.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-copy-guests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/atto-copy-target
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          for p in frontend/src/check.rs frontend/tests/copy_modes_guest.mjs frontend/tests/copy_guest_receipt.mjs frontend/tests/copy_guest_receipt.test.mjs; do
            test "$(git rev-parse "HEAD:$p")" = "$(git hash-object --no-filters "$p")"
          done
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - name: Test receipt validator (host only)
        run: node --test frontend/tests/copy_guest_receipt.test.mjs
      - name: Build real browser frontend host compiler
        run: cargo build --locked --offline --manifest-path frontend/Cargo.toml --bin attoc
      - name: Compile unchanged fixtures and execute actual Wasm guests
        shell: bash
        run: |
          set -euo pipefail
          ATTOC="$CARGO_TARGET_DIR/debug/attoc" node frontend/tests/copy_modes_guest.mjs
