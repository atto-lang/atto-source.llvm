name: Executed Graal LLVM parity result gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  parity-proof-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Execute fail-closed record parity regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
