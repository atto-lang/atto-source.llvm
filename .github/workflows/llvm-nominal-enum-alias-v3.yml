name: Atto LLVM nominal enum case alias v3 AOT
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/NominalEnumV1.hpp'
      - 'tests/native_nominal_enum_alias_v3_test.cpp'
      - 'tests/fixtures/adt-nominal-alias-v3.atto'
      - 'tests/fixtures/adt-nominal-payload-v4.atto'
      - 'tests/native_nominal_enum_payload_v4_test.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/llvm-nominal-enum-alias-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  llvm-native-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact source commit and root tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          echo "ATTO_NOMINAL_ALIAS_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_NOMINAL_ALIAS_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install LLVM and Clang
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev python3
      - name: Build real LLVM compiler and native host admission
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2 --target oreslang-llvmc oreslang-native-nominal-alias-v3-source-test oreslang-native-nominal-payload-v4-source-test
      - name: Run checked source parser and semantic mutation suite (HOST)
        run: ctest --test-dir build -R '^native_nominal_(alias_v3|payload_v4)_source_admission
      - name: ASan and UBSan on bounded typed payload source frontend
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -g -fno-omit-frame-pointer \
            -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined \
            -I src/main/cpp \
            tests/native_nominal_enum_payload_v4_test.cpp \
            -o build/nominal-payload-v4-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            ./build/nominal-payload-v4-sanitized
      - name: Generate guest LLVM IR and execute native O0/O2
        run: |
          set -euo pipefail
          build/oreslang-llvmc --experimental-nominal-enum-v1 tests/fixtures/adt-nominal-alias-v3.atto > build/adt-nominal-alias-v3.ll
          grep -E '^define ' build/adt-nominal-alias-v3.ll
          for opt in 0 2; do
            clang -O"$opt" build/adt-nominal-alias-v3.ll -o "build/adt-nominal-alias-v3-O$opt"
            set +e
            "build/adt-nominal-alias-v3-O$opt"
            status=$?
            set -e
            test "$status" -eq 11 || { echo "Expected guest exit 11, got $status"; exit 1; }
            echo "ATTO_NOMINAL_ALIAS_GUEST_O${opt}_EXIT=11"
          done
      - name: Generate checked Copy-int enum payload guest and execute O0/O2
        run: |
          set -euo pipefail
          build/oreslang-llvmc --experimental-nominal-enum-v1 tests/fixtures/adt-nominal-payload-v4.atto > build/adt-nominal-payload-v4.ll
          grep -E '^define ' build/adt-nominal-payload-v4.ll
          for opt in 0 2; do
            clang -O"$opt" build/adt-nominal-payload-v4.ll -o "build/adt-nominal-payload-v4-O$opt"
            set +e
            "build/adt-nominal-payload-v4-O$opt"
            status=$?
            set -e
            test "$status" -eq 37 || { echo "Expected payload guest exit 37, got $status"; exit 1; }
            echo "ATTO_NOMINAL_PAYLOAD_GUEST_O${opt}_EXIT=37"
          done
      - name: Reject owned/Bytes payload variants before emitting IR
        run: |
          set -euo pipefail
          printf '%s\n' 'define enum WorkerMsg { Run { job_id: Bytes }, Stop }' > build/unsupported-payload.atto
          if build/oreslang-llvmc --experimental-nominal-enum-v1 build/unsupported-payload.atto > build/rejected.ll 2> build/rejected.log; then
            echo 'ERROR: unsupported payload variant compiled'; exit 1
          fi
          test ! -s build/rejected.ll
          grep -q 'payload AOT admits only Copy int' build/rejected.log
 --output-on-failure
      - name: Generate guest LLVM IR and execute native O0/O2
        run: |
          set -euo pipefail
          build/oreslang-llvmc --experimental-nominal-enum-v1 tests/fixtures/adt-nominal-alias-v3.atto > build/adt-nominal-alias-v3.ll
          grep -E '^define ' build/adt-nominal-alias-v3.ll
          for opt in 0 2; do
            clang -O"$opt" build/adt-nominal-alias-v3.ll -o "build/adt-nominal-alias-v3-O$opt"
            set +e
            "build/adt-nominal-alias-v3-O$opt"
            status=$?
            set -e
            test "$status" -eq 11 || { echo "Expected guest exit 11, got $status"; exit 1; }
            echo "ATTO_NOMINAL_ALIAS_GUEST_O${opt}_EXIT=11"
          done
      - name: Reject owned/Bytes payload variants before emitting IR
        run: |
          set -euo pipefail
          printf '%s\n' 'define enum WorkerMsg { Run { job_id: Bytes }, Stop }' > build/unsupported-payload.atto
          if build/oreslang-llvmc --experimental-nominal-enum-v1 build/unsupported-payload.atto > build/rejected.ll 2> build/rejected.log; then
            echo 'ERROR: unsupported payload variant compiled'; exit 1
          fi
          test ! -s build/rejected.ll
          grep -q 'payload AOT admits only Copy int' build/rejected.log
