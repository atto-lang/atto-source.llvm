name: Current LLVM Rust scalar inline task native conformance
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'src/main.rs'
      - 'tests/rust_sync_task_current_e2e.rs'
      - '.github/workflows/rust-sync-task-current.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin source and build compiler
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git log -1 --format='%H %T'
          test -z "$(git status --porcelain)"
          rustc --version
          clang --version
          cargo test --locked --manifest-path frontend/Cargo.toml
          cargo build --locked --release --bin atto-llvm
      - name: Execute real LLVM native guests and negative no-artifact checks
        run: |
          set -euo pipefail
          rustc --edition=2021 -O tests/rust_sync_task_current_e2e.rs -o /tmp/atto-inline-task-current
          sha256sum target/release/atto-llvm /tmp/atto-inline-task-current
          timeout 300 /tmp/atto-inline-task-current "$PWD/target/release/atto-llvm" "$(command -v clang)"
