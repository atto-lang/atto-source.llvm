name: Atto atomic Arc/Weak native host v1
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ArcControlV1.*'
      - 'tests/native_arc_control_v1_test.c'
      - 'tests/run_native_arc_control_v1.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/atto-atomic-arc-host-v1.yml'
  push:
    paths:
      - 'src/main/cpp/oreslang/runtime/ArcControlV1.*'
      - 'tests/native_arc_control_v1_test.c'
      - 'tests/run_native_arc_control_v1.sh'
      - 'CMakeLists.txt'
      - '.github/workflows/atto-atomic-arc-host-v1.yml'
jobs:
  native-c11-sanitizers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Execute GCC and Clang C11 O0/O2 ASan/UBSan matrix
        run: bash tests/run_native_arc_control_v1.sh
