name: Native actor domain ID no-wrap
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeActorDomainId.h'
      - 'src/main/cpp/oreslang/runtime/ActorArena.c'
      - 'src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c'
      - 'tests/native_actor_domain_id_test.c'
      - 'tests/native_actor_domain_runtime_test.c'
      - '.github/workflows/native-actor-domain-id.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c11-exhaustion:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" && test -z "$(git status --porcelain)"
      - name: Exercise C11 allocator terminal failure with GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            "$compiler" --version
            "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -pthread \
              -I src/main/cpp tests/native_actor_domain_id_test.c -o "/tmp/domain-${compiler}"
            "/tmp/domain-${compiler}"
            for source in ActorArena ActorOwnedI64Heap; do
              "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -pthread \
                -I src/main/cpp -c "src/main/cpp/oreslang/runtime/${source}.c" \
                -o "/tmp/${source}-${compiler}.o"
            done
            "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -pthread \
              -I src/main/cpp tests/native_actor_domain_runtime_test.c \
              src/main/cpp/oreslang/runtime/ActorArena.c \
              src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c \
              -o "/tmp/native-runtime-${compiler}"
            "/tmp/native-runtime-${compiler}"
            "$compiler" -std=c11 -Wall -Wextra -Werror -g -O1 -pthread \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -I src/main/cpp tests/native_actor_domain_runtime_test.c \
              src/main/cpp/oreslang/runtime/ActorArena.c \
              src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c \
              -o "/tmp/native-runtime-${compiler}-asan"
            ASAN_OPTIONS=detect_leaks=0 "/tmp/native-runtime-${compiler}-asan"
          done

