name: scoped-local-storage-host-v1
on:
  pull_request:
    paths:
      - "src/main/cpp/oreslang/runtime/ScopedLocalStorageV1.hpp"
      - "tests/native_scoped_local_storage_v1_test.cpp"
      - "scripts/test-scoped-locals-v1.sh"
      - ".github/workflows/scoped-local-storage-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
      - name: report exact tree
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: gcc and clang host-only tests
        run: bash scripts/test-scoped-locals-v1.sh
