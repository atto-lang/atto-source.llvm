name: Native AttoLang DOP SoA guest AOT smoke
on:
  pull_request:
    paths:
      - 'examples/dop-cache/**'
      - 'scripts/verify-dop-atto-aot.sh'
      - 'scripts/test_verify_dop_atto_aot.py'
      - 'scripts/compile-aot.sh'
      - '.github/workflows/dop-atto-soa-native.yml'
      - 'src/main/cpp/oreslang/**'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-guest:
    # Never check out a fork's head inside this private-source workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse --verify HEAD)"
          actual_tree="$(git rev-parse --verify HEAD^{tree})"
          test "$actual_head" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'DOP_CHECKOUT_HEAD=%s\nDOP_CHECKOUT_TREE=%s\n' "$actual_head" "$actual_tree" >> "$GITHUB_ENV"
          printf 'Exact DOP guest checkout: head=%s tree=%s\n' "$actual_head" "$actual_tree"
      - name: Run negative verifier regression suite (host harness only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s scripts -p 'test_verify_dop_atto_aot.py'
      - name: Provision LLVM and Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends llvm-dev clang cmake ninja-build rustc
          command -v llvm-config
          command -v clang
          command -v cmake
          command -v ninja
          command -v rustc
      - name: Build real LLVM guest compiler
        shell: bash
        run: |
          set -euo pipefail
          LLVM_DIR="$(llvm-config --cmakedir)"
          cmake -S . -B "$RUNNER_TEMP/dop-atto-build" -G Ninja \
            -DBUILD_TESTING=OFF -DLLVM_DIR="$LLVM_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/dop-atto-build" --target oreslang-llvmc --parallel 2
          # compile-aot.sh requires the real Rust no-GC IR auditor.
          # Its CMake target is not defined with BUILD_TESTING=OFF.
          rustc --edition=2021 -D warnings scripts/audit_no_gc_ir.rs \
            -o "$RUNNER_TEMP/dop-atto-build/oreslang-no-gc-ir-audit"
          test -x "$RUNNER_TEMP/dop-atto-build/oreslang-llvmc"
          test -x "$RUNNER_TEMP/dop-atto-build/oreslang-no-gc-ir-audit"
          sha256sum "$RUNNER_TEMP/dop-atto-build/oreslang-llvmc" \
            "$RUNNER_TEMP/dop-atto-build/oreslang-no-gc-ir-audit" \
            "$(command -v clang)" examples/dop-cache/soa-int-update.atto
      - name: Validate shell verifier syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/compile-aot.sh
          bash -n scripts/verify-dop-atto-aot.sh
      - name: Prove LLVM ordered root-local lowering and fail-closed diagnostics
        shell: bash
        env:
          CLANG: clang
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          compiler="$RUNNER_TEMP/dop-atto-build/oreslang-llvmc"
          auditor="$RUNNER_TEMP/dop-atto-build/oreslang-no-gc-ir-audit"
          cat > "$work/ordered.atto" <<'ATTO'
          pub routine main(): int {
            let int n = 1;
            n = n + 1;
            let int later = n + 2;
            return later == 4 ? 0 : 1;
          }
          ATTO
          ORESLANG_LLVMC="$compiler" ORES_NO_GC_IR_AUDIT="$auditor" \
            bash scripts/compile-aot.sh "$work/ordered.atto" "$work/ordered"
          timeout 20s "$work/ordered"
          for kind in use_before_declare duplicate_declare; do
            case "$kind" in
              use_before_declare)
                cat > "$work/invalid.atto" <<'ATTO'
          pub routine main(): int {
            let int n = 1;
            n = future + 1;
            let int future = 2;
            return n;
          }
          ATTO
                ;;
              duplicate_declare)
                cat > "$work/invalid.atto" <<'ATTO'
          pub routine main(): int {
            let int n = 1;
            n = n + 1;
            let int n = 2;
            return n;
          }
          ATTO
                ;;
            esac
            if "$compiler" --target=host "$work/invalid.atto" >"$work/out.ll" 2>"$work/diagnostic"; then
              echo "LLVM wrongly accepted $kind" >&2
              exit 1
            fi
            test -s "$work/diagnostic"
          done
          {
            printf 'pub routine main(): int {\\n  let int n = 0;\\n  n = n + 1;\\n'
            for i in $(seq 0 64); do printf '  let int x%s = %s;\\n' "$i" "$i"; done
            printf '  return n;\\n}\\n'
          } > "$work/too-many.atto"
          if "$compiler" --target=host "$work/too-many.atto" >"$work/out.ll" 2>"$work/diagnostic"; then
            echo "LLVM accepted more than 64 ordered locals" >&2
            exit 1
          fi
          grep -F 'native ordered root local limit exceeded (64)' "$work/diagnostic"
      - name: Fail closed without compiler
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ORESLANG_LLVMC=/missing/oreslang-llvmc bash scripts/verify-dop-atto-aot.sh
          rc=$?
          set -e
          test "$rc" -eq 69
      - name: Fail closed without Clang
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ORESLANG_LLVMC="$RUNNER_TEMP/dop-atto-build/oreslang-llvmc" \
            CLANG=/missing/clang bash scripts/verify-dop-atto-aot.sh
          rc=$?
          set -e
          test "$rc" -eq 69
      - name: Fail closed without no-GC auditor
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ORESLANG_LLVMC="$RUNNER_TEMP/dop-atto-build/oreslang-llvmc" \
            ORES_NO_GC_IR_AUDIT=/missing/oreslang-no-gc-ir-audit \
            bash scripts/verify-dop-atto-aot.sh
          rc=$?
          set -e
          test "$rc" -eq 69
      - name: Compile and execute real .atto guest AOT
        shell: bash
        env:
          CLANG: clang
        run: |
          set -euo pipefail
          ORESLANG_LLVMC="$RUNNER_TEMP/dop-atto-build/oreslang-llvmc" \
            ORES_NO_GC_IR_AUDIT="$RUNNER_TEMP/dop-atto-build/oreslang-no-gc-ir-audit" \
            bash scripts/verify-dop-atto-aot.sh
          test "$(git rev-parse --verify HEAD)" = "$DOP_CHECKOUT_HEAD"
          test "$(git rev-parse --verify HEAD^{tree})" = "$DOP_CHECKOUT_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'Verified guest source head=%s tree=%s\n' "$DOP_CHECKOUT_HEAD" "$DOP_CHECKOUT_TREE"
