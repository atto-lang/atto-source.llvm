name: Capability I/O host lifecycle v1 (reference only)
on:
  pull_request:
    paths:
      - 'contracts/v1/capability_io_lifecycle_v1.hpp'
      - 'contracts/v1/capability_io_lifecycle_v1_test.cpp'
      - '.github/workflows/capability-io-lifecycle-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit and clean checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          echo "HOST_REFERENCE_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Execute GCC and Clang ASan/UBSan host-only lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -Wall -Wextra -Werror -pthread -O1 \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Icontracts/v1 contracts/v1/capability_io_lifecycle_v1_test.cpp \
              -o "$RUNNER_TEMP/ores_capability_io_test"
            ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/ores_capability_io_test" \
              | grep -Fx 'CAPABILITY_IO_HOST_LIFECYCLE_REFERENCE_PASS'
          done
          echo "REFERENCE_ONLY_NO_GUEST_TRANSPORT_PARITY"
