name: LLVM compiler and native execution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llvm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llvm-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # PR default checkout tests a synthetic merge commit, not the PR's
          # exact compiler source tree. Pin the immutable head explicitly.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Authenticate exact source commit before tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "::error::checkout is not at the exact source commit"
            exit 1
          }
          git diff --quiet
          git diff --cached --quiet
          echo "EXACT_SOURCE_COMMIT=$actual"
          echo "EXACT_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
      - name: Validate pinned numeric reference vectors and backend claim manifest (data-only)
        run: python3 -m unittest discover -s tests -p 'test_numeric_*.py' -v
      - name: Install LLVM toolchain and native linker
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        id: build_native
        run: cmake --build build --parallel 2
      - name: Verify checked-i64 CTest inventory before full native suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_ctest_manifest_gate.py -v
          python3 tests/ctest_manifest_gate.py --build-dir build --min-tests 250
      - name: Verify real checked-result compiler ABI before full CTest
        id: checked_i64_guest
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --timeout 240 --no-tests=error \
            --output-junit "$GITHUB_WORKSPACE/build/checked-i64-ctest.xml" \
            -R '^numeric_experimental_checked_(i64_status_abi|pure_function_graph|result_function_graph)$'
      - name: Verify parser, IR and native execution
        id: all_native_tests
        run: ctest --test-dir build --output-on-failure --timeout 240 --parallel 2 --output-junit "$GITHUB_WORKSPACE/build/full-ctest.xml"
      - name: Repeat actor stress and cancellation races
        run: ctest --test-dir build -R hungry_carrier_async_bounded_cancel --repeat until-fail:12 --output-on-failure
      - name: ASan and UBSan native actor memory and concurrency smoke
        run: |
          clang++ -std=c++17 -O1 -g -pthread -fno-omit-frame-pointer \
            -fsanitize=address,undefined \
            -I src/main/cpp \
            tests/hungry_carrier_test.cpp \
            src/main/cpp/oreslang/runtime/HungryCarrier.cpp \
            src/main/cpp/oreslang/runtime/ParkingSignal.cpp \
            -o build/hungry-carrier-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            ./build/hungry-carrier-sanitized

      - name: Sanitized actor-owned generational graph heap
        run: |
          clang++ -std=c++17 -O1 -g \
            -Wall -Wextra -Wpedantic -Werror -fno-omit-frame-pointer \
            -fsanitize=address,undefined \
            -I src/main/cpp \
            tests/actor_owned_graph_heap_test.cpp \
            src/main/cpp/oreslang/runtime/HungryCarrier.cpp \
            src/main/cpp/oreslang/runtime/ParkingSignal.cpp \
            -pthread \
            -o build/actor-owned-graph-heap-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=halt_on_error=1 \
            ./build/actor-owned-graph-heap-sanitized

      - name: ThreadSanitizer actor data-race stress
        run: |
          g++ -std=c++17 -O1 -g -pthread -fno-omit-frame-pointer \
            -fPIE -pie -fsanitize=thread \
            -I src/main/cpp \
            tests/hungry_carrier_test.cpp \
            src/main/cpp/oreslang/runtime/HungryCarrier.cpp \
            src/main/cpp/oreslang/runtime/ParkingSignal.cpp \
            -o build/hungry-carrier-tsan
          TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1 \
            ./build/hungry-carrier-tsan

      - name: Write exact-head native-run evidence metadata
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          NATIVE_BUILD_OUTCOME: ${{ steps.build_native.outcome }}
          CHECKED_I64_OUTCOME: ${{ steps.checked_i64_guest.outcome }}
          FULL_CTEST_OUTCOME: ${{ steps.all_native_tests.outcome }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git_identity(revision):
              try:
                  return subprocess.check_output(
                      ["git", "rev-parse", revision], text=True,
                      stderr=subprocess.DEVNULL, timeout=5).strip()
              except (OSError, subprocess.SubprocessError):
                  return ""

          payload = {
              "schema": "oreslang-llvm-checked-i64-native-evidence-v1",
              "classification": "UNVERIFIED_UNTIL_EXTERNAL_RUN_JOBS_AND_GUEST_RESULTS_REVIEW",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": os.environ["REPOSITORY_ID"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "expected_source_commit": os.environ["EXPECTED_HEAD"],
              "observed_checkout_commit": git_identity("HEAD"),
              "observed_checkout_tree": git_identity("HEAD^{tree}"),
              "build_step": os.environ["NATIVE_BUILD_OUTCOME"],
              "checked_i64_guest_step": os.environ["CHECKED_I64_OUTCOME"],
              "full_ctest_step": os.environ["FULL_CTEST_OUTCOME"],
              "runner_name": os.environ.get("RUNNER_NAME", ""),
              "verified_compiled_claim": False,
          }
          dest = Path(os.environ["RUNNER_TEMP"]) / "llvm-native-evidence.json"
          dest.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n",
                          encoding="utf-8")
          print("LLVM_NATIVE_EVIDENCE_METADATA_WRITTEN=YES")
          PY
      - name: Upload native CTest and exact-head evidence (three-day retention)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-native-ctest-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/llvm-native-evidence.json
            build/checked-i64-ctest.xml
            build/full-ctest.xml
          if-no-files-found: error
          retention-days: 3
