name: Contextual specialization bundled frontend guest
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/contextual-scalar-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-contextual-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Authenticate immutable checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
      - name: Compiler regressions and emitted Wasm guest
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          node --version
          cargo +1.85.1 test --locked --manifest-path frontend/Cargo.toml --lib contextual_specialization::tests
          cargo +1.85.1 test --locked --manifest-path frontend/Cargo.toml --lib contextual_specialization::tests::guest_capture -- --ignored
      - name: Entire bundled frontend library
        run: cargo +1.85.1 test --locked --manifest-path frontend/Cargo.toml --lib
