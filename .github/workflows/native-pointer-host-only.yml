name: Native pointer host-only security
on:
  pull_request:
    paths:
      - '.github/workflows/native-pointer-host-only.yml'
      - 'src/main/cpp/oreslang/runtime/ActorHeapIdentity.hpp'
      - 'src/main/cpp/oreslang/runtime/TrustedPointerWindow.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeRegionRegistry.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeRegionRuntimeAuthority.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorSupervisor.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.c'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.h'
      - 'tests/trusted_pointer_window_test.cpp'
      - 'tests/native_region_registry_test.cpp'
      - 'tests/native_region_runtime_authority_test.cpp'
      - 'tests/native_actor_supervisor_pointer_integration_test.cpp'
      - 'scripts/native-pointer-exact-head-verify.sh'
      - 'tests/native_pointer_verifier_selftest.py'
      - 'tests/native_region_negative_compile.cpp'
      - 'tests/run_native_pointer_negative_compile.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: gcc-release
            compiler: g++
            flags: '-O2 -DNDEBUG'
          - profile: clang-asan-ubsan
            compiler: clang++
            flags: '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          - profile: gcc-tsan
            compiler: g++
            flags: '-O1 -g -fsanitize=thread -fno-omit-frame-pointer'
    name: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject spoofed native test evidence (source-free)
        shell: bash
        run: python3 tests/native_pointer_verifier_selftest.py scripts/native-pointer-exact-head-verify.sh
      - name: Compile exact checked-out host tests
        env:
          CXX: ${{ matrix.compiler }}
          CXXFLAGS: ${{ matrix.flags }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-pointer-host-only
          for name in trusted_pointer_window native_region_registry native_region_runtime_authority; do
            "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread \
              $CXXFLAGS -Isrc/main/cpp "tests/${name}_test.cpp" \
              -o "build/native-pointer-host-only/${name}_test"
          done
      - name: Run native host security tests
        shell: bash
        run: |
          set -euo pipefail
          for name in trusted_pointer_window native_region_registry native_region_runtime_authority; do
            "build/native-pointer-host-only/${name}_test"
          done
      - name: Compile and run real scheduler-pointer integration
        env:
          CC: ${{ matrix.compiler == 'clang++' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler }}
          EXTRA_FLAGS: ${{ matrix.flags }}
        shell: bash
        run: |
          set -euo pipefail
          "$CC" -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread \
            $EXTRA_FLAGS -Isrc/main/cpp -c \
            src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o build/native-pointer-host-only/NativeActorScheduler.o
          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread \
            $EXTRA_FLAGS -Isrc/main/cpp \
            tests/native_actor_supervisor_pointer_integration_test.cpp \
            build/native-pointer-host-only/NativeActorScheduler.o \
            -o build/native-pointer-host-only/native_actor_supervisor_pointer_integration_test
          build/native-pointer-host-only/native_actor_supervisor_pointer_integration_test
      - name: Verify negative compiler diagnostics
        env:
          CXX: ${{ matrix.compiler }}
        shell: bash
        run: bash tests/run_native_pointer_negative_compile.sh
