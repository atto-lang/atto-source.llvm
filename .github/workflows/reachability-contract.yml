name: reachability-contract

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/Reachability.hpp'
      - 'src/main/cpp/oreslang/main.cpp'
      - 'tests/native_reachability_contract_test.cpp'
      - 'tests/contract.py'
      - 'tests/fixtures/tree-shake-dead-symbols.ores'
      - 'tests/fixtures/tree-shake-library.ores'
      - 'CMakeLists.txt'
      - '.github/workflows/reachability-contract.yml'

jobs:
  native-reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone native reachability contract
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp \
            tests/native_reachability_contract_test.cpp \
            -o /tmp/oreslang-native-reachability-test
      - name: Run contract tests
        run: /tmp/oreslang-native-reachability-test
