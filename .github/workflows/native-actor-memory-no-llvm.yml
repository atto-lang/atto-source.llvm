name: Native actor ownership and memory (no LLVM dependency)
on:
  pull_request:
permissions:
  contents: read
jobs:
  native-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [optimized, sanitized]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact source checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" && test -z "$(git status --porcelain)"
      - name: Run native actor checks
        env:
          MODE: ${{ matrix.mode }}
        run: bash scripts/verify_native_actor_memory.sh "$MODE"
