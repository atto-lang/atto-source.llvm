name: Actor-owned logical frames (native host gate)
on:
  pull_request:
    paths:
      - src/main/cpp/oreslang/runtime/ActorFrameArena.hpp
      - src/main/cpp/oreslang/runtime/HungryCarrier.hpp
      - src/main/cpp/oreslang/runtime/HungryCarrier.cpp
      - tests/actor_frame_arena_test.cpp
      - tests/native_actor_frame_integration_test.cpp
      - CMakeLists.txt
      - .github/workflows/actor-frame-isolation-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-frame-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false

      - name: Assert exact head and test source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/frame-tree.txt"
          for source in src/main/cpp/oreslang/runtime/ActorFrameArena.hpp \
                        src/main/cpp/oreslang/runtime/HungryCarrier.cpp \
                        tests/actor_frame_arena_test.cpp \
                        tests/native_actor_frame_integration_test.cpp; do
            test "$(git hash-object "$source")" = "$(git rev-parse "HEAD:$source")"
          done

      - name: Install native LLVM build toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ clang-19 llvm-19-dev

      - name: Compile real native carrier and bounded arena CTests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/build-frame" -G Ninja \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR=/usr/lib/llvm-19/lib/cmake/llvm
          cmake --build "$RUNNER_TEMP/build-frame" --parallel 2 \
            --target oreslang-actor-frame-arena-test \
                     oreslang-native-actor-frame-integration-test \
                     oreslang-hungry-carrier-test \
                     oreslang-native-actor-heap-test
          ctest --test-dir "$RUNNER_TEMP/build-frame" \
            --output-on-failure --timeout 45 \
            -R '^(native_actor_frame_arena_owner_suspend_migrate|native_actor_frame_suspension_sibling_survival|hungry_carrier_async_bounded_cancel|native_actor_heap_isolation_and_drop)$' \
            | tee "$RUNNER_TEMP/actor-frame-ctest.log"
          grep -E '100% tests passed, 0 tests failed out of 4' "$RUNNER_TEMP/actor-frame-ctest.log"

      - name: Execute ASan and UBSan actor-frame fault/cleanup matrix
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 \
            -pthread -I src/main/cpp \
            tests/actor_frame_arena_test.cpp -o "$RUNNER_TEMP/frame-sanitized"
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1 \
            -pthread -I src/main/cpp \
            tests/native_actor_frame_integration_test.cpp \
            src/main/cpp/oreslang/runtime/HungryCarrier.cpp \
            src/main/cpp/oreslang/runtime/ParkingSignal.cpp \
            -o "$RUNNER_TEMP/frame-carrier-sanitized"
          "$RUNNER_TEMP/frame-sanitized" | tee "$RUNNER_TEMP/frame-sanitized.log"
          "$RUNNER_TEMP/frame-carrier-sanitized" | tee "$RUNNER_TEMP/frame-carrier-sanitized.log"
          grep -F 'PASS actor-owned frame bytes:' "$RUNNER_TEMP/frame-sanitized.log"
          grep -F 'PASS actor carrier owned frame isolation' "$RUNNER_TEMP/frame-carrier-sanitized.log"

      - name: Classify actual evidence without claiming guest parity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          {
            printf 'evidence_class=NATIVE_HOST_RUNTIME_ONLY\n'
            printf 'compiler_backed_atto_stack=NOT_EXECUTED\n'
            printf 'low_native_stack_fault_containment=NOT_VERIFIED\n'
            printf 'actor_source_scheduler_integration=NOT_VERIFIED\n'
            printf 'head_sha=%s\n' "$EXPECTED_HEAD"
            printf 'tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            sha256sum "$RUNNER_TEMP/frame-sanitized" "$RUNNER_TEMP/frame-carrier-sanitized"
          } | tee "$RUNNER_TEMP/actor-frame-evidence.txt"

      - name: Preserve proof logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-frame-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/actor-frame-ctest.log
            ${{ runner.temp }}/frame-sanitized.log
            ${{ runner.temp }}/frame-carrier-sanitized.log
            ${{ runner.temp }}/actor-frame-evidence.txt
          if-no-files-found: warn
          retention-days: 7
