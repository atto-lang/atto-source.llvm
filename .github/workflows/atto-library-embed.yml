name: AttoLang canonical library embed (SOURCE ONLY)
on:
  pull_request:
    paths:
      - 'stdlib/numeric.atto'
      - 'stdlib/alloc/**'
      - 'tools/atto-library-embed/**'
      - 'src/main/cpp/oreslang/frontend/Generated*Atto.inc'
      - 'src/main/cpp/oreslang/frontend/CoreLibrarySources.hpp'
      - 'tests/atto_library_embed_cpp17_probe.cpp'
      - '.github/workflows/atto-library-embed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-embed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source HEAD and Git tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          echo "ATTO_SOURCE_HEAD=$EXPECTED_HEAD TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Verify pinned canonical .atto source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object stdlib/numeric.atto)" = "5ced991f1d49b3c2a60fdd72b9003c0a4d18cd72"
          test "$(git hash-object stdlib/alloc/int_buffer.atto)" = "25b3d4bc06a0c859aacadaf0795414027a076bdc"
          test "$(git hash-object stdlib/alloc/int_buffer_bundle.atto)" = "07c7083e099a18f1db7097f9639efc677070eb95"
      - name: Execute Rust generator tests and immutable checks
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path tools/atto-library-embed/Cargo.toml
          cargo run --locked --manifest-path tools/atto-library-embed/Cargo.toml -- --check
      - name: Compile C++17 literal inclusion probe
        run: |
          set -euo pipefail
          c++ -std=c++17 -Isrc/main/cpp -fsyntax-only tests/atto_library_embed_cpp17_probe.cpp
          echo "COMPILER_BACKED_GUEST_EXECUTION=NOT_EXECUTED"
