name: Exact guarded return-match frontend compiler and guest proof
on:
  pull_request:
    paths:
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'ci/test_native_aot.sh'
      - '.github/workflows/guarded-return-match-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-wasm-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact head, parser and shared fixture admission
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object frontend/src/check.rs)" = "a1bc0be3f46ee46319fe92f66dce43254d0f6846"
          test "$(git hash-object frontend/src/parser.rs)" = "69724a8e2518e383503aae72eb9aaf0d8c8ad54c"
          test "$(git hash-object frontend/src/lexer.rs)" = "d61877c91a83b0015ee9bdbf381e9a2d3069dab4"
          test "$(git hash-object frontend/tests/fixtures/pass/match-guard-block-return.atto)" = "603df679e1e9b7415cb8b798d4a2143545dd27b8"
          test "$(git hash-object frontend/tests/fixtures/pass/match-guard-block-caret.atto)" = "0b2addfef29cd76d60d90bf081f4d326ea2d70df"
          test "$(git hash-object frontend/tests/fixtures/fail/match-guard-no-fallback.atto)" = "23f8597125af43b3cab294ba8dc9b110d9983ef5"
          test "$(git hash-object frontend/tests/fixtures/fail/match-guard-block-fallthrough.atto)" = "a8ec2c699c4a521508bee85f55a49888064c6948"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-option-guard-hit.atto)" = "7fb872ba97236df6e1a6b83df55f215665486fad"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-result-ok-guard.atto)" = "ee40cd523d2def9352ad43b8661949334756a9b3"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-guard-skips-wrong-result-tag.atto)" = "4730792d63852a885c62642c2f79facf8956ad04"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-whole-value-guard-binding.atto)" = "4bffdd8d9b828acb907988495e4ef303aa384d2e"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-result-err-discard.atto)" = "720b5d7c3e808b06b1b3bbfe1056a52ef483f1cb"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-result-ok-discard.atto)" = "8a36d6c7a1c9919fc0cf2330132c61fe41eef37e"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-option-some-discard.atto)" = "d85396ed3c3635459a4c560bb93ff233b89c956f"
          test "$(git hash-object frontend/tests/fixtures/fail/adt-discard-duplicate-tag.atto)" = "36d288f29a9651868e6e3bda37fc2391a437f539"
          test "$(git hash-object frontend/tests/fixtures/fail/adt-discard-none-arity.atto)" = "284ed9119ce66f69c85cb9580afa067487329d48"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-question-err-propagation.atto)" = "6bc02a6b44efd0949ec19b8969c0801d2946e5c8"
          test "$(git hash-object frontend/tests/fixtures/pass/adt-question-none-propagation.atto)" = "71d3fcc15a233df76b34ad576f49f3b7f61ecb4f"
          test "$(git hash-object frontend/tests/fixtures/fail/adt-question-incompatible-return.atto)" = "9d4023e778ef52af7734aa5f68b3e523ae41d5f8"
          test "$(git hash-object frontend/tests/fixtures/fail/adt-question-cross-family.atto)" = "d966eb0b932ba4931daf2593fff35b36aa3bfa7c"
          git diff --quiet HEAD --
          git rev-parse HEAD HEAD^{tree}
      - name: Rust 1.85.1 / wasm32 compiler toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.85.1
      - name: Compile parser, checker and full negative corpus
        run: cargo test --locked --manifest-path frontend/Cargo.toml --all-targets --verbose
      - name: Build host attoc and compiled wasm32 attoc library
        run: |
          cargo build --locked --manifest-path frontend/Cargo.toml --bin attoc
          cargo rustc --locked --release --manifest-path frontend/Cargo.toml --lib --target wasm32-unknown-unknown --crate-type cdylib -- -C link-arg=--max-memory=67108864
      - name: Execute eleven real compiled guests, six no-artifact failures, byte parity
        env:
          ATTO_COMPILER_WASM: frontend/target/wasm32-unknown-unknown/release/atto_compiler.wasm
        run: node frontend/tests/match-return-guest.mjs
      - name: Evidence boundary
        run: |
          echo "FRONTEND_NATIVE_RUST_AND_WASM32_COMPILED_GUEST=EXECUTED"
          echo "NATIVE_CPP_LLVM_AOT=NOT_PROVEN_BY_THIS_JOB"
          echo "JAVA_NET_FORGE_CRANELIFT_JS=NOT_PROVEN_BY_THIS_JOB"
