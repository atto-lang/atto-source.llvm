name: Elastic actor native memory v1 (HOST ONLY)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorElasticNativeArenaV1.*'
      - 'tests/actor_elastic_native_arena_v1_test.c'
      - 'tests/run_elastic_native_arena_v1.sh'
      - '.github/workflows/actor-elastic-native-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source SHA and clean checkout
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse 'HEAD^{tree}'
          git hash-object src/main/cpp/oreslang/runtime/ActorElasticNativeArenaV1.h
          git hash-object src/main/cpp/oreslang/runtime/ActorElasticNativeArenaV1.c
          git hash-object tests/actor_elastic_native_arena_v1_test.c
      - name: GCC and Clang, O1 and O2, ASan/UBSan (HOST ONLY)
        shell: bash
        run: bash tests/run_elastic_native_arena_v1.sh
