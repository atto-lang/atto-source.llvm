name: LLVM O0/O2 host pipeline (no guest parity)
on:
  pull_request:
    paths:
      - scripts/compile-aot.sh
      - scripts/test-compile-aot-optimization.sh
      - .github/workflows/aot-optimization-smoke.yml
  push:
    paths:
      - scripts/compile-aot.sh
      - scripts/test-compile-aot-optimization.sh
      - .github/workflows/aot-optimization-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clang-native-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify exact checked-out commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "HOST_ONLY_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_STEP_SUMMARY"
      - name: Test synthetic IR Clang O0 and O2 pipeline
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/compile-aot.sh
          bash -n scripts/test-compile-aot-optimization.sh
          bash scripts/test-compile-aot-optimization.sh
