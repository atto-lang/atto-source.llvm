name: LLVM actor i64 exclusive loans (host C only)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c'
      - 'src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.h'
      - 'tests/actor_owned_i64_exclusive_loan.c'
      - 'scripts/test-actor-i64-exclusive-loan-host.sh'
      - '.github/workflows/native-i64-exclusive-loan-source-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Native C actor lease runtime GCC and Clang
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          bash scripts/test-actor-i64-exclusive-loan-host.sh
