name: Executable bounded Pointer<int> LLVM native AOT M1
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/PointerIntAot.hpp'
      - 'src/main/cpp/oreslang/frontend/StaticFfiI64Aot.hpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/frontend/ModuleLoader.cpp'
      - 'src/main/cpp/oreslang/frontend/ModuleLoader.hpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/main.cpp'
      - 'tests/pointer_int_native_e2e.py'
      - 'tests/static_ffi_i64_native_e2e.py'
      - 'tests/ffi_normal_i64_native_e2e.py'
      - 'docs/STATIC_FFI_I64_NATIVE_AOT_M0.md'
      - 'tests/guard_native_e2e.py'
      - 'docs/POINTER_INT_AOT_M1.md'
      - '.github/workflows/pointer-int-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pointer-int-native-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
    steps:
      - name: Checkout exact reviewed source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head, tree and pointer compiler/test Git blobs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object src/main/cpp/oreslang/frontend/PointerIntAot.hpp)" = 46976e217186637eb45b4f7faf559d4bd9e23bf1
          test "$(git hash-object tests/pointer_int_native_e2e.py)" = c33e9de3c03eb6072f882ee2893c13f3114bd453
          test "$(git hash-object src/main/cpp/oreslang/main.cpp)" = a827c2c8abc44a6fb6e902616ece0e0b781accec
          git rev-parse HEAD HEAD^{tree}
          git status --porcelain
      - name: Install LLVM18 and Clang18 real native toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-18-dev clang-18 lld-18 libzstd-dev cmake file
          test -d "$LLVM_DIR"
      - name: Build compiler from reviewed exact source
        run: |
          set -euo pipefail
          cmake -S . -B build/pointer-m1 -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_DIR"
          cmake --build build/pointer-m1 --target oreslang-llvmc -j2
          test -x build/pointer-m1/oreslang-llvmc
          sha256sum build/pointer-m1/oreslang-llvmc
      - name: Execute compiled bounded Pointer<int> native guests and ASan UBSan negatives
        run: |
          set -euo pipefail
          python3 tests/pointer_int_native_e2e.py --compiler build/pointer-m1/oreslang-llvmc --clang /usr/bin/clang-18
      - name: Regression — execute existing compiled scalar guard guests
        run: |
          set -euo pipefail
          python3 tests/guard_native_e2e.py --compiler build/pointer-m1/oreslang-llvmc --clang /usr/bin/clang-18
      - name: Execute statically linked C i64 foreign downcalls and no-IR negatives
        run: |
          set -euo pipefail
          python3 tests/static_ffi_i64_native_e2e.py --compiler build/pointer-m1/oreslang-llvmc --clang /usr/bin/clang-18
      - name: Execute normal compiler FFI i64 source through signed C AOT ABI
        run: |
          set -euo pipefail
          python3 tests/ffi_normal_i64_native_e2e.py --compiler build/pointer-m1/oreslang-llvmc --clang /usr/bin/clang-18
      - name: Accurate evidence limits
        run: |
          echo 'POINTER_INT_STACK_AOT=RESTRICTED_OPT_IN_ONLY'
          echo 'GENERAL_POINTER_T_HEAP_AOT=UNSUPPORTED'
          echo 'POINTER_BORROW_SHARE_ACTOR_TRANSFER=NOT_EXECUTED'
          echo 'OTHER_BACKEND_PARITY=NOT_EXECUTED'
          echo 'FFI_ACTOR_SCHEDULING_AND_PRODUCTION_PERMISSION=UNSUPPORTED'
