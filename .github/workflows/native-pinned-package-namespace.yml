name: Native pinned package namespace execution

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/frontend/PackageNamespaceGraph.hpp'
      - 'src/main/cpp/oreslang/frontend/PinnedNamespaceLoader.hpp'
      - 'src/main/cpp/oreslang/frontend/PinnedNamespaceLoader.cpp'
      - 'src/main/cpp/oreslang/backend/**'
      - 'src/main/cpp/oreslang/types/**'
      - 'tests/native_package_namespace_graph_test.cpp'
      - 'tests/native_pinned_namespace_ir_test.cpp'
      - 'tests/pinned_namespace_execution.cmake'
      - 'tests/namespace_lifecycle_parity.cmake'
      - 'docs/NATIVE_PACKAGE_NAMESPACE_GRAPH_PHASE1.md'
      - 'CMakeLists.txt'
      - '.github/workflows/native-pinned-package-namespace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-namespace-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify immutable exact-head checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "EXACT_HEAD=$EXPECTED_HEAD EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev

      - name: Configure focused native namespace gates
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build compiler, host graph, and pinned namespace driver
        run: cmake --build build --parallel 2 --target oreslang-llvmc oreslang-native-namespace-package-index-test oreslang-native-pinned-namespace-ir-test

      - name: Verify focused CTest gates are actually registered
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --show-only=json-v1 > build/namespace-ctest.json
          grep -Fq '"name" : "native_namespace_package_identity_source_only"' build/namespace-ctest.json
          grep -Fq '"name" : "native_pinned_namespace_package_exit_43"' build/namespace-ctest.json
          grep -Fq '"name" : "native_namespace_lifecycle_fail_closed"' build/namespace-ctest.json

      - name: Execute graph boundary, pinned namespace, and lifecycle gates
        run: ctest --test-dir build --output-on-failure --timeout 90 -R '^(native_namespace_package_identity_source_only|native_pinned_namespace_package_exit_43|native_namespace_lifecycle_fail_closed)$'
