name: Atto LLVM-to-Volucro compiled Wasm guest guard unit tests
on:
  pull_request:
    paths:
      - "tests/atto_volucro_compiled_guest_*"
      - ".github/workflows/atto-volucro-wasm-guard-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-wasm-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact pull request head, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head, parser syntax and real Node-Wasm negative unit tests
        shell: bash
        env:
          ATTO_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$ATTO_EXPECTED_HEAD"
          node --version
          node --check tests/atto_volucro_compiled_guest_faults_lib.mjs
          node --check tests/atto_volucro_compiled_guest_faults.mjs
          node --check tests/atto_volucro_compiled_guest_guard.mjs
          node --test tests/atto_volucro_compiled_guest_faults.test.mjs tests/atto_volucro_compiled_guest_guard.test.mjs
          echo "ATTO_COMPILED_WASM_NODE_GUARD_TESTS_EXECUTED_HEAD=$ATTO_EXPECTED_HEAD"
          echo "NODE_WASM_ENGINE_ONLY_NOT_ATTO_COMPILER_OR_VOLUCRO_WASMI"
