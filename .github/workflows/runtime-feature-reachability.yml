name: runtime-feature-reachability

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/Reachability.hpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.hpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/main.cpp'
      - 'tests/native_runtime_feature_reachability_test.cpp'
      - 'tests/native_tree_shaking.py'
      - 'CMakeLists.txt'
      - '.github/workflows/runtime-feature-reachability.yml'

permissions:
  contents: read

jobs:
  runtime-feature-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile standalone graph adversaries
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp \
            tests/native_runtime_feature_reachability_test.cpp \
            -o /tmp/oreslang-runtime-feature-reachability
      - name: Run standalone graph adversaries
        run: /tmp/oreslang-runtime-feature-reachability
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev python3
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build compiler and graph test
        run: cmake --build build --target oreslang-llvmc oreslang-runtime-feature-reachability-test --parallel 2
      - name: Execute graph CTest
        run: ctest --test-dir build -R '^native_runtime_feature_reachability$' --output-on-failure --timeout 60
      - name: Execute compiler tree-shaking proof
        run: ctest --test-dir build -R '^native_tree_shaking_direct_calls$' --output-on-failure --timeout 180
