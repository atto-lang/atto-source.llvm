name: LLVM native byte primitive host-only regression
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/CheckedByteAccess.hpp'
      - 'tests/byte_buffer_v1.cpp'
      - '.github/workflows/byte-buffer-host-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-byte-host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['g++', 'clang++']
        standard: ['c++17', 'c++20']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and execute host-only byte primitive, ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.compiler }}" -std="${{ matrix.standard }}" -O1 -Wall -Wextra -Werror -pedantic -UNDEBUG \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/byte_buffer_v1.cpp -o /tmp/atto-byte-host
          /tmp/atto-byte-host
