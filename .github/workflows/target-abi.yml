name: Target ABI and DOP safety (x86-64 and ARM64)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target-abi:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [g++, clang++]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute exact ABI/DOP safety suites with ASan and UBSan
        env:
          CXX_BIN: ${{ matrix.compiler }}
        run: bash scripts/verify-target-abi-dop.sh "$CXX_BIN"
