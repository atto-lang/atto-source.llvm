name: Canonical AttoLang actor-private heap native guest
on:
  pull_request:
    paths:
      - 'tests/atto_actor_tenant_e2e.py'
      - 'tests/fixtures/atto-actor-*.atto'
      - '.github/workflows/atto-actor-tenant-native-guest.yml'
      - 'src/main/cpp/oreslang/frontend/**'
      - 'src/main/cpp/oreslang/backend/**'
      - 'src/main/cpp/oreslang/runtime/**'
      - 'scripts/audit_no_gc_ir.rs'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  compiler-backed-actor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable compiler/fixture PR HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify exact source HEAD, Git tree and immutable fixture blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/atto-source-tree.txt"
          for path in tests/atto_actor_tenant_e2e.py tests/fixtures/atto-actor-*.atto scripts/audit_no_gc_ir.rs; do
            test "$(git hash-object "$path")" = "$(git rev-parse "HEAD:$path")"
            git hash-object "$path"
          done
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(cat "$RUNNER_TEMP/atto-source-tree.txt")"
      - name: Install pinned LLVM 19 and Clang 19
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 llvm-19-dev cmake ninja-build python3
      - name: Build real source frontend and strict no-GC auditor
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/atto-actor-compiler" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DLLVM_DIR=/usr/lib/llvm-19/lib/cmake/llvm
          cmake --build "$RUNNER_TEMP/atto-actor-compiler" --target oreslang-llvmc --parallel 2
          rustc --edition=2021 -D warnings scripts/audit_no_gc_ir.rs -o "$RUNNER_TEMP/atto-actor-compiler/oreslang-no-gc-ir-audit"
          rustc --edition=2021 -D warnings --test scripts/audit_no_gc_ir.rs -o "$RUNNER_TEMP/atto-actor-compiler/no-gc-ir-audit-tests"
          "$RUNNER_TEMP/atto-actor-compiler/no-gc-ir-audit-tests" --test-threads=1
          sha256sum "$RUNNER_TEMP/atto-actor-compiler/oreslang-llvmc" "$RUNNER_TEMP/atto-actor-compiler/oreslang-no-gc-ir-audit"
      - name: Execute compiled AttoLang actor guests with real native heaps
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/atto_actor_tenant_e2e.py \
            --compiler "$RUNNER_TEMP/atto-actor-compiler/oreslang-llvmc" \
            --clang /usr/bin/clang-19 \
            --auditor "$RUNNER_TEMP/atto-actor-compiler/oreslang-no-gc-ir-audit" \
            --root . | tee "$RUNNER_TEMP/atto-actor-native.log"
          grep -F 'ATTO_ACTOR_ISOLATION_MATRIX_PASS|positive=2|negative=2|profile=native|' \
            "$RUNNER_TEMP/atto-actor-native.log"
      - name: Execute compiled actor guests under ASan and UBSan
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          python3 -I tests/atto_actor_tenant_e2e.py \
            --compiler "$RUNNER_TEMP/atto-actor-compiler/oreslang-llvmc" \
            --clang /usr/bin/clang-19 \
            --auditor "$RUNNER_TEMP/atto-actor-compiler/oreslang-no-gc-ir-audit" \
            --root . --sanitize | tee "$RUNNER_TEMP/atto-actor-sanitized.log"
          grep -F 'ATTO_ACTOR_ISOLATION_MATRIX_PASS|positive=2|negative=2|profile=asan_ubsan|' \
            "$RUNNER_TEMP/atto-actor-sanitized.log"
      - name: Bind executed receipts to exact head and preserve negative scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          for path in tests/atto_actor_tenant_e2e.py tests/fixtures/atto-actor-*.atto; do
            test "$(git hash-object "$path")" = "$(git rev-parse "HEAD:$path")"
          done
          for profile in native sanitized; do
            grep -Fc 'ATTO_NATIVE_ACTOR_GUEST_PASS|' "$RUNNER_TEMP/atto-actor-$profile.log" | grep -Fx '2'
            grep -Fc 'ATTO_ACTOR_REJECT|' "$RUNNER_TEMP/atto-actor-$profile.log" | grep -Fx '2'
          done
          {
            echo "evidence_class=compiled-atto-native-actor"
            echo "tenant_sandbox=NOT_VERIFIED"
            echo "wasm_guest=NOT_EXECUTED"
            echo "java_net_forge=NOT_EXECUTED"
            echo "head_sha=$EXPECTED_HEAD"
            echo "head_tree_sha=$(git rev-parse 'HEAD^{tree}')"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "compiler_sha256=$(sha256sum "$RUNNER_TEMP/atto-actor-compiler/oreslang-llvmc" | cut -d ' ' -f1)"
            echo "native_log_sha256=$(sha256sum "$RUNNER_TEMP/atto-actor-native.log" | cut -d ' ' -f1)"
            echo "sanitized_log_sha256=$(sha256sum "$RUNNER_TEMP/atto-actor-sanitized.log" | cut -d ' ' -f1)"
          } > "$RUNNER_TEMP/atto-actor-evidence.txt"
      - name: Upload actual native guest and diagnostics evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attolang-native-actor-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/atto-actor-evidence.txt
            ${{ runner.temp }}/atto-actor-native.log
            ${{ runner.temp }}/atto-actor-sanitized.log
          if-no-files-found: warn
          retention-days: 7
