name: Native state-region actor lifetime exact-head

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'tests/state_region_actor_lifetime_pin_test.cpp'
      - 'tests/native_two_actor_arena_lifetime_test.cpp'
      - 'tests/native_actor_arena_denial_test.cpp'
      - 'tests/native_actor_stop_race_test.cpp'
      - 'tests/native_aot_two_actor_owned_counter_harness.c'
      - 'tests/fixtures/native-aot-two-actor-owned-counter.atto'
      - 'tests/fixtures/native-aot-unlowered-sealed-actor-state-reject.atto'
      - 'tests/fixtures/native-aot-sealed-two-actor-owned-counter.atto'
      - 'tests/fixtures/native-aot-sealed-state-wasm-reject.atto'
      - 'tests/fixtures/native-aot-sealed-state-missing-critical-reject.atto'
      - 'tests/fixtures/native-aot-legacy-critical-reject.atto'
      - 'tests/fixtures/native-aot-sealed-state-effectful-write-reject.atto'
      - 'tests/fixtures/native-aot-sealed-state-effectful-return-reject.atto'
      - 'tests/fixtures/native-aot-sealed-state-symbol-collision-reject.atto'
      - 'tests/fixtures/native-aot-sealed-state-immutable-field-reject.atto'
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c'
      - 'src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.h'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/frontend/ModuleLoader.cpp'
      - 'src/main/cpp/oreslang/frontend/ProjectRootImport.hpp'
      - 'tests/project_root_import_test.cpp'
      - 'tests/native_module_imports.py'
      - 'src/main/cpp/oreslang/runtime/StateRegionActorLifetimePin.hpp'
      - 'src/main/cpp/oreslang/runtime/OresTaskBoundStateRegion.h'
      - 'src/main/cpp/oreslang/runtime/NativeActorRetirementBarrier.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorGroupLifecycle.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorResourceRegistry.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorArena.c'
      - 'src/main/cpp/oreslang/runtime/ActorArena.h'
      - '.github/workflows/state-region-actor-lifetime-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-actor-region-lifetime:
    # Do not accept private code via an unapproved fork or carrier repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [optimized, asan-ubsan]
        include:
          - compiler: gcc
            mode: tsan
    steps:
      - name: Checkout exact source-repository head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and execute real actor arena reclamation test
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPILER: ${{ matrix.compiler }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/actor-state-region"
          if [[ "$COMPILER" == gcc ]]; then
            CC=gcc
            CXX=g++
          else
            CC=clang
            CXX=clang++
          fi
          if [[ "$MODE" == optimized ]]; then
            FLAGS=(-O2 -DNDEBUG)
            LINK_FLAGS=()
          elif [[ "$MODE" == asan-ubsan ]]; then
            FLAGS=(-O1 -g -DNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer)
            LINK_FLAGS=(-fsanitize=address,undefined)
          elif [[ "$MODE" == tsan ]]; then
            # Separately instrument the competing native completion observers;
            # ThreadSanitizer cannot be combined with AddressSanitizer.
            FLAGS=(-O1 -g -DNDEBUG -fsanitize=thread -fno-omit-frame-pointer)
            LINK_FLAGS=(-fsanitize=thread)
          else
            echo "unsupported sanitizer mode: $MODE" >&2
            exit 2
          fi
          "$CC" --version | head -n 1
          "$CXX" --version | head -n 1
          "$CC" -std=c11 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -pthread \
            -c src/main/cpp/oreslang/runtime/ActorArena.c \
            -o "$RUNNER_TEMP/actor-state-region/arena.o"
          "$CXX" -std=c++20 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -pthread \
            -c tests/state_region_actor_lifetime_pin_test.cpp \
            -o "$RUNNER_TEMP/actor-state-region/lifetime.o"
          "$CXX" "${LINK_FLAGS[@]}" -pthread \
            "$RUNNER_TEMP/actor-state-region/arena.o" \
            "$RUNNER_TEMP/actor-state-region/lifetime.o" \
            -o "$RUNNER_TEMP/actor-state-region/lifetime-test"
          "$RUNNER_TEMP/actor-state-region/lifetime-test"
          # Run separately owned two-actor arenas with the same flags as the pin test.
          "$CXX" -std=c++20 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -pthread \
            -c tests/native_two_actor_arena_lifetime_test.cpp \
            -o "$RUNNER_TEMP/actor-state-region/two-actor.o"
          "$CXX" "${LINK_FLAGS[@]}" -pthread \
            "$RUNNER_TEMP/actor-state-region/arena.o" \
            "$RUNNER_TEMP/actor-state-region/two-actor.o" \
            -o "$RUNNER_TEMP/actor-state-region/two-actor-test"
          "$RUNNER_TEMP/actor-state-region/two-actor-test"
          # Concurrent STOP and outstanding resource loans, including the TSAN matrix.
          "$CXX" -std=c++20 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -pthread \
            -c tests/native_actor_stop_race_test.cpp \
            -o "$RUNNER_TEMP/actor-state-region/stop-race.o"
          "$CXX" "${LINK_FLAGS[@]}" -pthread \
            "$RUNNER_TEMP/actor-state-region/arena.o" \
            "$RUNNER_TEMP/actor-state-region/stop-race.o" \
            -o "$RUNNER_TEMP/actor-state-region/stop-race-test"
          "$RUNNER_TEMP/actor-state-region/stop-race-test"
          # Fork/abort denial checks run only under optimized and ASan/UBSan.
          # TSAN continues to exercise the concurrent lifetime test above.
          if [[ "$MODE" != tsan ]]; then
            "$CXX" -std=c++20 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
              -Isrc/main/cpp -pthread \
              -c tests/native_actor_arena_denial_test.cpp \
              -o "$RUNNER_TEMP/actor-state-region/denials.o"
            "$CXX" "${LINK_FLAGS[@]}" -pthread \
              "$RUNNER_TEMP/actor-state-region/arena.o" \
              "$RUNNER_TEMP/actor-state-region/denials.o" \
              -o "$RUNNER_TEMP/actor-state-region/denials-test"
            "$RUNNER_TEMP/actor-state-region/denials-test"
          fi
          echo "EXACT_HEAD_NATIVE_ACTOR_LIFETIME=$EXPECTED_HEAD"
          echo "COMPILER_GUEST_EXECUTED=false"
          echo "COMPILER_GUEST_PARITY=NOT_VERIFIED"

  native-cmake-ctest:
    # Verify the registered production CMake target/CTest path independently
    # of the direct compiler matrix. This does not run guest .ores code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exactly the source-repository PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build production CMake actor lifetime target and execute registered CTest
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if command -v llvm-config >/dev/null 2>&1; then
            LLVM_CONFIG=llvm-config
          elif command -v llvm-config-18 >/dev/null 2>&1; then
            LLVM_CONFIG=llvm-config-18
          else
            echo "LLVM CMake prerequisites unavailable (runner/setup failure, not a test verdict)" >&2
            exit 2
          fi
          LLVM_DIR="$("$LLVM_CONFIG" --cmakedir)"
          test -f "$LLVM_DIR/LLVMConfig.cmake"
          BUILD="$RUNNER_TEMP/ores-actor-lifetime-cmake"
          cmake -S . -B "$BUILD" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            "-DLLVM_DIR=$LLVM_DIR" -DBUILD_TESTING=ON
          cmake --build "$BUILD" --target \
            oreslang-state-region-actor-lifetime-pin-test \
            oreslang-native-two-actor-arena-lifetime-test \
            oreslang-native-actor-arena-denial-test \
            oreslang-native-actor-stop-race-test -j2
          ctest --test-dir "$BUILD" --output-on-failure \
            -R '^(native_state_region_blocks_actor_arena_reclamation|native_two_actor_arena_isolation_and_quiescent_reclamation|native_actor_arena_denial_abort_contract|native_actor_stop_carrier_ffi_loan_quiescence)$'
          echo "PRODUCTION_NATIVE_CTEST_HEAD=$EXPECTED_HEAD"
          echo "COMPILED_ORES_GUEST_VERIFIED=false"

  compiled-native-actor-owned-heaps:
    # Only local-repository PRs: never run private-source instructions from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [optimized, asan-ubsan]
    steps:
      - name: Checkout immutable PR source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build LLVM compiler and run compiled-source two-actor AOT program
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if command -v llvm-config >/dev/null 2>&1; then
            LLVM_CONFIG=llvm-config
          elif command -v llvm-config-18 >/dev/null 2>&1; then
            LLVM_CONFIG=llvm-config-18
          else
            echo "LLVM CMake prerequisites missing (not a compiler verdict)" >&2
            exit 2
          fi
          LLVM_DIR="$("$LLVM_CONFIG" --cmakedir)"
          test -f "$LLVM_DIR/LLVMConfig.cmake"
          BUILD="$RUNNER_TEMP/ores-aot-actor-build"
          cmake -S . -B "$BUILD" -DCMAKE_BUILD_TYPE=Release \
            "-DLLVM_DIR=$LLVM_DIR" -DBUILD_TESTING=OFF
          cmake --build "$BUILD" --target oreslang-llvmc -j2
          COMPILER="$BUILD/oreslang-llvmc"
          test -x "$COMPILER"
          if command -v clang-18 >/dev/null 2>&1; then
            CLANG=clang-18
          elif command -v clang >/dev/null 2>&1; then
            CLANG=clang
          else
            echo "clang missing (runner/toolchain failure)" >&2
            exit 2
          fi
          SRC=tests/fixtures/native-aot-two-actor-owned-counter.atto
          IR="$RUNNER_TEMP/compiled-two-actor-owned-counter.ll"
          # Sealed scalar state is supported only with synchronous critical
          # turns. Suspension must fail before ANY IR, not silently fall back
          # to a legacy scalar actor ABI.
          DENIED="$RUNNER_TEMP/unlowered-sealed-actor-state.ll"
          if "$COMPILER" --experimental-owned-int \
              tests/fixtures/native-aot-unlowered-sealed-actor-state-reject.atto \
              > "$DENIED" 2> "$RUNNER_TEMP/sealed-actor-diagnostic"; then
            echo "unimplemented sealed state unexpectedly compiled" >&2
            exit 1
          fi
          test ! -s "$DENIED"
          grep -Fq 'native critical actor state handler cannot suspend' \
            "$RUNNER_TEMP/sealed-actor-diagnostic"
          "$COMPILER" --experimental-owned-int "$SRC" > "$IR"
          test -s "$IR"
          # A declaration alone cannot satisfy a compiler-backed guest gate.
          # Demand generated actor definitions and real scoped owner calls.
          grep -Eq '^[[:space:]]*define .*@oreslang_actor_Worker_init\(' "$IR"
          grep -Eq '^[[:space:]]*define .*@oreslang_actor_Worker_on_message\(' "$IR"
          grep -Eq '[[:space:]]call .*@ores_actor_i64_heap_scoped_new\(' "$IR"
          grep -Eq '[[:space:]]call .*@ores_actor_i64_heap_scoped_drop\(' "$IR"
          grep -Eq '[[:space:]]call .*@ores_actor_i64_heap_field_read\(' "$IR"
          grep -Eq '[[:space:]]call .*@ores_actor_i64_heap_field_write\(' "$IR"
          if [[ "$MODE" == optimized ]]; then
            FLAGS=(-O2 -DNDEBUG)
          elif [[ "$MODE" == asan-ubsan ]]; then
            FLAGS=(-O1 -g -DNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer)
          else
            echo "unrecognized AOT test mode" >&2
            exit 2
          fi
          "$CLANG" -x ir "${FLAGS[@]}" -c "$IR" -o "$RUNNER_TEMP/guest.o"
          "$CLANG" -x c -std=c11 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/ActorOwnedI64Heap.c \
            -o "$RUNNER_TEMP/native-actor-heap.o"
          "$CLANG" -x c -std=c11 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -c tests/native_aot_two_actor_owned_counter_harness.c \
            -o "$RUNNER_TEMP/actor-harness.o"
          "$CLANG" "${FLAGS[@]}" "$RUNNER_TEMP/guest.o" \
            "$RUNNER_TEMP/native-actor-heap.o" "$RUNNER_TEMP/actor-harness.o" \
            -o "$RUNNER_TEMP/aot-two-actor-test"
          "$RUNNER_TEMP/aot-two-actor-test" | tee "$RUNNER_TEMP/aot-two-actor-receipt"
          grep -Fxq 'AOT_COMPILED_TWO_ACTOR_OWNED_HEAPS_2009_TURNS_PASS' \
            "$RUNNER_TEMP/aot-two-actor-receipt"
          # A separate sealed critical ABI must really be emitted, linked and
          # executed. The legacy handler cannot impersonate handle_state.
          SEALED=tests/fixtures/native-aot-sealed-two-actor-owned-counter.atto
          SEALED_IR="$RUNNER_TEMP/compiled-sealed-actor-counter.ll"
          "$COMPILER" --experimental-owned-int "$SEALED" > "$SEALED_IR"
          test -s "$SEALED_IR"
          grep -Eq '^[[:space:]]*define .*@oreslang_actor_Worker_init\(' "$SEALED_IR"
          grep -Eq '^[[:space:]]*define .*@oreslang_actor_Worker_handle_state\(' "$SEALED_IR"
          if grep -Eq '^[[:space:]]*define .*@oreslang_actor_Worker_on_message\(' "$SEALED_IR"; then
            echo "sealed state fell back to legacy actor method ABI" >&2
            exit 1
          fi
          for fn in scoped_new scoped_drop field_read field_write; do
            grep -Eq "[[:space:]]call .*@ores_actor_i64_heap_${fn}\\(" "$SEALED_IR"
          done
          for entry in \
            "native-aot-sealed-state-missing-critical-reject.atto|native sealed actor state requires pub critical handle_state" \
            "native-aot-legacy-critical-reject.atto|legacy native actor on_message cannot claim critical state ABI" \
            "native-aot-sealed-state-effectful-write-reject.atto|native sealed critical handler requires pure scalar state write" \
            "native-aot-sealed-state-effectful-return-reject.atto|native sealed critical handler requires pure scalar return" \
            "native-aot-sealed-state-symbol-collision-reject.atto|reserved native runtime ABI symbol" \
            "native-aot-sealed-state-immutable-field-reject.atto|cannot assign immutable or unknown actor field"; do
            SRC_PATH="${entry%%|*}"
            DIAGNOSTIC="${entry#*|}"
            REJECTED="$RUNNER_TEMP/${SRC_PATH}.ll"
            if "$COMPILER" --experimental-owned-int "tests/fixtures/$SRC_PATH" \
              > "$REJECTED" 2> "$RUNNER_TEMP/${SRC_PATH}.err"; then
              echo "unsupported actor contract was accepted: $SRC_PATH" >&2
              exit 1
            fi
            test ! -s "$REJECTED"
            grep -Fq "$DIAGNOSTIC" "$RUNNER_TEMP/${SRC_PATH}.err"
          done
          WASM_DENIED="$RUNNER_TEMP/sealed-wasm-denied.ll"
          if "$COMPILER" --target=wasm32 \
              tests/fixtures/native-aot-sealed-state-wasm-reject.atto \
              > "$WASM_DENIED" 2> "$RUNNER_TEMP/sealed-wasm.err"; then
            echo "unlowered sealed state unexpectedly admitted on wasm32" >&2
            exit 1
          fi
          test ! -s "$WASM_DENIED"
          grep -Fq 'wasm32 sealed critical actor state requires separate turn/heap lowering' \
            "$RUNNER_TEMP/sealed-wasm.err"
          "$CLANG" -x ir "${FLAGS[@]}" -c "$SEALED_IR" \
            -o "$RUNNER_TEMP/guest-sealed.o"
          "$CLANG" -x c -std=c11 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -DATTO_SEALED_STATE_GUEST -Isrc/main/cpp \
            -c tests/native_aot_two_actor_owned_counter_harness.c \
            -o "$RUNNER_TEMP/sealed-actor-harness.o"
          "$CLANG" "${FLAGS[@]}" "$RUNNER_TEMP/guest-sealed.o" \
            "$RUNNER_TEMP/native-actor-heap.o" "$RUNNER_TEMP/sealed-actor-harness.o" \
            -o "$RUNNER_TEMP/aot-sealed-two-actor-test"
          "$RUNNER_TEMP/aot-sealed-two-actor-test" | \
            tee "$RUNNER_TEMP/aot-sealed-two-actor-receipt"
          grep -Fxq 'AOT_COMPILED_SEALED_TWO_ACTOR_OWNED_HEAPS_2009_TURNS_PASS' \
            "$RUNNER_TEMP/aot-sealed-two-actor-receipt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "SOURCE_HEAD=$EXPECTED_HEAD"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "COMPILER_GUEST_EXECUTED=true"
          echo "COMPILER_GUEST_SCOPE=legacy-scalar-and-sealed-synchronous-i64-actors"
          echo "SOURCE_SEALED_SCALAR_STATE_VALIDATED=true"
          echo "FULL_STATE_HANDLE_STATE_CERTIFIED=false"
          sha256sum "$RUNNER_TEMP/guest.o" "$RUNNER_TEMP/aot-two-actor-test" \
            "$RUNNER_TEMP/guest-sealed.o" "$RUNNER_TEMP/aot-sealed-two-actor-test"

  attolang-native-module-imports:
    # Compiler-backed .atto import graph and native resolver boundary checks.
    # Never run a private-source mirror from unapproved forks/carrier repos.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source-repository head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile resolver and AttoLang source/module graph; execute cases
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          SRC_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -n "$SRC_TREE"
          if command -v llvm-config >/dev/null 2>&1; then
            LLVM_CONFIG=llvm-config
          elif command -v llvm-config-18 >/dev/null 2>&1; then
            LLVM_CONFIG=llvm-config-18
          else
            echo "Missing llvm-config; runner prerequisite, not compiler verdict" >&2
            exit 2
          fi
          LLVM_DIR="$("$LLVM_CONFIG" --cmakedir)"
          test -f "$LLVM_DIR/LLVMConfig.cmake"
          if command -v clang-18 >/dev/null 2>&1; then
            CLANG=clang-18
          elif command -v clang >/dev/null 2>&1; then
            CLANG=clang
          else
            echo "Missing Clang; runner prerequisite" >&2
            exit 2
          fi
          BUILD="$RUNNER_TEMP/atto-native-import-build"
          cmake -S . -B "$BUILD" -DCMAKE_BUILD_TYPE=Release \
            "-DLLVM_DIR=$LLVM_DIR" -DBUILD_TESTING=ON
          cmake --build "$BUILD" --target oreslang-llvmc \
            oreslang-native-project-root-import-test -j2
          test -x "$BUILD/oreslang-llvmc"
          test -x "$BUILD/oreslang-native-project-root-import-test"
          ctest --test-dir "$BUILD" --output-on-failure \
            -R '^native_project_root_import_security$'
          python3 tests/native_module_imports.py \
            --compiler "$BUILD/oreslang-llvmc" --clang "$CLANG"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_NATIVE_IMPORT_GRAPH_GUEST_EXECUTED=true"
          echo "ATTO_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_SOURCE_TREE=$SRC_TREE"
          sha256sum "$BUILD/oreslang-llvmc" \
            "$BUILD/oreslang-native-project-root-import-test"

  native-atto-import-resolver-no-llvm:
    # Keep native resolver evidence available without llvm-config, but do not
    # label a header-only result as compiled AttoLang guest execution.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [optimized, asan-ubsan]
    steps:
      - name: Checkout exact source-repository head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and execute real project-root resolver security suite
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPILER: ${{ matrix.compiler }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          SRC_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -n "$SRC_TREE"
          case "$COMPILER" in
            gcc)
              CXX=g++
              WARN=(-Wno-error=maybe-uninitialized)
              ;;
            clang)
              CXX=clang++
              WARN=()
              ;;
            *) exit 2 ;;
          esac
          case "$MODE" in
            optimized) FLAGS=(-O2 -DNDEBUG) ;;
            asan-ubsan)
              # Clang's libstdc++ regex sanitizer instantiation is very slow
              # with optimization on smaller runners. -O0 still executes
              # both sanitizers against the checked-in production test.
              if [[ "$COMPILER" == clang ]]; then
                FLAGS=(-O0 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
              else
                FLAGS=(-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer)
              fi
              ;;
            *) exit 2 ;;
          esac
          BIN="$RUNNER_TEMP/atto-project-root-security"
          "$CXX" -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            "${WARN[@]}" "${FLAGS[@]}" \
            -Isrc/main/cpp tests/project_root_import_test.cpp -o "$BIN"
          "$BIN" | tee "$RUNNER_TEMP/atto-resolver-receipt"
          grep -Fxq 'PASS project-root import resolver security cases' \
            "$RUNNER_TEMP/atto-resolver-receipt"
