name: Native state-region actor lifetime exact-head

on:
  pull_request:
    paths:
      - 'tests/state_region_actor_lifetime_pin_test.cpp'
      - 'src/main/cpp/oreslang/runtime/StateRegionActorLifetimePin.hpp'
      - 'src/main/cpp/oreslang/runtime/OresTaskBoundStateRegion.h'
      - 'src/main/cpp/oreslang/runtime/NativeActorRetirementBarrier.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorGroupLifecycle.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorResourceRegistry.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorArena.c'
      - 'src/main/cpp/oreslang/runtime/ActorArena.h'
      - '.github/workflows/state-region-actor-lifetime-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-actor-region-lifetime:
    # Do not accept private code via an unapproved fork or carrier repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [optimized, asan-ubsan]
    steps:
      - name: Checkout exact source-repository head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and execute real actor arena reclamation test
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          COMPILER: ${{ matrix.compiler }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/actor-state-region"
          if [[ "$COMPILER" == gcc ]]; then
            CC=gcc
            CXX=g++
          else
            CC=clang
            CXX=clang++
          fi
          if [[ "$MODE" == optimized ]]; then
            FLAGS=(-O2 -DNDEBUG)
            LINK_FLAGS=()
          else
            FLAGS=(-O1 -g -DNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer)
            LINK_FLAGS=(-fsanitize=address,undefined)
          fi
          "$CC" --version | head -n 1
          "$CXX" --version | head -n 1
          "$CC" -std=c11 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -pthread \
            -c src/main/cpp/oreslang/runtime/ActorArena.c \
            -o "$RUNNER_TEMP/actor-state-region/arena.o"
          "$CXX" -std=c++20 "${FLAGS[@]}" -Wall -Wextra -Wpedantic -Werror \
            -Isrc/main/cpp -pthread \
            -c tests/state_region_actor_lifetime_pin_test.cpp \
            -o "$RUNNER_TEMP/actor-state-region/lifetime.o"
          "$CXX" "${LINK_FLAGS[@]}" -pthread \
            "$RUNNER_TEMP/actor-state-region/arena.o" \
            "$RUNNER_TEMP/actor-state-region/lifetime.o" \
            -o "$RUNNER_TEMP/actor-state-region/lifetime-test"
          "$RUNNER_TEMP/actor-state-region/lifetime-test"
          echo "EXACT_HEAD_NATIVE_ACTOR_LIFETIME=$EXPECTED_HEAD"
          echo "COMPILER_GUEST_EXECUTED=false"
          echo "COMPILER_GUEST_PARITY=NOT_VERIFIED"
