name: Persistent actor data v1 policy conformance
on:
  pull_request:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/main/cpp/oreslang/runtime/SharedDomainArena.hpp'
      - 'tests/native_shared_domain_arena_test.cpp'
      - 'tests/native_actor_arena_test.cpp'
      - 'CMakeLists.txt'
  push:
    paths:
      - 'contracts/v1/persistent_actor_data_v1.json'
      - 'scripts/verify_persistent_actor_data_contract.py'
      - 'scripts/test_persistent_actor_data_contract.py'
      - '.github/workflows/persistent-actor-data-contract.yml'
      - 'src/main/cpp/oreslang/runtime/SharedDomainArena.hpp'
      - 'tests/native_shared_domain_arena_test.cpp'
      - 'tests/native_actor_arena_test.cpp'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin identical five-backend contract source blobs
        shell: bash
        run: |
          test "$(git hash-object contracts/v1/persistent_actor_data_v1.json)" = "83a40f637ab77437108d02fedc8cde997f753928"
          test "$(git hash-object scripts/verify_persistent_actor_data_contract.py)" = "2377ed4152910d03ddd8289128ec725b16570e82"
          test "$(git hash-object scripts/test_persistent_actor_data_contract.py)" = "69f9ac5fe046dd1815507fc9585628b8b0f1e62a"
      - name: Reject capability and fixture drift
        run: python3 scripts/verify_persistent_actor_data_contract.py
      - name: Execute negative policy mutation suite
        run: python3 scripts/test_persistent_actor_data_contract.py -v

  host-arena:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and execute real LLVM host shared-domain leases
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -pthread -Isrc/main/cpp tests/native_shared_domain_arena_test.cpp -o /tmp/oreslang-shared-domain-arena
          /tmp/oreslang-shared-domain-arena
