name: LLVM Counter v2 identical-source admission (not executable parity)
on:
  push:
    paths:
      - 'contracts/actor-counter-identical-source-v1/**'
      - 'tools/counter-v2-source-manifest-pin/**'
      - 'src/main/cpp/oreslang/frontend/CounterV2Source.hpp'
      - 'src/main/cpp/oreslang/main.cpp'
      - 'tests/counter_v2_source_admission_test.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/llvm-counter-v2-source-admission.yml'
  pull_request:
    paths:
      - 'contracts/actor-counter-identical-source-v1/**'
      - 'tools/counter-v2-source-manifest-pin/**'
      - 'src/main/cpp/oreslang/frontend/CounterV2Source.hpp'
      - 'src/main/cpp/oreslang/main.cpp'
      - 'tests/counter_v2_source_admission_test.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/llvm-counter-v2-source-admission.yml'
permissions:
  contents: read
jobs:
  source-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned canonical source manifest and tamper rejection with Rust
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          cargo test --offline --manifest-path tools/counter-v2-source-manifest-pin/Cargo.toml
          cargo run --offline --manifest-path tools/counter-v2-source-manifest-pin/Cargo.toml
      - name: Compile real LLVM frontend Counter v2 source checker and mutate corpus
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic -Werror -UNDEBUG \
            -I src/main/cpp tests/counter_v2_source_admission_test.cpp \
            -o "${RUNNER_TEMP}/counter-v2-source-admission"
          "${RUNNER_TEMP}/counter-v2-source-admission" \
            contracts/actor-counter-identical-source-v1
          echo "LLVM_COUNTER_V2_EXECUTION_STATUS=NOT_EXECUTED"
