# Private source-owning repo only. steps=[] means runner admission, not compiler failure.
name: AttoLang LLVM canonical numeric native guest parity
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/CoreLibrarySources.hpp'
      - 'tests/core_library_sources_test.cpp'
      - 'stdlib/numeric.atto'
      - 'tests/atto_core_numeric_parity.sh'
      - 'tests/atto-core-numeric-v1/**'
      - '.github/workflows/atto-numeric-core-llvm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-numeric:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR commit with no persistent credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pin checked-out commit and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          echo "ATTO_LLVM_NUMERIC_HEAD=$EXPECTED_HEAD"
          echo "ATTO_LLVM_NUMERIC_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Check byte-identical portable .atto without claiming native execution
        shell: bash
        run: bash tests/atto_core_numeric_parity.sh --source-only
      - name: Install compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev
      - name: Build real compiler, C++ registry test, and IR auditor
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2 --target oreslang-llvmc oreslang-core-library-sources-test oreslang-no-gc-ir-audit-build
          ctest --test-dir build --output-on-failure --no-tests=error -R '^native_core_library_registry_provider_policy$'
          test -x build/oreslang-llvmc
          test -x build/oreslang-no-gc-ir-audit
      - name: Execute six compiler-backed LLVM natives and two negatives
        shell: bash
        run: |
          set -euo pipefail
          bash tests/atto_core_numeric_parity.sh --run | tee "$RUNNER_TEMP/numeric-receipts.txt"
          test "$(grep -c '^ATTO_LLVM_NUMERIC_NATIVE_HOST_OBSERVED|' "$RUNNER_TEMP/numeric-receipts.txt")" -eq 6
          test "$(grep -c '^ATTO_LLVM_NUMERIC_NEGATIVE_HOST_OBSERVED|' "$RUNNER_TEMP/numeric-receipts.txt")" -eq 2
          grep -Fq 'ATTO_LLVM_NUMERIC_GUEST_PARITY_EXECUTED|positive=3|optimizations=2|native=6|negative=2|' "$RUNNER_TEMP/numeric-receipts.txt"
      - name: Confirm exact head and clean tree after native guest execution
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "ATTO_LLVM_NUMERIC_VERIFIED_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Store host-observed receipts without treating them as guest TestKit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atto-numeric-llvm-o0-o2
          path: ${{ runner.temp }}/numeric-receipts.txt
          if-no-files-found: warn
