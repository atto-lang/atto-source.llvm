name: TenantVM source .atto AOT admission (real compiler)

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/main.cpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/runtime/OresIsolateAbi.h'
      - 'src/main/cpp/oreslang/runtime/OresIsolateVM.hpp'
      - 'src/main/cpp/oreslang/runtime/OresVM.hpp'
      - 'tests/fixtures/tenantvm-trusted-scalar.atto'
      - 'tests/native_tenantvm_atto_guest_test.cpp'
      - 'tests/native_tenantvm_actor_turn_object_test.cpp'
      - 'tests/native_tenantvm_integrated_actor_source_test.cpp'
      - 'tests/tenantvm_actor_turn_exact_checkout.sh'
      - 'tests/tenantvm_atto_source_aot_gate.sh'
      - '.github/workflows/tenantvm-atto-source-aot-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenantvm-real-atto-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head source tree admission
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Install compiler toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang cmake ninja-build
      - name: Build production LLVM source compiler
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/tenantvm-compiler" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/tenantvm-compiler" \
            --target oreslang-llvmc --parallel 2
      - name: Compile real .atto source and run native O0/O2 guest plus fail-closed negatives
        shell: bash
        run: |
          set -euo pipefail
          bash tests/tenantvm_atto_source_aot_gate.sh \
            "$RUNNER_TEMP/tenantvm-compiler/oreslang-llvmc" \
            clang clang++ "$PWD"
          echo "REAL_SOURCE_GUEST_EXECUTED: sha=$GITHUB_SHA"
