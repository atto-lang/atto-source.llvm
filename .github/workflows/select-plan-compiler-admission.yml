name: SelectPlan compiler admission
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y cmake clang llvm-dev python3
      - run: cmake -S . -B build && cmake --build build --target oreslang-llvmc --parallel 2
      - run: python3 tests/native_select_plan_contract.py --compiler ./build/oreslang-llvmc --fixtures tests/fixtures
      - run: python3 tests/counted_select_admission.py --compiler ./build/oreslang-llvmc
