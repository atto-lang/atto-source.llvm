name: Borrow conformance L1 (OwnershipCfg vs canonical corpora)
on:
  pull_request:
    paths:
      - "src/main/cpp/oreslang/types/OwnershipCfg.hpp"
      - "tests/borrow_conformance_l1_adapter.cpp"
      - "tests/borrow_conformance_l1.sh"
      - "contracts/borrow-conformance/**"
      - ".github/workflows/borrow-conformance-l1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Host-only L1 (GCC and Clang, sanitized)
        shell: bash
        run: |
          set -euo pipefail
          CXX=g++ SANITIZE=1 tests/borrow_conformance_l1.sh
          CXX=clang++ SANITIZE=1 tests/borrow_conformance_l1.sh
          echo "HOST_ONLY: native engine on abstract graphs, not compiled .atto guests"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: borrow-conformance-l1-HOST-ONLY-${{ github.run_id }}
          path: build/borrow-conformance-l1/*.jsonl
          if-no-files-found: warn
          retention-days: 7
