name: AttoLang LLVM LRU AoS native guest admission
on:
  pull_request:
    paths:
      - 'contracts/atto-lru-llvm-v1/**'
      - 'tests/atto_lru_llvm_source.py'
      - 'CMakeLists.txt'
      - '.github/workflows/atto-lru-native-layout.yml'
      - 'src/main/cpp/oreslang/runtime/NativeIntArrayRegion.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-layout-microtraces:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head without token persistence
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source provenance and clean tree
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code --quiet
          git diff --cached --exit-code --quiet
          test -z "$(git ls-files --others --exclude-standard)"
          echo "EXACT_HEAD=$EXPECTED_SHA"
          echo "EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Verify all eight pinned LLVM LRU guest fixtures (source only)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/atto_lru_llvm_source.py
      - name: Install native LLVM / Clang and CMake
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev python3
          clang++ --version
          cmake --version
      - name: Build actual oreslang-llvmc compiler
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target oreslang-llvmc
      - name: Require exact native CTest inventory before execution
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N > /tmp/atto-lru-inventory.txt
          for name in \
            atto_lru_hash_quotient \
            atto_lru_probe_wrap \
            atto_lru_slot_recycle \
            atto_lru_recency_touch \
            atto_lru_aos_triple_reuse \
            atto_lru_aos_pair_occupancy \
            atto_lru_aos_padded_zero \
            atto_lru_aosoa_tail_reset \
            atto_lru_micro_source_inventory
          do
            grep -Eq "Test +#[0-9]+: ${name}$" /tmp/atto-lru-inventory.txt
          done
      - name: Compile LLVM IR link and execute all eight genuine .atto guests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -R '^atto_lru_(hash_quotient|probe_wrap|slot_recycle|recency_touch|aos_triple_reuse|aos_pair_occupancy|aos_padded_zero|aosoa_tail_reset|micro_source_inventory)$' \
            --output-on-failure --timeout 180
      - name: Reverify source Git identity after native execution
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code --quiet
          git diff --cached --exit-code --quiet
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
