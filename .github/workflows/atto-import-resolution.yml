name: Canonical AttoLang import and native guest parity
on:
  push:
    branches:
      - feat/attolang-canonical-root-and-imports-20261103
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/main.cpp'
      - 'src/main/cpp/oreslang/frontend/SourceInput.hpp'
      - 'src/main/cpp/oreslang/frontend/PinnedAttoSourceOpen.hpp'
      - 'src/main/cpp/oreslang/frontend/ProjectRootImport.hpp'
      - 'src/main/cpp/oreslang/frontend/ModuleLoader.cpp'
      - 'src/main/cpp/oreslang/frontend/HostLogicalUnitIds.hpp'
      - 'tests/native_host_logical_unit_ids_test.cpp'
      - 'tests/native_atto_logical_identity_guest.py'
      - 'docs/ATTO_LOGICAL_SOURCE_UNIT_IDENTITY.md'
      - 'tests/project_root_import_test.cpp'
      - 'tests/native_pinned_atto_source_open_test.cpp'
      - 'tests/native_module_imports.py'
      - 'tests/fixtures/atto-native-parity/**'
      - 'CMakeLists.txt'
      - '.github/workflows/atto-import-resolution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-import-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact head without retained GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head before compiling
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          echo "ATTO_LLVM_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_LLVM_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: GCC and Clang root import security unit (host-only)
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            # GCC 14 -O1 raises a spurious -Wmaybe-uninitialized in its own
            # std::regex implementation with -Werror. Keep *all* warnings
            # fatal and compile this host-only unit at -O0 for GCC; retain
            # -O1 for Clang and the independent compiler-backed native gate.
            optimize=-O1
            if [[ "$compiler" == g++ ]]; then optimize=-O0; fi
            "${compiler}" -std=c++20 "$optimize" -Wall -Wextra -Wpedantic -Werror \
              -UNDEBUG -Isrc/main/cpp tests/project_root_import_test.cpp \
              -o "$RUNNER_TEMP/atto-root-import-${compiler}"
            "$RUNNER_TEMP/atto-root-import-${compiler}"
          done
          echo 'ATTO_LLVM_HOST_IMPORT_SECURITY=PASS; GUEST=NOT_EXECUTED'
      - name: GCC and Clang canonical logical unit identity (host-only)
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            "${compiler}" -std=c++20 -O1 -Wall -Wextra -Wpedantic -Werror \
              -UNDEBUG -Isrc/main/cpp \
              tests/native_host_logical_unit_ids_test.cpp \
              -o "$RUNNER_TEMP/atto-logical-unit-${compiler}"
            "$RUNNER_TEMP/atto-logical-unit-${compiler}"
          done
          clang++ -std=c++20 -O0 -g0 -Wall -Wextra -Wpedantic -Werror \
            -UNDEBUG -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Isrc/main/cpp tests/native_host_logical_unit_ids_test.cpp \
            -o "$RUNNER_TEMP/atto-logical-unit-sanitizers"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            "$RUNNER_TEMP/atto-logical-unit-sanitizers"
          echo 'ATTO_LLVM_LOGICAL_UNIT_HOST_ONLY_PASS=1; GUEST=NOT_EXECUTED'
      - name: GCC and Clang pinned canonical input ASan and UBSan regression
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            "${compiler}" -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -Isrc/main/cpp/oreslang/frontend \
              tests/native_pinned_atto_source_open_test.cpp \
              -o "$RUNNER_TEMP/atto-pinned-input-${compiler}"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
              "$RUNNER_TEMP/atto-pinned-input-${compiler}"
          done
          echo 'ATTO_LLVM_PINNED_INPUT_HOST_SANITIZERS=PASS; GUEST=NOT_EXECUTED'
  compiler-backed-atto-native-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head without retained GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          echo "ATTO_LLVM_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "ATTO_LLVM_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          python3 -m py_compile tests/native_module_imports.py tests/native_atto_logical_identity_guest.py
          # Identical Git blobs are required on the Java and LLVM source
          # branches; do not silently test unrelated programs called "42".
          test "$(git hash-object --no-filters tests/fixtures/atto-native-parity/main.atto)" =             '5ffe955025a664d5f069e441a9cbcaa9227d06a8'
          test "$(git hash-object --no-filters tests/fixtures/atto-native-parity/lib.atto)" =             '62ddcdb8c1cfe60da8aca47734c46bca7bc9ae56'
          test "$(git hash-object --no-filters tests/fixtures/atto-native-parity/.atto.pkg.toml)" =             '66aa65f18ffcdbb743f9793249b146da083542ce'
          echo 'ATTO_LLVM_SHARED_JAVA_FIXTURE_BLOBS=3/3 PASS'
      - name: Provision native LLVM 19 CMake and Clang compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev clang-19 ninja-build
          llvm-config-19 --version
          clang-19 --version
      - name: Build actual AttoLang LLVM compiler and native root-import unit
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/atto-native-parity-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR="$(llvm-config-19 --cmakedir)" \
            -DORE_RT_AOT_CLANG="$(command -v clang-19)" \
            -DORE_RT_AOT_CXX="$(command -v clang++-19)"
          cmake --build "$RUNNER_TEMP/atto-native-parity-build" \
            --target oreslang-llvmc oreslang-native-project-root-import-test oreslang-native-pinned-atto-source-open-test oreslang-native-host-logical-unit-ids-test --parallel 2
          test -x "$RUNNER_TEMP/atto-native-parity-build/oreslang-llvmc"
          echo 'ATTO_LLVM_REAL_COMPILER_BUILD=PASS'
      - name: Execute linked native .atto program and malicious-source rejections
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/atto-native-parity-build" \
            --output-on-failure --timeout 180 \
            -R '^(native_project_root_import_security|native_source_module_graph_execution|native_pinned_atto_source_path_admission|native_atto_host_logical_unit_identity|native_atto_logical_unit_linked_guest_gate)          echo 'ATTO_LLVM_COMPILER_LINKED_GUEST=PASS'
      - name: Recheck exact source head and tracked changes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          git diff --exit-code --
          git diff --cached --exit-code --
          echo 'ATTO_LLVM_SOURCE_IDENTITY_AFTER=PASS'
