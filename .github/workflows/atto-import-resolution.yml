name: Canonical AttoLang import admission (native unit)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/ProjectRootImport.hpp'
      - 'src/main/cpp/oreslang/frontend/ModuleLoader.cpp'
      - 'tests/project_root_import_test.cpp'
      - '.github/workflows/atto-import-resolution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-import-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and execute project-root import security unit with GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          for compiler in g++ clang++; do
            "${compiler}" -std=c++20 -O1 -Wall -Wextra -Werror \
              -Isrc/main/cpp tests/project_root_import_test.cpp \
              -o "/tmp/atto-root-import-${compiler}"
            "/tmp/atto-root-import-${compiler}"
          done
      - name: Clarify verification scope
        run: echo "HOST_UNIT_ONLY; no complete AttoLang guest compiler or broker was executed"
