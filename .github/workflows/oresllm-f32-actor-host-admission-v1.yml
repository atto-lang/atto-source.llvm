# Source-repository only. No cross-organization mirror or secrets.
# HOST PREFLIGHT ONLY — never count as compiler-executed GEMM or AOT proof.
name: OresLLM f32 actor host admission v1 (llvm)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeF32ActorHostAdmissionV1.h'
      - 'src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h'
      - 'src/main/cpp/oreslang/runtime/NativeExecutionContext.h'
      - 'tests/native_f32_actor_host_admission_v1_test.c'
      - 'scripts/test-native-f32-actor-host-admission-v1.sh'
      - '.github/workflows/oresllm-f32-actor-host-admission-v1.yml'
      - 'tests/native_f32_actor_turn_lease_v1_test.c'
      - 'src/main/cpp/oreslang/runtime/NativeF32ActorTurnLeaseV1.h'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-preflight-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR source head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and clean checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "ORESLLM_F32_SOURCE_PR_HEAD_VERIFIED|sha=$EXPECTED_HEAD|guest=NOT_EXECUTED"
      - name: Execute llvm actual host-side gate and adversarial tests
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/test-native-f32-actor-host-admission-v1.sh
          echo "ORESLLM_F32_HOST_PREFLIGHT_ONLY_PASS|backend=llvm|compiler_guest=NOT_EXECUTED|native_gemm=NOT_EXECUTED"
