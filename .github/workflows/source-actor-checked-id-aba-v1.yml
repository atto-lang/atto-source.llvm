name: LLVM checked SourceActor ID and allocator ABA native guest
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/SourceActorBootstrap.c'
      - 'src/main/cpp/oreslang/runtime/SourceActorBootstrap.h'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'tests/source_actor_checked_identity_aba_v1.c'
      - 'tests/fixtures/source-actor-checked-id-v1/**'
      - 'scripts/test-source-actor-checked-id-aba-v1.sh'
      - 'scripts/test-source-actor-checked-id-guest-v1.sh'
      - '.github/workflows/source-actor-checked-id-aba-v1.yml'
  push:
    paths:
      - 'src/main/cpp/oreslang/runtime/SourceActorBootstrap.c'
      - 'src/main/cpp/oreslang/runtime/SourceActorBootstrap.h'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'tests/source_actor_checked_identity_aba_v1.c'
      - 'tests/fixtures/source-actor-checked-id-v1/**'
      - 'scripts/test-source-actor-checked-id-aba-v1.sh'
      - 'scripts/test-source-actor-checked-id-guest-v1.sh'
      - '.github/workflows/source-actor-checked-id-aba-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-real-actor-allocator-aba-asan-ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Install Clang for O0/O2 runtime ASan and UBSan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19
      - name: Verify exact head and execute actual source actor 127-address reuse
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CLANG: /usr/bin/clang-19
        run: |
          set -euo pipefail
          bash -n scripts/test-source-actor-checked-id-aba-v1.sh
          bash scripts/test-source-actor-checked-id-aba-v1.sh |
            tee "$RUNNER_TEMP/source-actor-checked-id-aba.txt"
          grep -Fqx "SOURCE_ACTOR_CHECKED_ID_NATIVE_MATRIX_PASS|head=$EXPECTED_HEAD|levels=O0_O2|real_actors=256|forced_address_reuses=254|death_tests=6|checked_id=64_BIT_VALUE|legacy_pointer_ABA=OPEN|async_await=NOT_EXECUTED" \
            "$RUNNER_TEMP/source-actor-checked-id-aba.txt"
          test "$(grep -c '^SOURCE_ACTOR_CHECKED_ID_NATIVE_PASS|' "$RUNNER_TEMP/source-actor-checked-id-aba.txt")" = 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: source-actor-checked-id-aba-receipts
          path: ${{ runner.temp }}/source-actor-checked-id-aba.txt
          if-no-files-found: warn

  exact-head-compiler-generated-checked-id-atto-aot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Install independent Clang LLVM Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 llvm-19-dev cmake ninja-build binutils
      - name: Build exact-head LLVM native compiler and Rust IR GC auditor
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/checked-source-id-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DLLVM_DIR=/usr/lib/llvm-19/lib/cmake/llvm
          cmake --build "$RUNNER_TEMP/checked-source-id-build" --target oreslang-llvmc --parallel 2
          test -x "$RUNNER_TEMP/checked-source-id-build/oreslang-llvmc"
          rustc --edition=2021 -D warnings --test scripts/audit_no_gc_ir.rs \
            -o "$RUNNER_TEMP/checked-source-id-build/gc-ir-tests"
          "$RUNNER_TEMP/checked-source-id-build/gc-ir-tests" --test-threads=1
          rustc --edition=2021 -D warnings scripts/audit_no_gc_ir.rs \
            -o "$RUNNER_TEMP/checked-source-id-build/oreslang-no-gc-ir-audit"
      - name: Execute actual compiled Atto actor ID ABI native guests O0 O2
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ORESLANG_LLVMC: ${{ runner.temp }}/checked-source-id-build/oreslang-llvmc
          ORES_NO_GC_IR_AUDIT: ${{ runner.temp }}/checked-source-id-build/oreslang-no-gc-ir-audit
          CLANG: /usr/bin/clang-19
        run: |
          set -euo pipefail
          bash -n scripts/test-source-actor-checked-id-guest-v1.sh
          bash scripts/test-source-actor-checked-id-guest-v1.sh |
            tee "$RUNNER_TEMP/source-actor-checked-id-guest.txt"
          grep -Fqx "SOURCE_ACTOR_CHECKED_GUEST_MATRIX_EXECUTED|head=$EXPECTED_HEAD|O0_O2=1|native_runs=32|compiled_cases=8|negative_rejections=2|ready_done_id_callbacks=2_PER_OPT|legacy_pointer_calls=0|linked_zero_gc=NOT_CERTIFIED" \
            "$RUNNER_TEMP/source-actor-checked-id-guest.txt"
          test "$(grep -c '^SOURCE_ACTOR_CHECKED_GUEST_EXECUTED|' "$RUNNER_TEMP/source-actor-checked-id-guest.txt")" = 8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: source-actor-checked-id-guest-receipts
          path: ${{ runner.temp }}/source-actor-checked-id-guest.txt
          if-no-files-found: warn
