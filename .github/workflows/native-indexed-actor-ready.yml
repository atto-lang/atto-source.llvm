name: Indexed native actor scheduler (source)
on:
  push:
    branches:
      - feat/native-indexed-ready-20261019
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.c'
      - 'tests/native_actor_indexed_ready_test.c'
      - '.github/workflows/native-indexed-actor-ready.yml'
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.c'
      - 'tests/native_actor_indexed_ready_test.c'
      - '.github/workflows/native-indexed-actor-ready.yml'
permissions:
  contents: read
jobs:
  indexed-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and run indexed native actor regressions
        shell: bash
        env:
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          mkdir -p build/native-indexed-ready
          for t in native_actor_indexed_ready_test native_actor_carrier_locality_test native_actor_scheduler_test native_actor_exclusive_control_test native_actor_typed_control_exclusive_test native_actor_send_stop_race_test native_actor_carrier_create_failure_test; do
            flags=""
            if [[ "$t" == native_actor_carrier_create_failure_test ]]; then
              flags="-DORESLANG_NATIVE_TEST_PTHREAD_CREATE_FAILURE=1"
            fi
            "$CC" -std=c11 -O2 -UNDEBUG -Wall -Wextra -Wpedantic -Werror -pthread $flags \
              -Isrc/main/cpp "tests/$t.c" src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
              -o "build/native-indexed-ready/$t"
            ORES_NATIVE_CARRIER_CPU_AFFINITY=0 "build/native-indexed-ready/$t"
          done
      - name: Indexed scheduler ASan and UBSan
        if: matrix.cc == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -O1 -g -UNDEBUG -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -pthread \
            -Isrc/main/cpp tests/native_actor_indexed_ready_test.c \
            src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o build/native-indexed-ready/native_actor_indexed_ready_test-asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            ORES_NATIVE_CARRIER_CPU_AFFINITY=0 build/native-indexed-ready/native_actor_indexed_ready_test-asan
