name: Ensemble alias source admission (LLVM compiler)
on:
  pull_request:
    paths:
      - src/main/cpp/oreslang/frontend/Parser.cpp
      - tests/ensemble_alias_admission.sh
      - tests/fixtures/atto-ensemble-v1/**
      - .github/workflows/ensemble-alias-admission.yml
permissions:
  contents: read
jobs:
  compiler-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact head and canonical fixture
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git hash-object tests/fixtures/atto-ensemble-v1/canonical-unlowered-try-publish.atto)" = c562ad380bb283da9ffa26160653c1186ab63462
      - name: Install native compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev
      - name: Build real compiler
        run: |
          cmake -S . -B build/ensemble -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/ensemble --target oreslang-llvmc --parallel 2
      - name: Run actual CLI admission checks
        run: sh tests/ensemble_alias_admission.sh "$PWD/build/ensemble/oreslang-llvmc" "$PWD/tests/fixtures/atto-ensemble-v1/canonical-unlowered-try-publish.atto"
      - name: Evidence scope
        run: echo 'COMPILER_ADMISSION_ONLY; native typed publication and guest parity NOT_EXECUTED'
