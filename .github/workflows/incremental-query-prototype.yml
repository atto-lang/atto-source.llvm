name: Incremental Query Reference

on:
  push:
    paths:
      - "experiments/incremental_query.py"
      - "experiments/README.md"
      - "tests/test_incremental_query*.py"
      - ".github/workflows/incremental-query-prototype.yml"
  pull_request:
    paths:
      - "experiments/incremental_query.py"
      - "experiments/README.md"
      - "tests/test_incremental_query*.py"
      - ".github/workflows/incremental-query-prototype.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute in-memory query proof-of-concept tests
        run: python -m unittest discover -s tests -p 'test_incremental_query*.py' -v
