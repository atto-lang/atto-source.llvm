name: M5 LLVM bounded native actor mailbox and restart stress
on:
  push:
    branches: [test/m5-llvm-async-mailbox-supervision-20261107]
  pull_request:
    paths:
      - 'ci/m5/llvm_async_mailbox_stress.cpp'
      - 'ci/m5/verify_llvm_async.sh'
      - '.github/workflows/m5-llvm-async-mailbox.yml'
permissions:
  contents: read
jobs:
  llvm-real-async-native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      ATTO_BUILD_JOBS: "2"
      LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
      ATTO_E2E_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_CARRIER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original 57 compiler/runtime blob hashes
        run: python3 ci/verify-source-subset.py
      - name: Install LLVM 18 and native WABT build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18-dev libzstd-dev wabt cmake python3 file
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/wasm-ld-18 /usr/local/bin/wasm-ld
      - name: Rebuild real original LLVM compiler and source-native tenant guest suite
        run: bash tools/tenant-vm/verify-atto-e2e.sh
      - name: Run native C ABI async host worker and supervisor stress
        run: bash ci/m5/verify_llvm_async.sh
      - name: No security/guest false equivalence
        run: echo 'HOST_NATIVE_C_ABI_MPSC_ONLY; compiler-generated .atto guest tests ran separately; no hostile code sandbox'
