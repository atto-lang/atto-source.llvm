name: ownership-opt-preflight
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ir-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -p 'test_ownership_opt_ir.py'
