name: LLVM Oreslang rate-limit weighted scalar guest
on:
  pull_request:
    paths:
      - 'tests/fixtures/rate-limit-weighted-scalar.ores'
      - '.github/workflows/rate-limit-llvm-guest.yml'
  push:
    branches: [main]
    paths:
      - 'tests/fixtures/rate-limit-weighted-scalar.ores'
      - '.github/workflows/rate-limit-llvm-guest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify pinned candidate and common fixture blob
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object tests/fixtures/rate-limit-weighted-scalar.ores)" = 31a9b1097926d2ac3260f5536e6b576056f43f08
          echo "LLVM_RATE_LIMIT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install native compiler dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev
      - name: Build actual Oreslang LLVM frontend and lower to IR
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-rate-limit -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-rate-limit --parallel 2 --target oreslang-llvmc
          ./build-rate-limit/oreslang-llvmc tests/fixtures/rate-limit-weighted-scalar.ores > "$RUNNER_TEMP/rate-limit.ll"
          test -s "$RUNNER_TEMP/rate-limit.ll"
          grep -F 'define ' "$RUNNER_TEMP/rate-limit.ll"
          clang -x ir "$RUNNER_TEMP/rate-limit.ll" -o "$RUNNER_TEMP/rate-limit-guest"
      - name: Execute real native guest and assert signed scalar status
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/rate-limit-guest"
          status=$?
          set -e
          test "$status" -eq 25
          echo LLVM_RATE_LIMIT_GUEST_COMPILED_AND_EXECUTED_EXIT_25
