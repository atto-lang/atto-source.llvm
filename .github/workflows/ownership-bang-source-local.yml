name: Ownership bang - approved source-local LLVM native qualification

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  llvm-ownership-bang:
    # Admin approves BOTH the workflow PR head and exact source-under-test.
    if: >-
      github.event.label.name == 'ownership-bang-ci-approved' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      vars.ORESLANG_BANG_RUNNER_ENABLED == 'enabled' &&
      vars.ORESLANG_BANG_APPROVED_WORKFLOW_SHA == github.event.pull_request.head.sha &&
      vars.ORESLANG_BANG_APPROVED_SOURCE_SHA == '5eba17e441faacc85d446c2f6b12c1537709c48c'
    runs-on: [self-hosted, linux, x64, oreslang-bang-llvm-isolated]
    timeout-minutes: 75
    env:
      EXPECTED_SOURCE_SHA: '5eba17e441faacc85d446c2f6b12c1537709c48c'
      EXPECTED_SOURCE_TREE: '74aed6c4fa17b372b181886147b4594325458ed4'
      APPROVED_WORKFLOW_SHA: ${{ vars.ORESLANG_BANG_APPROVED_WORKFLOW_SHA }}
      EXPECTED_REPO: ores-truffle-oreslang/oreslang-source.llvm
    steps:
      - name: Checkout reviewed immutable code from SAME repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source before native build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPO"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APPROVED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"
          test -z "$(git status --porcelain --untracked-files=normal)"
          mkdir -p ci-evidence
          printf '%s\n' \
            "source_repository=$GITHUB_REPOSITORY" \
            "source_commit=$EXPECTED_SOURCE_SHA" \
            "source_tree=$(git rev-parse 'HEAD^{tree}')" \
            "reviewed_workflow_pr_head=$APPROVED_WORKFLOW_SHA" \
            "run_id=$GITHUB_RUN_ID" \
            "run_attempt=$GITHUB_RUN_ATTEMPT" \
            "runner=$RUNNER_NAME" \
            "scope=LLVM_native_guest_and_host_CTest_not_cross_backend_parity" \
            "result=NOT_YET_PASSED" > ci-evidence/receipt.txt
      - name: Verify pre-installed native toolchains
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          ctest --version
          clang --version
          llvm-config --version
          c++ --version
          python3 --version
          test -n "$RUNNER_NAME"
      - name: Require immutable native mutable-borrow guest fixture Git blob
        shell: bash
        run: |
          set -euo pipefail
          fixture=tests/fixtures/ownership-bang-v1/rt-borrow-mut-native.atto
          test "$(git hash-object "$fixture")" = e7b2cb178c266262a94df18dd88c46ae9d32632b
      - name: Configure clean native CMake test build
        shell: bash
        run: |
          set -euo pipefail
          # Avoid stale compiler binaries or test inventory on reused runners.
          test ! -L build
          cmake -E rm -rf build
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile real native ownership checker and LLVM compiler
        shell: bash
        run: cmake --build build --target oreslang-llvmc oreslang-native-ownership-bang-aliases-test --parallel 2
      - name: Require all fixed ownership CTest inventory entries
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N -R '^native_ownership_bang_' | tee ci-evidence/ctest-inventory.txt
          # Exhaustively require the frozen 24-case ownership-bang inventory.
          # Fail closed if any negative/guest/optimization case disappears.
          # Compare parsed CTest names exactly, not substring grep hits.
          # No missing, extra, or duplicated case may satisfy admission.
          sed -nE 's/^[[:space:]]*Test[[:space:]]+#[[:space:]]*[0-9]+:[[:space:]]+(native_ownership_bang_[A-Za-z0-9_]+)[[:space:]]*$/\1/p' ci-evidence/ctest-inventory.txt > ci-evidence/selected-tests.txt
          while IFS= read -r test_name; do
            printf '%s\n' "$test_name"
          done <<'EXPECTED_CTESTS' > ci-evidence/expected-tests.txt
          native_ownership_bang_aliases_parser_and_checker
          native_ownership_bang_copy_compact_guest
          native_ownership_bang_copy_spaced_guest
          native_ownership_bang_take_guest
          native_ownership_bang_share_guest
          native_ownership_bang_borrow_call_guest
          native_ownership_bang_rt_borrow_mut_guest
          native_ownership_bang_take_sanitizer_runtime_smoke
          native_ownership_bang_borrow_sanitizer_runtime_smoke
          native_ownership_bang_use_after_move_reject
          native_ownership_bang_escaping_borrow_reject
          native_ownership_bang_share_class_reject
          native_ownership_bang_copy_compact_O0
          native_ownership_bang_copy_spaced_O0
          native_ownership_bang_take_O0
          native_ownership_bang_share_O0
          native_ownership_bang_borrow_call_O0
          native_ownership_bang_rt_borrow_mut_O0
          native_ownership_bang_copy_compact_O2
          native_ownership_bang_copy_spaced_O2
          native_ownership_bang_take_O2
          native_ownership_bang_share_O2
          native_ownership_bang_borrow_call_O2
          native_ownership_bang_rt_borrow_mut_O2
          EXPECTED_CTESTS
          test "$(wc -l < ci-evidence/selected-tests.txt)" -eq 24
          test "$(wc -l < ci-evidence/expected-tests.txt)" -eq 24
          diff -u <(sort ci-evidence/expected-tests.txt) <(sort ci-evidence/selected-tests.txt)
          awk '/Total Tests:/ { if ($3+0 != 24) exit 1; found=1 } END { if (!found) exit 1 }' ci-evidence/ctest-inventory.txt
      - name: Execute actual native guest, O0 O2, and negative CTests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -R '^native_ownership_bang_' | tee ci-evidence/ctest-execution.txt
          grep -Fq '100% tests passed' ci-evidence/ctest-execution.txt
          if grep -Eq 'Not Run|Disabled|Skipped' ci-evidence/ctest-execution.txt; then exit 1; fi
      - name: Bind native result to Git tree and fixture SHA256
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet --exit-code
          # Retain actual per-test commands/output, not only CTest summary.
          test -s build/Testing/Temporary/LastTest.log
          cp -- build/Testing/Temporary/LastTest.log ci-evidence/ctest-detailed.log
          printf '%s\n' 'result=EXECUTED_TESTS_PASSED' >> ci-evidence/receipt.txt
          test -s build/oreslang-llvmc
          sha256sum ci-evidence/receipt.txt build/oreslang-llvmc \
            tests/fixtures/ownership-bang-v1/rt-borrow-mut-native.atto \
            ci-evidence/ctest-inventory.txt ci-evidence/ctest-execution.txt \
            ci-evidence/expected-tests.txt ci-evidence/selected-tests.txt \
            ci-evidence/ctest-detailed.log \
            > ci-evidence/objects-sha256.txt
          sha256sum --check --status ci-evidence/objects-sha256.txt
      - name: Upload proof only after executed native CTests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-bang-source-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 3
