name: Native grouped spawn charge plan (host only)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorSpawnChargePlan.hpp'
      - 'tests/actor_spawn_charge_plan_test.cpp'
      - '.github/workflows/grouped-spawn-charge-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-charge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        cxx: [g++, clang++]
        opt: [-O0, -O2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify head and execute native host tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CXX: ${{ matrix.cxx }}
          OPT: ${{ matrix.opt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'head=%s tree=%s\n' "$EXPECTED_HEAD" "$(git rev-parse HEAD^{tree})"
          "$CXX" -std=c++17 "$OPT" -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc/main/cpp tests/actor_spawn_charge_plan_test.cpp -o /tmp/atto-spawn-charge
          /tmp/atto-spawn-charge
