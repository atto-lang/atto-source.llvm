name: Closed root TaskFuture exact native AOT
on:
  pull_request:
    paths:
      - 'src/main/cpp/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'scripts/compile-aot.sh'
      - 'scripts/test-closed-root-taskfuture-aot.sh'
      - 'tests/fixtures/portable-task-v2-pilot/**'
      - '.github/workflows/closed-root-taskfuture-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build matching Clang and LLVM compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-20 llvm-20-dev
          /usr/lib/llvm-20/bin/clang --version
          /usr/lib/llvm-20/bin/llvm-config --version
          test "$(/usr/lib/llvm-20/bin/llvm-config --version | cut -d. -f1)" = 20
          test "$(/usr/lib/llvm-20/bin/clang -dumpversion | cut -d. -f1)" = 20
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build build --parallel 2 --target oreslang-llvmc oreslang-no-gc-ir-audit-build
      - name: Exact shared TaskFuture and Future generated guests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CLANG: /usr/lib/llvm-20/bin/clang
        run: |
          set -euo pipefail
          git log -1 --format='%H %T'
          bash scripts/test-closed-root-taskfuture-aot.sh
