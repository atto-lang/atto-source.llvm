name: Experimental XDP eBPF verifier gate
on:
  pull_request:
    paths:
      - '.github/workflows/ebpf-xdp.yml'
      - 'src/main/cpp/oreslang/**'
      - 'contracts/architecture/v1/targets.tsv'
      - 'tests/bpf_xdp_*'
      - 'examples/xdp_pass.ores'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bpf-xdp-elf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install LLVM BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm llvm-dev binutils python3
      - name: Build compiler
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target oreslang-llvmc --parallel 2
      - name: Test fail-closed source and real BPF ELF
        run: python3 tests/bpf_xdp_source_object.py --compiler ./build/oreslang-llvmc

  bpf-xdp-kernel-verifier:
    if: github.event_name == 'workflow_dispatch'
    needs: bpf-xdp-elf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verifier dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm llvm-dev binutils python3 libbpf-dev libelf-dev zlib1g-dev
      - name: Build compiler and structurally verified XDP objects
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target oreslang-llvmc --parallel 2
          python3 tests/bpf_xdp_source_object.py --compiler ./build/oreslang-llvmc --output-dir "$RUNNER_TEMP/xdp-objects"
      - name: Build kernel verifier harness
        run: cc -O2 -Wall -Wextra -Werror tests/bpf_xdp_kernel_run.c -lbpf -lelf -lz -o "$RUNNER_TEMP/bpf-xdp-kernel-run"
      - name: Load, verify and test-run every XDP action
        run: |
          set -euo pipefail
          uname -a
          for action in 0 1 2 3; do
            for opt in O0 O2; do
              sudo -n "$RUNNER_TEMP/bpf-xdp-kernel-run" "$RUNNER_TEMP/xdp-objects/xdp-$action-$opt.o" "$action"
            done
          done

          # packet_u8(14) == 8 ? XDP_DROP : XDP_PASS
          packet="$RUNNER_TEMP/xdp-objects/xdp-packet-u8.o"
          # 14-byte Ethernet header: offset 14 is just past data_end, so the
          # compiler-inserted bound must fall through without loading.
          sudo -n "$RUNNER_TEMP/bpf-xdp-kernel-run" "$packet" 2 14
          # 15th byte exists but mismatches: fall through.
          sudo -n "$RUNNER_TEMP/bpf-xdp-kernel-run" "$packet" 2 15 14 7
          # 15th byte exists and matches: take guarded DROP action.
          sudo -n "$RUNNER_TEMP/bpf-xdp-kernel-run" "$packet" 1 15 14 8
          # ordinary larger packet with default 0xa5 at byte 14: fall through.
          sudo -n "$RUNNER_TEMP/bpf-xdp-kernel-run" "$packet" 2 1500
