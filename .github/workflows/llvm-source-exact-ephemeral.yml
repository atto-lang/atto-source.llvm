name: LLVM actor and V3 source-exact ephemeral gate
# Workflow remains on trusted main; untrusted PR source runs only in disposable VMs.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR number (stacked PRs supported)"
        required: true
        type: string
      source_sha:
        description: "Exact current PR head commit (40 lowercase hex characters)"
        required: true
        type: string
      suite:
        description: "Exact-source actor, ledger, continuation, CGL Linux compatibility, or V3 security suite"
        required: true
        type: choice
        options:
          - actor-llvm
          - actor-ledger
          - continuation-gate
          - cgl-compat
          - security-v3
      run_sanitizers:
        description: "Optional guest sanitizers for actor suites; CGL and continuation native sanitizers are mandatory"
        type: boolean
        required: true
        default: true

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: llvm-source-exact-${{ inputs.pr_number }}-${{ inputs.source_sha }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  source-exact-validation:
    permissions:
      contents: read
      pull-requests: read
    if: github.repository == 'ores-truffle-oreslang/oreslang-source.llvm' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, oreslang-llvm-ephemeral-v1]
    timeout-minutes: 110
    steps:
      - name: Verify open same-repo PR and exact immutable head before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,7}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "ores-truffle-oreslang/oreslang-source.llvm"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RUNNER_ENVIRONMENT" = "self-hosted"
          command -v gh
          protected_main="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')"
          test "$protected_main" = "true"
          # A protected badge alone cannot authorize executable source.
          strong_main_policy="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" --jq '
            (.required_pull_request_reviews | type == "object") and
            (.required_pull_request_reviews.require_code_owner_reviews == true) and
            (.required_pull_request_reviews.dismiss_stale_reviews == true) and
            (.required_pull_request_reviews.required_approving_review_count | type == "number") and
            (.required_pull_request_reviews.required_approving_review_count >= 1) and
            (.enforce_admins.enabled == true) and
            (.allow_force_pushes.enabled == false) and
            (.allow_deletions.enabled == false) and
            (.required_status_checks | type == "object") and
            (.required_status_checks.strict == true) and
            (((.required_status_checks.contexts // []) | type) == "array") and
            (((.required_status_checks.checks // []) | type) == "array") and
            (((.required_status_checks.contexts // []) | length) > 0 or
             ((.required_status_checks.checks // []) | length) > 0) and
            ([.required_pull_request_reviews.bypass_pull_request_allowances? |
              (.users // []), (.teams // []), (.apps // [])] | all(. == []))
          ')"
          test "$strong_main_policy" = "true"
          receipt="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '[.head.sha, .head.repo.full_name, .state, (.head.repo.private|tostring), (.user.id|tostring)] | @tsv')"
          IFS=$'\t' read -r actual_sha actual_repo state private pr_author_id <<< "$receipt"
          test "$actual_sha" = "$SOURCE_SHA"
          test "$actual_repo" = "$GITHUB_REPOSITORY"
          test "$state" = "open"
          test "$private" = "true"
          [[ "$pr_author_id" =~ ^[1-9][0-9]*$ ]]
          # The latest independently submitted ORESoftware review must approve THIS HEAD.
          review_record="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" \
            --jq 'if length >= 100 then "TOO_MANY_REVIEWS" else
              ([.[] | select(.user.login == "ORESoftware" and .submitted_at != null)]
               | sort_by(.submitted_at, .id) | last // {}
               | [(.state // ""), (.commit_id // ""), (.user.id // 0 | tostring)] | @tsv)
            end')"
          IFS=$'\t' read -r review_state review_commit reviewer_id <<< "$review_record"
          test "$review_state" = "APPROVED"
          test "$review_commit" = "$SOURCE_SHA"
          test "$reviewer_id" = "11139560"
          test "$reviewer_id" != "$pr_author_id"
          echo "PROTECTED_MAIN_AND_INDEPENDENT_EXACT_HEAD_REVIEW=PASS"
      # These mock tests are part of trusted main, NOT the untrusted PR source.
      - name: Checkout trusted main for source-free workflow tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Execute trusted source-free post-run authorization regression mocks
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object --no-filters scripts/ci/test_llvm_source_exact_postrun.sh)" = \
            "$(git rev-parse HEAD:scripts/ci/test_llvm_source_exact_postrun.sh)"
          test "$(git hash-object --no-filters .github/workflows/llvm-source-exact-ephemeral.yml)" = \
            "$(git rev-parse HEAD:.github/workflows/llvm-source-exact-ephemeral.yml)"
          test "$(git hash-object --no-filters scripts/ci/verify_llvm_exact_checkout.py)" = "$(git rev-parse HEAD:scripts/ci/verify_llvm_exact_checkout.py)"
          test "$(git hash-object --no-filters scripts/ci/test_verify_llvm_exact_checkout.py)" = "$(git rev-parse HEAD:scripts/ci/test_verify_llvm_exact_checkout.py)"
          test "$(git hash-object --no-filters scripts/ci/materialize_llvm_exact_checkout.py)" = "$(git rev-parse HEAD:scripts/ci/materialize_llvm_exact_checkout.py)"
          test "$(git hash-object --no-filters scripts/ci/test_materialize_llvm_exact_checkout.py)" = "$(git rev-parse HEAD:scripts/ci/test_materialize_llvm_exact_checkout.py)"
          git cat-file blob HEAD:scripts/ci/verify_llvm_exact_checkout.py > "$RUNNER_TEMP/verify_llvm_exact_checkout.py"
          git cat-file blob HEAD:scripts/ci/materialize_llvm_exact_checkout.py > "$RUNNER_TEMP/materialize_llvm_exact_checkout.py"
          chmod 0500 "$RUNNER_TEMP/verify_llvm_exact_checkout.py" "$RUNNER_TEMP/materialize_llvm_exact_checkout.py"
          python3 scripts/ci/test_verify_llvm_exact_checkout.py
          python3 scripts/ci/test_materialize_llvm_exact_checkout.py
          bash -n scripts/ci/test_llvm_source_exact_postrun.sh
          bash scripts/ci/test_llvm_source_exact_postrun.sh .github/workflows/llvm-source-exact-ephemeral.yml
          test "$(git hash-object --no-filters scripts/ci/verify_llvm_independent_attestor.py)" = \
            "$(git rev-parse HEAD:scripts/ci/verify_llvm_independent_attestor.py)"
          python3 -I -B scripts/ci/test_verify_llvm_independent_attestor.py
          # Reviewed main is checked out, and NO PR source has run yet.
          # The checked-in identity pins are intentionally UNAPPROVED.
          for tracked_path in scripts/ci/llvm_required_check_pins.json scripts/ci/verify_llvm_required_check_pins.py scripts/ci/test_verify_llvm_required_check_pins.py; do
            test "$(git hash-object --no-filters "$tracked_path")" = "$(git rev-parse "HEAD:$tracked_path")"
          done
          python3 -I -B scripts/ci/test_verify_llvm_required_check_pins.py
          bash scripts/ci/test_prepare_source_ephemeral_jit.sh scripts/ci/prepare_source_ephemeral_jit.sh
          gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection" |
            python3 -I -B scripts/ci/verify_llvm_required_check_pins.py scripts/ci/llvm_required_check_pins.json -

      - name: Fetch pinned PR objects into empty sparse checkout (never persist auth)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          # All source paths are sparse-excluded BEFORE checkout: no smudge.
          # Fetch every blob admitted by the materializer's 128 MiB limit.
          filter: blob:limit=134217728
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*

      - name: Require exact tree and preinstalled native toolchain
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$RUNNER_ENVIRONMENT" = 'self-hosted'
          command -v python3
          test -f "$RUNNER_TEMP/verify_llvm_exact_checkout.py"
          test -f "$RUNNER_TEMP/materialize_llvm_exact_checkout.py"
          # The trusted materializer refuses any PR files checked out before it.
          python3 "$RUNNER_TEMP/materialize_llvm_exact_checkout.py" "$SOURCE_SHA"
          python3 "$RUNNER_TEMP/verify_llvm_exact_checkout.py" "$SOURCE_SHA"
          echo "EXACT_SOURCE_COMMIT=$SOURCE_SHA"
          echo "EXACT_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"

      - name: Run full V3 private-export security regressions (no export)
        if: inputs.suite == 'security-v3'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test -f scripts/publish-private-ci-source-v3.py
          test -f scripts/test-publish-private-ci-source-v3.py
          test -f tests/test_atomic_ref_cleanup_local.py
          python3 scripts/test-publish-private-ci-source-v3.py -v
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p test_private_ci_export_gate.py -v
          python3 -m unittest discover -s tests -p test_atomic_ref_cleanup_local.py -v
          echo "V3_SECURITY_SUITE_EXECUTED_FOR_EXACT_SOURCE_SHA=${{ inputs.source_sha }}"

      - name: Verify preinstalled LLVM / Clang / CMake toolchain
        if: inputs.suite == 'actor-llvm' || inputs.suite == 'actor-ledger' || inputs.suite == 'continuation-gate' || inputs.suite == 'cgl-compat'
        shell: bash
        run: |
          set -euo pipefail
          command -v cmake
          command -v clang
          command -v llvm-config
          command -v cc
          cmake --version
          clang --version
          llvm-config --version

      - name: Run real ledger, scheduler STOP and pinned physical-heap native suite
        if: inputs.suite == 'actor-ledger'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # This exact-head runner compiles GCC, Clang and Clang ASan/UBSan,
          # even if optional guest sanitizer execution is not selected.
          test -x scripts/ci/run_actor_ledger_native_exact_head.sh
          bash scripts/ci/run_actor_ledger_native_exact_head.sh "$SOURCE_SHA"

      - name: Build actual Oreslang source compiler against LLVM
        if: inputs.suite == 'actor-llvm' || inputs.suite == 'actor-ledger'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-source-exact -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build-source-exact --target oreslang-llvmc --parallel 2
          test -x build-source-exact/oreslang-llvmc

      - name: Compile and execute real Oreslang source actor fixtures
        if: inputs.suite == 'actor-llvm' || inputs.suite == 'actor-ledger'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONOPTIMIZE=0 python3 tests/source_actor_e2e.py \
            --compiler "$PWD/build-source-exact/oreslang-llvmc" \
            --clang "$(command -v clang)" --root "$PWD"

      - name: Repeat real source actor compile-and-execution under ASan/UBSan
        if: (inputs.suite == 'actor-llvm' || inputs.suite == 'actor-ledger') && inputs.run_sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          PYTHONOPTIMIZE=0 python3 tests/source_actor_e2e.py \
            --compiler "$PWD/build-source-exact/oreslang-llvmc" \
            --clang "$(command -v clang)" --root "$PWD" --sanitize

      - name: Execute real compiled Oreslang ledger guest fixtures
        if: inputs.suite == 'actor-ledger'
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/native_actor_compiled_guest_ledger.py
          PYTHONOPTIMIZE=0 python3 tests/native_actor_compiled_guest_ledger.py \
            --compiler "$PWD/build-source-exact/oreslang-llvmc" \
            --clang "$(command -v clang)" --root "$PWD"

      - name: Execute compiled ledger guests under Clang ASan and UBSan
        if: inputs.suite == 'actor-ledger' && inputs.run_sanitizers
        shell: bash
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          PYTHONOPTIMIZE=0 python3 tests/native_actor_compiled_guest_ledger.py \
            --compiler "$PWD/build-source-exact/oreslang-llvmc" \
            --clang "$(command -v clang)" --root "$PWD" --sanitize

      # Tracked checked-in C++ ownership regression, not a synthetic model.
      - name: Build and execute exact-head pinned continuation CTest
        if: inputs.suite == 'continuation-gate'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f tests/pinned_continuation_gate_test.cpp
          test -f src/main/cpp/oreslang/runtime/PinnedContinuationGate.hpp
          cmake -S . -B build-continuation-gate -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build-continuation-gate --target oreslang-pinned-continuation-gate-test --parallel 2
          ctest --test-dir build-continuation-gate -R '^native_pinned_continuation_loan_cancel_quiescence$' --output-on-failure --no-tests=error
          echo "TRACKED_PINNED_CONTINUATION_CTEST_EXECUTED_FOR_SHA=$SOURCE_SHA"

      - name: Execute exact-head pinned continuation GCC and Clang ASan UBSan
        if: inputs.suite == 'continuation-gate'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          command -v g++
          command -v clang++
          command -v timeout
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -Wall -Wextra -Wpedantic -Werror -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -I src/main/cpp tests/pinned_continuation_gate_test.cpp -o "$scratch/pinned-test"
            timeout 120s "$scratch/pinned-test"
          done
          echo "PINNED_CONTINUATION_GCC_CLANG_SANITIZERS_EXECUTED_FOR_SHA=$SOURCE_SHA"

      - name: Execute exact-head pinned continuation under GCC TSan
        if: inputs.suite == 'continuation-gate'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TSAN_OPTIONS: "halt_on_error=1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f tests/pinned_continuation_gate_test.cpp
          command -v g++
          command -v timeout
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -pthread \
            -fsanitize=thread -fno-omit-frame-pointer -I src/main/cpp \
            tests/pinned_continuation_gate_test.cpp -o "$scratch/pinned-test-tsan"
          timeout 120s "$scratch/pinned-test-tsan"
          echo "PINNED_CONTINUATION_TSAN_EXECUTED_FOR_SHA=$SOURCE_SHA"

      # Generic Linux binary compatibility only, not PREEMPT_RT/RT certification.
      - name: Execute exact-head CGL negative preflight, native compiler, CTest and guest ELF
        if: inputs.suite == 'cgl-compat'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f tests/test_cgl_preflight.py
          test -f tests/test_cgl_smoke_bounded.py
          test -f tests/fixtures/forward-call-main.ores
          test -f tests/native_cgl_host_admission_test.cpp
          test -f tests/native_cgl_dispatch_evidence_test.cpp
          test -f tests/native_cgl_carrier_slice_trace_test.cpp
          test -f scripts/cgl-native-smoke.sh
          test -f scripts/cgl-preflight.py
          test -f scripts/compile-aot.sh
          test -f tests/native_source_i64_executable.py
          PYTHONOPTIMIZE=0 python3 -I -B -m unittest discover -s tests -p test_cgl_preflight.py -v
          PYTHONOPTIMIZE=0 python3 -I -B -m unittest discover -s tests -p test_cgl_smoke_bounded.py -v
          cmake -S . -B build-cgl-source-exact -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-cgl-source-exact --target \
            oreslang-llvmc \
            oreslang-native-cgl-host-admission-test \
            oreslang-native-cgl-dispatch-evidence-test \
            oreslang-native-cgl-carrier-slice-trace-test --parallel 2
          for named_test in \
            native_cgl_linux_host_admission \
            native_cgl_timer_to_user_start_evidence \
            native_cgl_carrier_slice_timestamp_provenance \
            native_source_i64_os_exit_subset; do
            ctest --test-dir build-cgl-source-exact --output-on-failure \
              --no-tests=error -R "^${named_test}$"
          done
          bash scripts/cgl-native-smoke.sh "$PWD/build-cgl-source-exact"
          echo "CGL_SOURCE_TO_ELF_EXIT42_AND_CTEST_EXECUTED_FOR_SHA=$SOURCE_SHA"

      - name: Execute linked CGL native tests with Clang ASan and UBSan
        if: inputs.suite == 'cgl-compat'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          ASAN_OPTIONS: 'detect_leaks=1:halt_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          command -v clang++
          cmake -S . -B build-cgl-asan-ubsan \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-cgl-asan-ubsan --target \
            oreslang-native-cgl-host-admission-test \
            oreslang-native-cgl-dispatch-evidence-test \
            oreslang-native-cgl-carrier-slice-trace-test --parallel 2
          for named_test in \
            native_cgl_linux_host_admission \
            native_cgl_timer_to_user_start_evidence \
            native_cgl_carrier_slice_timestamp_provenance; do
            ctest --test-dir build-cgl-asan-ubsan --output-on-failure \
              --no-tests=error -R "^${named_test}$"
          done
          echo "CGL_CLANG_ASAN_UBSAN_LINKED_TESTS_EXECUTED_FOR_SHA=$SOURCE_SHA"

      # No post-untrusted-source GH_TOKEN or authorization in this job.
      # Only a fresh attestor job can make an independent evidence claim.
      - name: Exact-source result scope (never a carrier export approval)
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
          SANITIZERS_REQUESTED: ${{ inputs.run_sanitizers }}
        run: |
          {
            echo 'Oreslang LLVM source-org exact-head execution.'
            echo "PR: $PR_NUMBER; source commit: $SOURCE_SHA; suite: $SUITE"
            echo "Root tree: $(git rev-parse 'HEAD^{tree}' 2>/dev/null || echo NOT_CHECKED_OUT)"
            echo "ASan/UBSan requested: $SANITIZERS_REQUESTED"
            echo 'UNTRUSTED_JOB_SUMMARY_ONLY=true; independent fresh-runner attestor required.'
            echo 'This workflow does not authorize private-source export or claim retained object purge.'
            echo 'Require reviewed main workflow and one-job disposable source-only runner.'
          } >> "$GITHUB_STEP_SUMMARY"

  # NEW disposable VM, no PR checkout, no artifacts, no GITHUB_PATH/GITHUB_ENV
  # inherited from the untrusted source-exact-validation job.
  independent-postrun-attestation:
    needs: [source-exact-validation]
    if: github.repository == 'ores-truffle-oreslang/oreslang-source.llvm' && github.ref == 'refs/heads/main' && needs.source-exact-validation.result == 'success'
    runs-on: [self-hosted, linux, x64, oreslang-llvm-attestor-ephemeral-v1]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout reviewed protected main only (no PR source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify attestor source identity and run offline negative regression
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object --no-filters scripts/ci/verify_llvm_independent_attestor.py)" = \
            "$(git rev-parse HEAD:scripts/ci/verify_llvm_independent_attestor.py)"
          test "$(git hash-object --no-filters scripts/ci/test_verify_llvm_independent_attestor.py)" = \
            "$(git rev-parse HEAD:scripts/ci/test_verify_llvm_independent_attestor.py)"
          python3 -I -B scripts/ci/test_verify_llvm_independent_attestor.py
          for tracked_path in scripts/ci/llvm_required_check_pins.json scripts/ci/verify_llvm_required_check_pins.py scripts/ci/test_verify_llvm_required_check_pins.py; do
            test "$(git hash-object --no-filters "$tracked_path")" = "$(git rev-parse "HEAD:$tracked_path")"
          done
          python3 -I -B scripts/ci/test_verify_llvm_required_check_pins.py

      - name: Independently verify current exact head approval and actual source job steps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUITE: ${{ inputs.suite }}
          RUN_SANITIZERS: ${{ inputs.run_sanitizers }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONOPTIMIZE=0 python3 -I -B scripts/ci/verify_llvm_independent_attestor.py
