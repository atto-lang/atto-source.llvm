name: explicit-exports-v1

on:
  push:
    branches:
      - "feat/explicit-exports-v1-20261025"
  pull_request:
    paths:
      - "src/main/cpp/oreslang/frontend/Parser.hpp"
      - "src/main/cpp/oreslang/frontend/Parser.cpp"
      - "src/main/cpp/oreslang/frontend/ModuleLoader.cpp"
      - "src/main/cpp/oreslang/main.cpp"
      - "tests/explicit_exports_v1_source_admission_test.cpp"
      - "tests/explicit_exports_v1_module_loader_test.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/explicit-exports-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    name: exact-head native export parser and resolver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev
      - name: Configure focused native test
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile production export gates
        run: cmake --build build --target oreslang-native-explicit-exports-v1-test oreslang-native-explicit-exports-v1-loader-test --parallel 2
      - name: Run production export gates
        run: ctest --test-dir build -R '^native_explicit_exports_v1_(source_admission|module_loader)
 --output-on-failure --timeout 60
