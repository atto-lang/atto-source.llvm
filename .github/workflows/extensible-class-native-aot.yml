name: Extensible class declaration standalone native AOT
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'ci/test_extensible_declarations_native.sh'
      - '.github/workflows/extensible-class-native-aot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable source identity
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          git rev-parse 'HEAD^{tree}'
          git diff --quiet HEAD --
      - name: Build production compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm-dev cmake ninja-build
          cmake -S . -B build/extensible -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/extensible --parallel 2 --target oreslang-llvmc
      - name: Link and execute actual standalone native guest binaries
        run: |
          bash ci/test_extensible_declarations_native.sh build/extensible/oreslang-llvmc clang
          git diff --quiet HEAD --
          sha256sum build/extensible/oreslang-llvmc
