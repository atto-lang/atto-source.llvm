name: AttoLang LLVM 50-program native guest parity
on:
  pull_request:
    paths:
      - contracts/atto-parity-v1/shared-scalar50-v1.tsv
      - tests/atto_shared_scalar50_native.cmake
      - tests/atto_checked_i64_native.cmake
      - tests/atto_i64_original_native.cmake
      - tests/atto_i64_original_guest_probe.c
      - contracts/atto-parity-v1/js-checked-i64-candidates.json
      - CMakeLists.txt
      - .github/workflows/atto-scalar50-native.yml
      - scripts/compare-atto-js-llvm-receipts.mjs
      - tests/atto_js_llvm_receipt_comparison.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-source-to-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Admit the exact PR source HEAD
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          echo "LLVM source head: $EXPECTED_SOURCE_SHA"
          echo "LLVM source tree: $(git rev-parse 'HEAD^{tree}')"
      - name: Install LLVM/Clang toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential binutils cmake clang llvm-dev
          clang --version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify JS/LLVM receipt comparison controls (HOST-ONLY)
        run: node --test tests/atto_js_llvm_receipt_comparison.test.mjs
      - name: Build the real LLVM source compiler
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DATTO_EXPECTED_SOURCE_SHA="$EXPECTED_SOURCE_SHA"
          cmake --build build --target oreslang-llvmc --parallel 2
      - name: Validate corpora and execute 278 O0/O2 native guest processes
        run: |
          set -euo pipefail
          rm -f build/atto-shared-scalar50-native/llvm-scalar50-native-receipt.json
          rm -f build/atto-checked-i64-native/llvm-checked-i64-native-receipt.json
          rm -f build/atto-i64-original-native/llvm-original-i64-native-receipt.json
          ctest --test-dir build --output-on-failure -R '^atto_(shared_scalar50|checked_i64|i64_original)_'
      - name: Audit exact-head native guest receipts
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const file = "build/atto-shared-scalar50-native/llvm-scalar50-native-receipt.json";
            const r = JSON.parse(readFileSync(file,"utf8"));
            const hash = /^[a-f0-9]{64}$/;
            if (r.schema !== "atto-native-scalar50-v1" ||
                r.verification !== "LLVM_NATIVE_GUEST_EXECUTED" ||
                r.source_head !== process.env.EXPECTED_SOURCE_SHA ||
                r.corpus_sha256 !== "210dbe7363e5388e4f82c4de9fe7f8136ee6a7dca698ce72165e006fd5ecb0db" ||
                r.executed_cases !== 50 || r.executed_guest_processes !== 100 ||
                JSON.stringify(r.optimization_modes) !== JSON.stringify(["O0","O2"]) ||
                !Array.isArray(r.results) || r.results.length !== 50 ||
                !hash.test(r.compiler_sha256) || !hash.test(r.clang_sha256) ||
                r.results.some((entry,i) =>
                  entry.id !== "scalar-"+String(i+1).padStart(3,"0") ||
                  entry.expected_exit !== entry.observed_exit ||
                  entry.expected_exit !== entry.observed_exit_o2 ||
                  !Number.isInteger(entry.observed_exit) ||
                  entry.observed_exit < 0 || entry.observed_exit > 255 ||
                  !hash.test(entry.source_sha256)))
              throw Error("unverified or mismatched LLVM guest receipt");
            console.log("Pinned source LLVM native guest exits verified: 50/50",r.source_head);
          '

          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const path = "build/atto-checked-i64-native/llvm-checked-i64-native-receipt.json";
            const r = JSON.parse(readFileSync(path,"utf8"));
            const hash = /^[a-f0-9]{64}$/;
            const ids=new Set();
            if(r.schema!=="atto-llvm-checked-i64-native-v1" ||
               r.verification!=="LLVM_NATIVE_GUEST_EXECUTED" ||
               r.source_head!==process.env.EXPECTED_SOURCE_SHA ||
               r.corpus_sha256!=="5fd8ed522dfaaead8dc1b2d780159a4f156482124b7515d0a788245fc594ebc8" ||
               r.equality_control_guests!==4 || r.executed_guest_processes!==104 ||
               JSON.stringify(r.optimization_modes)!==JSON.stringify(["O0","O2"]) ||
               r.values_checked!==37 || r.overflow_guests_trapped!==13 ||
               !Array.isArray(r.results) || r.results.length!==50 ||
               !hash.test(r.compiler_sha256)||!hash.test(r.clang_sha256))
              throw Error("checked-i64 LLVM native receipt metadata invalid");
            let values=0,traps=0;
            for(const item of r.results){
              if(typeof item.id!=="string"||ids.has(item.id)||
                 !hash.test(item.original_source_sha256)||
                 !hash.test(item.native_source_sha256))
                throw Error("invalid source identity or duplicate checked-i64 case");
              ids.add(item.id);
              if(item.kind==="value"&&item.native_observed==="value-eq"&&
                 item.raw_guest_result==="42" && item.raw_guest_result_o2==="42")values++;
              else if(item.kind==="checked-overflow"&&
                      item.native_observed==="overflow-trap"&&
                      /^(Illegal instruction|Trace\/breakpoint trap|Abort trap)$/.test(item.raw_guest_result)&&
                      /^(Illegal instruction|Trace\/breakpoint trap|Abort trap)$/.test(item.raw_guest_result_o2))traps++;
              else throw Error("invalid raw guest result for "+item.id);
            }
            if(values!==37||traps!==13)throw Error("checked-i64 native guest inventory mismatch");
            console.log("LLVM full-width i64 equality: 37/37; checked traps: 13/13",r.source_head);
          '
      - name: Verify per-case source hashes and independently recomputed native wrappers
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {createHash} from "node:crypto";
            import {readFileSync} from "node:fs";
            import {execFileSync} from "node:child_process";
            const sha=source=>createHash("sha256").update(source).digest("hex");
            const read=path=>readFileSync(path,"utf8");
            const base="contracts/atto-parity-v1/";
            const receiptDir="build/";
            const scalar=JSON.parse(read(receiptDir+"atto-shared-scalar50-native/llvm-scalar50-native-receipt.json"));
            const checked=JSON.parse(read(receiptDir+"atto-checked-i64-native/llvm-checked-i64-native-receipt.json"));
            const head=execFileSync("/usr/bin/git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
            const tree=execFileSync("/usr/bin/git",["rev-parse","HEAD^{tree}"],{encoding:"utf8"}).trim();
            const compilerHash=sha(readFileSync("build/oreslang-llvmc"));
            if(head!==process.env.EXPECTED_SOURCE_SHA ||
               scalar.source_head!==head || checked.source_head!==head ||
               scalar.source_tree!==tree || checked.source_tree!==tree ||
               scalar.compiler_sha256!==compilerHash || checked.compiler_sha256!==compilerHash ||
               scalar.clang_sha256!==checked.clang_sha256)
              throw Error("source/compiler/tree binding mismatch between native receipts");
            const corpus=read(base+"shared-scalar50-v1.tsv");
            if(sha(corpus)!=="210dbe7363e5388e4f82c4de9fe7f8136ee6a7dca698ce72165e006fd5ecb0db")throw Error("scalar corpus changed");
            const lines=corpus.trimEnd().split("\n").filter(row=>!row.startsWith("#"));
            if(lines.length!==50)throw Error("scalar corpus size changed");
            for(let i=0;i<50;i++){
              const parts=lines[i].split("\t");
              const got=scalar.results[i];
              if(parts.length!==3 || !got || got.id!==parts[0] ||
                 got.expected_exit!==Number(parts[1]) ||
                 got.observed_exit!==Number(parts[1]) ||
                 got.observed_exit_o2!==Number(parts[1]) ||
                 got.source_sha256!==sha(parts[2]))
                throw Error("scalar source/exit receipt mismatch at "+i);
            }
            const jsonText=read(base+"js-checked-i64-candidates.json");
            if(sha(jsonText)!=="5fd8ed522dfaaead8dc1b2d780159a4f156482124b7515d0a788245fc594ebc8")throw Error("checked corpus changed");
            const manifest=JSON.parse(jsonText);
            if(manifest.cases?.length!==50 || checked.results?.length!==50)throw Error("checked case count mismatch");
            const prefix="// oreslang:checked-i64-v1\npub fnc main(): int {return ";
            const suffix=";}\n";
            for(let i=0;i<50;i++){
              const test=manifest.cases[i], got=checked.results[i];
              if(!test || !got || !test.source.startsWith(prefix) || !test.source.endsWith(suffix) ||
                 got.id!==test.id || got.kind!==test.expected.kind ||
                 got.original_source_sha256!==sha(test.source))
                throw Error("checked original-source binding mismatch at "+i);
              const expression=test.source.slice(prefix.length,-suffix.length);
              const native=test.expected.kind==="value"
                ? "pub fnc main(): int {\n  if (("+expression+") eq ("+test.expected.value+")) { return 42; } fi\n  return 43;\n}\n"
                : test.source;
              if(got.native_source_sha256!==sha(native))
                throw Error("checked native-wrapper source mismatch at "+i);
            }
            console.log("Authenticated original and emitted source hashes: scalar 50/50; checked-i64 50/50",head);
          '
      - name: Verify unchanged 37 original AttoLang sources execute with full i64 results
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {createHash} from "node:crypto";
            import {readFileSync} from "node:fs";
            import {execFileSync} from "node:child_process";
            const sha=b=>createHash("sha256").update(b).digest("hex");
            const read=p=>readFileSync(p,"utf8");
            const original=JSON.parse(read("build/atto-i64-original-native/llvm-original-i64-native-receipt.json"));
            const checked=JSON.parse(read("build/atto-checked-i64-native/llvm-checked-i64-native-receipt.json"));
            const manifest=JSON.parse(read("contracts/atto-parity-v1/js-checked-i64-candidates.json"));
            const head=execFileSync("/usr/bin/git",["rev-parse","HEAD"],{encoding:"utf8"}).trim();
            const tree=execFileSync("/usr/bin/git",["rev-parse","HEAD^{tree}"],{encoding:"utf8"}).trim();
            const hash=/^[a-f0-9]{64}$/;
            if(head!==process.env.EXPECTED_SOURCE_SHA ||
               original.schema!=="atto-llvm-original-i64-native-v1" ||
               original.verification!=="LLVM_ORIGINAL_SOURCE_GUEST_EXECUTED" ||
               original.source_head!==head || original.source_tree!==tree ||
               original.corpus_sha256!=="5fd8ed522dfaaead8dc1b2d780159a4f156482124b7515d0a788245fc594ebc8" ||
               original.compiler_sha256!==sha(readFileSync("build/oreslang-llvmc")) ||
               original.compiler_sha256!==checked.compiler_sha256 ||
               original.clang_sha256!==checked.clang_sha256 ||
               original.probe_sha256!==sha(readFileSync("tests/atto_i64_original_guest_probe.c")) ||
               !hash.test(original.objcopy_sha256) ||
               original.original_value_cases!==37 ||
               original.executed_guest_processes!==74 ||
               JSON.stringify(original.optimization_modes)!==JSON.stringify(["O0","O2"]) ||
               !Array.isArray(original.results) || original.results.length!==37 ||
               manifest.cases?.length!==50)
              throw Error("unverified original-source LLVM native guest receipt");
            let i=0;
            for(const spec of manifest.cases){
              if(spec.expected?.kind!=="value")continue;
              const item=original.results[i++];
              if(!item || item.id!==spec.id ||
                 item.expected_i64!==spec.expected.value ||
                 item.source_sha256!==sha(Buffer.from(spec.source,"utf8")) ||
                 !hash.test(item.ir_sha256) ||
                 item.observed_exit_o0!==42 || item.observed_exit_o2!==42)
                throw Error("unchanged source returned wrong full-width i64 at "+spec.id);
            }
            if(i!==37)throw Error("missing actual original-source native guest cases");
            console.log("37/37 unchanged source programs, O0+O2, 74/74 native guest processes; HEAD:",head);
          '
      - name: Preserve native guest receipt
        # Never upload stale or partial 'success' receipts from a failed test.
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atto-llvm-native-scalar50
          path: |
            build/atto-shared-scalar50-native/llvm-scalar50-native-receipt.json
            build/atto-checked-i64-native/llvm-checked-i64-native-receipt.json
            build/atto-i64-original-native/llvm-original-i64-native-receipt.json
          if-no-files-found: error
