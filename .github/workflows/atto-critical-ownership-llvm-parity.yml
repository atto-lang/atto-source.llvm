name: AttoLang LLVM critical and ownership parity

on:
  push:
    branches:
      - 'feat/atto-critical-diagnostic-llvm-parity-*'
      - 'feat/atto-native-critical-ownership-main-*'
      - 'audit/rt-take-conditional-native-*'
      - 'audit/llvm-affine-cfg-join-complete-*'
      - 'audit/llvm-rt-take-tracked-source-*'
      - 'audit/llvm-share-borrow-provenance-*'
      - 'audit/llvm-ownership-moveplace-corpus-*'
      - 'audit/llvm-share-place-negative-v2-*'
      - 'audit/llvm-resolved-place-origin-*'
      - 'audit/llvm-typed-place-id-fixtures-*'
      - 'audit/llvm-identity-inventory-cfg-v2-*'
      - 'audit/llvm-nll-partial-move-contract-v1-*'
      - 'audit/llvm-nll-closed-world-*'
      - 'audit/llvm-loan-write-ticket-domain-*'
      - 'audit/llvm-typed-mir-receipt-fence-*'
      - 'audit/llvm-mir-opaque-effects-hardening-*'
      - 'audit/llvm-ir-ssa-store-census-*'
      - 'audit/llvm-source-field-store-ledger-*'
      - 'audit/llvm-source-fieldwrite-completeness-*'
      - 'audit/llvm-validated-source-node-ids-*'
      - 'audit/llvm-reinitialize-store-bridge-*'
      - 'audit/llvm-sourcechecked-reinit-store-*'
      - 'audit/llvm-checker-mir-op-inventory-*'
      - 'audit/llvm-straight-line-source-mir-*'
      - 'audit/llvm-straight-line-mir-shape-fence-*'
      - 'audit/llvm-mir-auxiliary-effect-fence-*'
      - 'audit/llvm-mir-source-budget-place-fence-*'
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/main.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipChecker.cpp'
      - 'src/main/cpp/oreslang/types/NativeOwnershipPlace.hpp'
      - 'tests/native_share_place_authority_test.cpp'
      - 'tests/native_share_projection_root_test.cpp'
      - 'tests/native_compiler_place_origin_test.cpp'
      - 'tests/native_ownership_identity_inventory_30_test.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipCfg.hpp'
      - 'src/main/cpp/oreslang/types/StraightLineSourceMir.hpp'
      - 'src/main/cpp/oreslang/types/SourceMirEffectShape.hpp'
      - 'tests/native_straight_line_mir_74_test.cpp'
      - 'tests/native_straight_line_mir_aux_admission_24_test.cpp'
      - 'tests/native_straight_line_mir_metadata_20_test.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipLastUse.hpp'
      - 'tests/native_ownership_nll_partial_move_30_test.cpp'
      - 'tests/native_ownership_nll_closed_world_16_test.cpp'
      - 'tests/native_ownership_derived_last_use_12_test.cpp'
      - 'tests/native_ownership_opaque_loan_metadata_10_test.cpp'
      - 'tests/native_ownership_loan_write_domain_6_test.cpp'
      - 'tests/native_ownership_mir_receipts_30_test.cpp'
      - 'tests/native_ownership_mir_opaque_effects_18_test.cpp'
      - 'tests/native_ir_ssa_store_census_30_test.cpp'
      - 'tests/native_source_field_store_ledger_75_test.cpp'
      - 'tests/native_source_fieldwrite_coverage_170_test.cpp'
      - 'src/main/cpp/oreslang/backend/NativeIrReinitializeWriteBridge.hpp'
      - 'src/main/cpp/oreslang/backend/NativeIrSourceCheckedReinitialize.hpp'
      - 'tests/native_source_checked_reinitialize_guest.py'
      - 'tests/fixtures/atto-reinitialize-checked-store-positive.atto'
      - 'tests/fixtures/atto-reinitialize-ordinary-write-control.atto'
      - 'tests/fixtures/atto-reinitialize-use-after-move-reject.atto'
      - 'tests/native_source_node_identity_85_test.cpp'
      - 'tests/native_tree_shaking.py'
      - 'src/main/cpp/oreslang/types/SourceNodeIdentity.hpp'
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/backend/NativeIrFieldWriteLedger.hpp'
      - 'src/main/cpp/oreslang/backend/NativeIrOwnershipCensus.hpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipMirEvidence.hpp'
      - 'tests/contracts/atto_ownership_place_mir_50.json'
      - 'tests/ownership_compiler_fixture_matrix.py'
      - 'tests/test_ownership_compiler_fixture_matrix.py'
      - 'src/main/cpp/oreslang/types/NativeOwnershipJoin.hpp'
      - 'tests/native_ownership_join_test.cpp'
      - 'src/main/cpp/oreslang/types/NativeOwnershipPlace.hpp'
      - 'tests/native_ownership_place_test.cpp'
      - 'tests/fixtures/atto-*.atto'
      - 'CMakeLists.txt'
      - '.github/workflows/atto-critical-ownership-llvm-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llvm-native-critical-share:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind source to exact PR head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_LLVM_EXACT_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_LLVM_EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install Clang/LLVM developer toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev python3
          clang --version
          cmake --version
      - name: Build production LLVM compiler (not a mock)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2 --target oreslang-llvmc
          test -s build/oreslang-llvmc
          sha256sum build/oreslang-llvmc
      - name: Execute production ownership CFG join metadata gate
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 --target oreslang-native-ownership-join-test
          ctest --test-dir build -N -R '^native_ownership_affine_join_complete$' > /tmp/atto-ownership-join-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_affine_join_complete$' /tmp/atto-ownership-join-inventory.txt
          ctest --test-dir build -R '^native_ownership_affine_join_complete$' --output-on-failure --timeout 60 --output-junit /tmp/atto-ownership-join.xml
          test -s /tmp/atto-ownership-join.xml
          echo "ATTO_LLVM_JOIN_PROOF=HOST_CPP17_EXECUTED"

      - name: Execute nineteen source-owned place, identity and NLL integrity CTests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 --target \
            oreslang-native-ownership-place-test \
            oreslang-native-share-place-authority-test \
            oreslang-native-share-projection-root-test \
            oreslang-native-compiler-place-origin-test \
            oreslang-native-ownership-identity-inventory-30-test \
            oreslang-native-ownership-nll-partial-move-30-test \
            oreslang-native-ownership-nll-closed-world-16-test \
            oreslang-native-derived-last-use-12-test \
            oreslang-native-ownership-opaque-loan-metadata-10-test \
            oreslang-native-loan-write-domain-6-test \
            oreslang-native-mir-receipts-30-test \
            oreslang-native-mir-opaque-effects-18-test \
            oreslang-native-ir-ssa-census-30-test \
            oreslang-native-source-field-store-ledger-75-test \
            oreslang-native-source-fieldwrite-coverage-170-test \
            oreslang-source-node-identity-85-test \
            oreslang-native-straight-line-mir-74-test \
            oreslang-native-straight-line-aux-admission-24-test \
            oreslang-native-straight-line-metadata-20-test
          ctest --test-dir build -N -R '^(native_ownership_take_place_classification|native_ownership_share_place_authority|native_ownership_share_projection_root|native_ownership_compiler_resolved_place_origin|native_ownership_identity_inventory_30|native_ownership_nll_partial_move_30|native_ownership_nll_closed_world_16|native_ownership_derived_last_use_12|native_ownership_opaque_loan_metadata_10|native_ownership_loan_write_domain_6|native_ownership_mir_receipts_30|native_ownership_mir_opaque_effects_18|native_ownership_ir_ssa_store_census_30|native_ownership_source_field_store_ledger_75|native_ownership_source_fieldwrite_coverage_170|native_ownership_source_node_identity_85|native_ownership_straight_line_source_mir_74|native_ownership_straight_line_aux_admission_24|native_ownership_straight_line_metadata_20)$' > /tmp/atto-ownership-focused-inventory.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          names = {
              'native_ownership_take_place_classification',
              'native_ownership_share_place_authority',
              'native_ownership_share_projection_root',
              'native_ownership_compiler_resolved_place_origin',
              'native_ownership_identity_inventory_30',
              'native_ownership_nll_partial_move_30',
              'native_ownership_nll_closed_world_16',
              'native_ownership_derived_last_use_12',
              'native_ownership_opaque_loan_metadata_10',
              'native_ownership_loan_write_domain_6',
              'native_ownership_mir_receipts_30',
              'native_ownership_mir_opaque_effects_18',
              'native_ownership_ir_ssa_store_census_30',
              'native_ownership_source_field_store_ledger_75',
              'native_ownership_source_fieldwrite_coverage_170',
              'native_ownership_source_node_identity_85',
              'native_ownership_straight_line_source_mir_74',
              'native_ownership_straight_line_aux_admission_24',
              'native_ownership_straight_line_metadata_20',
          }
          rows = Path('/tmp/atto-ownership-focused-inventory.txt').read_text().splitlines()
          found = [m.group(1) for row in rows
                   if (m := re.fullmatch(r'\s*Test +#[0-9]+: (native_ownership_[A-Za-z0-9_]+)', row))]
          if len(found) != 19 or len(set(found)) != 19 or set(found) != names:
              raise SystemExit(f'CTests missing, repeated, or substituted: {found!r}')
          PY
          ctest --test-dir build -R '^(native_ownership_take_place_classification|native_ownership_share_place_authority|native_ownership_share_projection_root|native_ownership_compiler_resolved_place_origin|native_ownership_identity_inventory_30|native_ownership_nll_partial_move_30|native_ownership_nll_closed_world_16|native_ownership_derived_last_use_12|native_ownership_opaque_loan_metadata_10|native_ownership_loan_write_domain_6|native_ownership_mir_receipts_30|native_ownership_mir_opaque_effects_18|native_ownership_ir_ssa_store_census_30|native_ownership_source_field_store_ledger_75|native_ownership_source_fieldwrite_coverage_170|native_ownership_source_node_identity_85|native_ownership_straight_line_source_mir_74|native_ownership_straight_line_aux_admission_24|native_ownership_straight_line_metadata_20)$' \
            --output-on-failure --timeout 90 --output-junit /tmp/atto-ownership-focused.xml
          test -s /tmp/atto-ownership-focused.xml
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-ownership-focused.xml').getroot()
          expected = {
              'native_ownership_take_place_classification',
              'native_ownership_share_place_authority',
              'native_ownership_share_projection_root',
              'native_ownership_compiler_resolved_place_origin',
              'native_ownership_identity_inventory_30',
              'native_ownership_nll_partial_move_30',
              'native_ownership_nll_closed_world_16',
              'native_ownership_derived_last_use_12',
              'native_ownership_opaque_loan_metadata_10',
              'native_ownership_loan_write_domain_6',
              'native_ownership_mir_receipts_30',
              'native_ownership_mir_opaque_effects_18',
              'native_ownership_ir_ssa_store_census_30',
              'native_ownership_source_field_store_ledger_75',
              'native_ownership_source_fieldwrite_coverage_170',
              'native_ownership_source_node_identity_85',
              'native_ownership_straight_line_source_mir_74',
              'native_ownership_straight_line_aux_admission_24',
              'native_ownership_straight_line_metadata_20',
          }
          actual = [case.get('name') for case in root.iter('testcase')]
          failures = int(root.get('failures', '1'))
          errors = int(root.get('errors', '0'))
          skipped = int(root.get('skipped', '1'))
          if (int(root.get('tests', '-1')) != 19 or failures or errors or skipped or
                  len(actual) != 19 or len(set(actual)) != 19 or set(actual) != expected):
              raise SystemExit(f'ownership CTest receipt incomplete or invalid: {actual!r}')
          print('ATTO_LLVM_OWNERSHIP_FOCUSED=19/19_HOST_CTEST_EXECUTED')
          PY

      - name: Prove twenty scoped compiler CTest cases are registered
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N > /tmp/atto-parity-inventory.txt
          cat /tmp/atto-parity-inventory.txt
          for name in \
            atto_critical_suspends_fnc_rejected \
            atto_suspends_critical_routine_rejected \
            atto_critical_suspends_class_method_rejected \
            atto_suspends_critical_class_method_rejected \
            atto_critical_suspends_actor_method_rejected \
            atto_critical_suspends_comment_trivia_rejected \
            atto_suspends_critical_line_trivia_rejected \
            atto_critical_only_remains_unlowered \
            atto_suspends_only_remains_unlowered \
            atto_critical_read_remains_unlowered \
            atto_share_move_only_array_rejected \
            atto_share_move_only_class_rejected \
            atto_take_conditional_untracked_rejected \
            atto_take_computed_untracked_rejected \
            atto_share_borrowed_parameter_rejected \
            atto_share_borrowed_class_field_rejected \
            atto_protected_state_requires_typed_lowering \
            atto_copyable_share_native_execution \
            atto_copyable_copy_native_execution \
            atto_copyable_take_native_execution
          do
            grep -Eq "Test +#[0-9]+: ${name}$" /tmp/atto-parity-inventory.txt
          done
      - name: Require compiler diagnostics and Clang-linked native guest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build \
            -R '^(atto_critical_suspends_fnc_rejected|atto_suspends_critical_routine_rejected|atto_critical_suspends_class_method_rejected|atto_suspends_critical_class_method_rejected|atto_critical_suspends_actor_method_rejected|atto_critical_suspends_comment_trivia_rejected|atto_suspends_critical_line_trivia_rejected|atto_critical_only_remains_unlowered|atto_suspends_only_remains_unlowered|atto_critical_read_remains_unlowered|atto_share_move_only_array_rejected|atto_share_move_only_class_rejected|atto_take_conditional_untracked_rejected|atto_take_computed_untracked_rejected|atto_share_borrowed_parameter_rejected|atto_share_borrowed_class_field_rejected|atto_protected_state_requires_typed_lowering|atto_copyable_share_native_execution|atto_copyable_copy_native_execution|atto_copyable_take_native_execution)$' \
            --output-on-failure --timeout 180 --output-junit /tmp/atto-llvm-parity.xml
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-llvm-parity.xml').getroot()
          tests = int(root.get('tests', '0'))
          failures = int(root.get('failures', '0'))
          skipped = int(root.get('skipped', '0'))
          if tests != 20 or failures or skipped:
              raise SystemExit(f'LLVM CTest evidence invalid: {tests=} {failures=} {skipped=}')
          names = {x.get('name') for x in root.iter('testcase')}
          if len(names) != 20:
              raise SystemExit(f'LLVM distinct CTest cases invalid: {names=}')
          print('ATTO_LLVM_PARITY_SCOPED=PASS executed_ctests=20')
          print('ATTO_LLVM_PROTECTED_OBJECT_MIR=NOT_IMPLEMENTED')
          print('ATTO_LLVM_LRU_FULL_FIXTURES=NOT_EXECUTED')
          PY
      - name: Execute 50 real compiler fixtures and fail-closed matrix mutations
        shell: bash
        run: |
          set -euo pipefail
          # Both tests must have been registered at CMake configure time.
          ctest --test-dir build -N -R '^(native_ownership_place_mir_manifest_19_mutations|atto_ownership_place_mir_real_compiler_50)$' > /tmp/atto-mir-fixture-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_place_mir_manifest_19_mutations$' /tmp/atto-mir-fixture-inventory.txt
          grep -Eq 'Test +#[0-9]+: atto_ownership_place_mir_real_compiler_50$' /tmp/atto-mir-fixture-inventory.txt
          # The manifest unit suite cannot replace compiler execution.
          ctest --test-dir build -V -R '^native_ownership_place_mir_manifest_19_mutations$' --timeout 90
          ctest --test-dir build -V -R '^atto_ownership_place_mir_real_compiler_50$' \
            --output-junit /tmp/atto-real-compiler-50.xml --timeout 1000 | tee /tmp/atto-real-compiler-50.log
          grep -Fq 'ATTO_OWNERSHIP_REAL_COMPILER_FIXTURES=50/50_EXECUTED' /tmp/atto-real-compiler-50.log
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-real-compiler-50.xml').getroot()
          tests = int(root.get('tests', '-1'))
          failures = int(root.get('failures', '1'))
          skipped = int(root.get('skipped', '1'))
          if tests != 1 or failures or skipped:
              raise SystemExit(f'50-compiler fixture CTest invalid: {tests=} {failures=} {skipped=}')
          print('ATTO_LLVM_MIR_PLACE_SOURCE_COMPILER=REAL_50_CASES_EXECUTED')
          PY

      - name: Execute real compiler tree-shake/source-identity reseal guest
        shell: bash
        run: |
          set -euo pipefail
          # This is distinct from host-only CTest and the ownership 50-case
          # matrix: it exercises --tree-shake on the production LLVM compiler,
          # links the emitted IR using Clang, then executes native guests.
          ctest --test-dir build -N -R '^native_tree_shaking_direct_calls
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "ATTO_LLVM_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_LLVM_FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
 > /tmp/atto-source-reseal-ctest-inventory.txt
          test "$(grep -Ec '^[[:space:]]*Test +#[0-9]+: native_tree_shaking_direct_calls
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "ATTO_LLVM_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_LLVM_FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
 /tmp/atto-source-reseal-ctest-inventory.txt)" = 1
          ctest --test-dir build -V -R '^native_tree_shaking_direct_calls
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "ATTO_LLVM_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_LLVM_FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
 \
            --timeout 180 --output-junit /tmp/atto-source-reseal-guest.xml \
            | tee /tmp/atto-source-reseal-guest.log
          grep -Fq 'ATTO_TREE_SHAKE_SOURCE_RESEAL=COMPILER_CLANG_GUEST_EXECUTED' /tmp/atto-source-reseal-guest.log
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-source-reseal-guest.xml').getroot()
          actual = [case.get('name') for case in root.iter('testcase')]
          bad = sum(int(root.get(key, '0')) for key in ('failures', 'errors', 'skipped'))
          if root.get('tests') != '1' or actual != ['native_tree_shaking_direct_calls'] or bad:
              raise SystemExit(f'compiler tree-shake/source-seal guest receipt invalid: {actual=} {bad=}')
          print('ATTO_LLVM_TREE_SHAKE_SOURCE_RESEAL=1/1_COMPILER_GUEST_EXECUTED')
          PY

      - name: Execute real checker-origin reinitialization LLVM guest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N -R '^native_source_checked_reinitialize_guest$' > /tmp/atto-reinit-guest-inventory.txt
          test "$(grep -Ec '^[[:space:]]*Test +#[0-9]+: native_source_checked_reinitialize_guest$' /tmp/atto-reinit-guest-inventory.txt)" = 1
          ctest --test-dir build -V -R '^native_source_checked_reinitialize_guest$' \
            --timeout 180 --output-junit /tmp/atto-reinit-source-checked.xml \
            | tee /tmp/atto-reinit-source-checked.log
          grep -Fq 'ATTO_LLVM_SOURCE_CHECKED_REINITIALIZE=2_GUESTS_1_REJECTION_EXECUTED' /tmp/atto-reinit-source-checked.log
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-reinit-source-checked.xml').getroot()
          cases = [case.get('name') for case in root.iter('testcase')]
          bad = sum(int(root.get(key, '0')) for key in ('failures', 'errors', 'skipped'))
          if root.get('tests') != '1' or cases != ['native_source_checked_reinitialize_guest'] or bad:
              raise SystemExit(f'reinit source-checked compiler guest receipt invalid: {cases=} {bad=}')
          print('ATTO_LLVM_REINITIALIZE_SOURCE_TO_STORE=2/2_COMPILER_GUESTS_EXECUTED')
          PY

      - name: Reverify checkout head and clean tracked source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "ATTO_LLVM_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_LLVM_FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
