name: AttoLang LLVM critical and ownership parity

on:
  push:
    branches:
      - 'feat/atto-critical-diagnostic-llvm-parity-*'
      - 'feat/atto-native-critical-ownership-main-*'
      - 'audit/rt-take-conditional-native-*'
      - 'audit/llvm-affine-cfg-join-complete-*'
      - 'audit/llvm-rt-take-tracked-source-*'
      - 'audit/llvm-share-borrow-provenance-*'
      - 'audit/llvm-ownership-moveplace-corpus-*'
      - 'audit/llvm-share-place-negative-v2-*'
      - 'audit/llvm-resolved-place-origin-*'
      - 'audit/llvm-typed-place-id-fixtures-*'
      - 'audit/llvm-identity-inventory-cfg-v2-*'
      - 'audit/llvm-nll-partial-move-contract-v1-*'
      - 'audit/llvm-nll-closed-world-*'
      - 'audit/llvm-loan-write-ticket-domain-*'
      - 'audit/llvm-typed-mir-receipt-fence-*'
      - 'audit/llvm-mir-opaque-effects-hardening-*'
      - 'audit/llvm-ir-ssa-store-census-*'
      - 'audit/llvm-store-live-readback-and-ci-*'
      - 'audit/llvm-source-physical-fieldwrite-link-*'
      - 'audit/llvm-restore-witness-to-store-*'
      - 'audit/llvm-source-restoration-cfg-dom-v1-*'
      - 'audit/llvm-source-cfg-50-guests-and-regressions-*'
      - 'audit/llvm-cfg-guest-oracle-hardening-*'
      - 'audit/llvm-node22-source-cfg-oracle-receipts-*'
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipChecker.cpp'
      - 'src/main/cpp/oreslang/types/NativeOwnershipPlace.hpp'
      - 'tests/native_share_place_authority_test.cpp'
      - 'tests/native_share_projection_root_test.cpp'
      - 'tests/native_compiler_place_origin_test.cpp'
      - 'tests/native_ownership_identity_inventory_30_test.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipCfg.hpp'
      - 'src/main/cpp/oreslang/types/OwnershipLastUse.hpp'
      - 'tests/native_ownership_nll_partial_move_30_test.cpp'
      - 'tests/native_ownership_nll_closed_world_16_test.cpp'
      - 'tests/native_ownership_derived_last_use_12_test.cpp'
      - 'tests/native_ownership_opaque_loan_metadata_10_test.cpp'
      - 'tests/native_ownership_loan_write_domain_6_test.cpp'
      - 'tests/native_ownership_mir_receipts_30_test.cpp'
      - 'tests/native_ownership_mir_opaque_effects_18_test.cpp'
      - 'tests/native_ir_ssa_store_census_30_test.cpp'
      - 'tests/native_ir_store_live_readback_14_test.cpp'
      - 'tests/native_source_field_write_link_26_test.cpp'
      - 'tests/native_reinitialize_store_witness_48_test.cpp'
      - 'tests/native_source_field_cfg_96_test.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipSourceFieldFlow.hpp'
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'scripts/ownership-ci-workflow-shape.mjs'
      - 'tests/ownership_ci_workflow_shape_53.test.mjs'
      - 'bin/check-ownership-workflow-shape.mjs'
      - 'src/main/cpp/oreslang/backend/NativeIrOwnershipCensus.hpp'
      - 'src/main/cpp/oreslang/backend/NativeSourceFieldWriteLinks.hpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipMirEvidence.hpp'
      - 'tests/contracts/atto_ownership_place_mir_50.json'
      - 'tests/contracts/atto_ownership_source_cfg_50.json'
      - 'tests/ownership_source_cfg_node_oracles_50.test.mjs'
      - 'tests/ownership_source_cfg_compiler_matrix.py'
      - 'tests/test_ownership_source_cfg_compiler_matrix.py'
      - 'tests/ownership_compiler_fixture_matrix.py'
      - 'tests/test_ownership_compiler_fixture_matrix.py'
      - 'src/main/cpp/oreslang/types/NativeOwnershipJoin.hpp'
      - 'tests/native_ownership_join_test.cpp'
      - 'src/main/cpp/oreslang/types/NativeOwnershipPlace.hpp'
      - 'tests/native_ownership_place_test.cpp'
      - 'tests/fixtures/atto-*.atto'
      - 'CMakeLists.txt'
      - '.github/workflows/atto-critical-ownership-llvm-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llvm-native-critical-share:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind source to exact PR head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "ATTO_LLVM_EXACT_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_LLVM_EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
          # SOURCE_ONLY: static CI guard never authenticates native/guest work.
          node --check scripts/ownership-ci-workflow-shape.mjs
          node --check tests/ownership_ci_workflow_shape_53.test.mjs
          node --check bin/check-ownership-workflow-shape.mjs
          node --test --test-reporter=tap tests/ownership_ci_workflow_shape_53.test.mjs | tee /tmp/atto-ownership-workflow-shape.tap
          grep -Eq '^# tests 53$' /tmp/atto-ownership-workflow-shape.tap
          grep -Eq '^# pass 53$' /tmp/atto-ownership-workflow-shape.tap
          grep -Eq '^# fail 0$' /tmp/atto-ownership-workflow-shape.tap
          node bin/check-ownership-workflow-shape.mjs
          # Independent Node source-only oracle checks. These are not guests.
          node --check tests/ownership_source_cfg_node_oracles_50.test.mjs
          node --test --test-reporter=tap tests/ownership_source_cfg_node_oracles_50.test.mjs | tee /tmp/atto-source-cfg-node-50.tap
          grep -Eq '^# tests 50$' /tmp/atto-source-cfg-node-50.tap
          grep -Eq '^# pass 50$' /tmp/atto-source-cfg-node-50.tap
          grep -Eq '^# fail 0$' /tmp/atto-source-cfg-node-50.tap
      - name: Install Clang/LLVM developer toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev python3
          clang --version
          cmake --version
      - name: Build production LLVM compiler (not a mock)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2 --target oreslang-llvmc
          test -s build/oreslang-llvmc
          sha256sum build/oreslang-llvmc
      - name: Execute production ownership CFG join metadata gate
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 --target oreslang-native-ownership-join-test
          ctest --test-dir build -N -R '^native_ownership_affine_join_complete$' > /tmp/atto-ownership-join-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_affine_join_complete$' /tmp/atto-ownership-join-inventory.txt
          ctest --test-dir build -R '^native_ownership_affine_join_complete$' --output-on-failure --timeout 60 --output-junit /tmp/atto-ownership-join.xml
          test -s /tmp/atto-ownership-join.xml
          echo "ATTO_LLVM_JOIN_PROOF=HOST_CPP17_EXECUTED"

      - name: Execute seventeen source-owned place, identity and NLL integrity CTests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 2 --target oreslang-native-ownership-place-test oreslang-native-share-place-authority-test oreslang-native-share-projection-root-test oreslang-native-compiler-place-origin-test oreslang-native-ownership-identity-inventory-30-test oreslang-native-ownership-nll-partial-move-30-test oreslang-native-ownership-nll-closed-world-16-test oreslang-native-derived-last-use-12-test oreslang-native-ownership-opaque-loan-metadata-10-test oreslang-native-loan-write-domain-6-test oreslang-native-mir-receipts-30-test oreslang-native-mir-opaque-effects-18-test oreslang-native-ir-ssa-census-30-test oreslang-native-ir-store-live-readback-14-test oreslang-native-source-field-write-link-26-test oreslang-native-reinitialize-store-witness-48-test oreslang-native-source-field-cfg-96-test
          ctest --test-dir build -N -R '^native_ownership_(take_place_classification|share_place_authority|share_projection_root|compiler_resolved_place_origin|identity_inventory_30|nll_partial_move_30|nll_closed_world_16|derived_last_use_12|opaque_loan_metadata_10|loan_write_domain_6|mir_receipts_30|mir_opaque_effects_18|ir_ssa_store_census_30|ir_store_live_readback_14|source_field_write_link_26|reinitialize_store_witness_48|source_field_cfg_96)$' > /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_take_place_classification$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_share_place_authority$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_share_projection_root$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_compiler_resolved_place_origin$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_identity_inventory_30$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_nll_partial_move_30$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_nll_closed_world_16$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_derived_last_use_12$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_opaque_loan_metadata_10$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_loan_write_domain_6$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_mir_receipts_30$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_mir_opaque_effects_18$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_ir_ssa_store_census_30$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_ir_store_live_readback_14$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_source_field_write_link_26$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_reinitialize_store_witness_48$' /tmp/atto-place-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_source_field_cfg_96$' /tmp/atto-place-inventory.txt
          ctest --test-dir build -R '^native_ownership_(take_place_classification|share_place_authority|share_projection_root|compiler_resolved_place_origin|identity_inventory_30|nll_partial_move_30|nll_closed_world_16|derived_last_use_12|opaque_loan_metadata_10|loan_write_domain_6|mir_receipts_30|mir_opaque_effects_18|ir_ssa_store_census_30|ir_store_live_readback_14|source_field_write_link_26|reinitialize_store_witness_48|source_field_cfg_96)$' --output-on-failure --timeout 60 --output-junit /tmp/atto-ownership-place.xml
          test -s /tmp/atto-ownership-place.xml
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-ownership-place.xml').getroot()
          expected = {
              'native_ownership_take_place_classification',
              'native_ownership_share_place_authority',
              'native_ownership_share_projection_root',
              'native_ownership_compiler_resolved_place_origin',
              'native_ownership_identity_inventory_30',
              'native_ownership_nll_partial_move_30',
              'native_ownership_nll_closed_world_16',
              'native_ownership_derived_last_use_12',
              'native_ownership_opaque_loan_metadata_10',
              'native_ownership_loan_write_domain_6',
              'native_ownership_mir_receipts_30',
              'native_ownership_mir_opaque_effects_18',
              'native_ownership_ir_ssa_store_census_30',
              'native_ownership_ir_store_live_readback_14',
              'native_ownership_source_field_write_link_26',
              'native_ownership_reinitialize_store_witness_48',
              'native_ownership_source_field_cfg_96',
          }
          observed = [case.get('name') for case in root.iter('testcase')]
          if (int(root.get('tests', '-1')) != 17 or
                  int(root.get('failures', '1')) or
                  int(root.get('errors', '0')) or
                  int(root.get('skipped', '1')) or
                  len(observed) != 17 or len(set(observed)) != 17 or
                  set(observed) != expected):
              raise SystemExit(f'focused ownership CTest evidence mismatch: {observed!r}')
          PY
          echo "ATTO_LLVM_RESOLVED_PLACE_PROVENANCE=HOST_CPP17_EXECUTED"

      - name: Prove twenty scoped compiler CTest cases are registered
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build -N > /tmp/atto-parity-inventory.txt
          cat /tmp/atto-parity-inventory.txt
          for name in \
            atto_critical_suspends_fnc_rejected \
            atto_suspends_critical_routine_rejected \
            atto_critical_suspends_class_method_rejected \
            atto_suspends_critical_class_method_rejected \
            atto_critical_suspends_actor_method_rejected \
            atto_critical_suspends_comment_trivia_rejected \
            atto_suspends_critical_line_trivia_rejected \
            atto_critical_only_remains_unlowered \
            atto_suspends_only_remains_unlowered \
            atto_critical_read_remains_unlowered \
            atto_share_move_only_array_rejected \
            atto_share_move_only_class_rejected \
            atto_take_conditional_untracked_rejected \
            atto_take_computed_untracked_rejected \
            atto_share_borrowed_parameter_rejected \
            atto_share_borrowed_class_field_rejected \
            atto_protected_state_requires_typed_lowering \
            atto_copyable_share_native_execution \
            atto_copyable_copy_native_execution \
            atto_copyable_take_native_execution
          do
            grep -Eq "Test +#[0-9]+: ${name}$" /tmp/atto-parity-inventory.txt
          done
      - name: Require compiler diagnostics and Clang-linked native guest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build \
            -R '^(atto_critical_suspends_fnc_rejected|atto_suspends_critical_routine_rejected|atto_critical_suspends_class_method_rejected|atto_suspends_critical_class_method_rejected|atto_critical_suspends_actor_method_rejected|atto_critical_suspends_comment_trivia_rejected|atto_suspends_critical_line_trivia_rejected|atto_critical_only_remains_unlowered|atto_suspends_only_remains_unlowered|atto_critical_read_remains_unlowered|atto_share_move_only_array_rejected|atto_share_move_only_class_rejected|atto_take_conditional_untracked_rejected|atto_take_computed_untracked_rejected|atto_share_borrowed_parameter_rejected|atto_share_borrowed_class_field_rejected|atto_protected_state_requires_typed_lowering|atto_copyable_share_native_execution|atto_copyable_copy_native_execution|atto_copyable_take_native_execution)$' \
            --output-on-failure --timeout 180 --output-junit /tmp/atto-llvm-parity.xml
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-llvm-parity.xml').getroot()
          tests = int(root.get('tests', '0'))
          failures = int(root.get('failures', '0'))
          skipped = int(root.get('skipped', '0'))
          if tests != 20 or failures or skipped:
              raise SystemExit(f'LLVM CTest evidence invalid: {tests=} {failures=} {skipped=}')
          names = {x.get('name') for x in root.iter('testcase')}
          if len(names) != 20:
              raise SystemExit(f'LLVM distinct CTest cases invalid: {names=}')
          print('ATTO_LLVM_PARITY_SCOPED=PASS executed_ctests=20')
          print('ATTO_LLVM_PROTECTED_OBJECT_MIR=NOT_IMPLEMENTED')
          print('ATTO_LLVM_LRU_FULL_FIXTURES=NOT_EXECUTED')
          PY
      - name: Execute 100 real compiler fixtures in two matrices and fail-closed mutations
        shell: bash
        run: |
          set -euo pipefail
          # Both tests must have been registered at CMake configure time.
          ctest --test-dir build -N -R '^(native_ownership_place_mir_manifest_19_mutations|atto_ownership_place_mir_real_compiler_50)$' > /tmp/atto-mir-fixture-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_place_mir_manifest_19_mutations$' /tmp/atto-mir-fixture-inventory.txt
          grep -Eq 'Test +#[0-9]+: atto_ownership_place_mir_real_compiler_50$' /tmp/atto-mir-fixture-inventory.txt
          # The manifest unit suite cannot replace compiler execution.
          ctest --test-dir build -V -R '^native_ownership_place_mir_manifest_19_mutations$' --timeout 90
          ctest --test-dir build -V -R '^atto_ownership_place_mir_real_compiler_50$' \
            --output-junit /tmp/atto-real-compiler-50.xml --timeout 1000 | tee /tmp/atto-real-compiler-50.log
          grep -Fq 'ATTO_OWNERSHIP_REAL_COMPILER_FIXTURES=50/50_EXECUTED' /tmp/atto-real-compiler-50.log
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-real-compiler-50.xml').getroot()
          tests = int(root.get('tests', '-1'))
          failures = int(root.get('failures', '1'))
          skipped = int(root.get('skipped', '1'))
          if tests != 1 or failures or skipped:
              raise SystemExit(f'50-compiler fixture CTest invalid: {tests=} {failures=} {skipped=}')
          print('ATTO_LLVM_MIR_PLACE_SOURCE_COMPILER=REAL_50_CASES_EXECUTED')
          PY
          # Independently execute 50 *new* class-field CFG programs. Static
          # manifests and source-only checks cannot substitute for a compiler,
          # Clang linker, and the positive guest exit / negative diagnostic.
          ctest --test-dir build -N -R '^(native_ownership_source_cfg_manifest_29_mutations|atto_ownership_source_cfg_real_compiler_50)$' > /tmp/atto-source-cfg-fixture-inventory.txt
          grep -Eq 'Test +#[0-9]+: native_ownership_source_cfg_manifest_29_mutations$' /tmp/atto-source-cfg-fixture-inventory.txt
          grep -Eq 'Test +#[0-9]+: atto_ownership_source_cfg_real_compiler_50$' /tmp/atto-source-cfg-fixture-inventory.txt
          ctest --test-dir build -V -R '^native_ownership_source_cfg_manifest_29_mutations$' \
            --output-junit /tmp/atto-source-cfg-mut-29.xml --timeout 90 | tee /tmp/atto-source-cfg-mut-29.log
          grep -Eq 'Ran 29 tests' /tmp/atto-source-cfg-mut-29.log
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-source-cfg-mut-29.xml').getroot()
          observed = [x.get('name') for x in root.iter('testcase')]
          if (int(root.get('tests', '-1')) != 1 or
                  int(root.get('failures', '1')) or
                  int(root.get('errors', '1')) or
                  int(root.get('skipped', '1')) or
                  observed != ['native_ownership_source_cfg_manifest_29_mutations']):
              raise SystemExit('source CFG manifest mutation suite receipt invalid')
          PY
          ctest --test-dir build -V -R '^atto_ownership_source_cfg_real_compiler_50$' \
            --output-junit /tmp/atto-source-cfg-50.xml --timeout 1100 | tee /tmp/atto-source-cfg-50.log
          grep -Fq 'ATTO_SOURCE_CFG_REAL_COMPILER_FIXTURES=50/50_EXECUTED' /tmp/atto-source-cfg-50.log
          python3 - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('/tmp/atto-source-cfg-50.xml').getroot()
          observed = [x.get('name') for x in root.iter('testcase')]
          if (int(root.get('tests', '-1')) != 1 or
                  int(root.get('failures', '1')) or
                  int(root.get('errors', '1')) or
                  int(root.get('skipped', '1')) or
                  observed != ['atto_ownership_source_cfg_real_compiler_50']):
              raise SystemExit('source CFG real compiler fixture receipts invalid')
          print('ATTO_LLVM_SOURCE_CFG_GUEST=50/50_REAL_COMPILER_EXECUTED')
          PY

      - name: Reverify checkout head and clean tracked source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          echo "ATTO_LLVM_FINAL_HEAD=$(git rev-parse HEAD)"
          echo "ATTO_LLVM_FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
