name: Experimental HIR v1 Source Exporter

on:
  push:
    paths:
      - "src/main/cpp/oreslang/frontend/ExperimentalHirV1.hpp"
      - "src/main/cpp/oreslang/main.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.hpp"
      - "src/main/cpp/oreslang/backend/CheckedI64Admission.hpp"
      - "tests/checked_i64_admission_test.cpp"
      - "tests/experimental_hir_v1_exporter_test.cpp"
      - "tests/experimental_hir_v1_codegen_checked_rejection_test.cpp"
      - "tests/experimental_hir_v1_checked_range_property_test.cpp"
      - "tests/checked_i64_failure_status_test.cpp"
      - "src/main/cpp/oreslang/runtime/CheckedI64Failure.hpp"
      - "docs/EXPERIMENTAL_HIR_V1_FRONTEND.md"
      - ".github/workflows/experimental-hir-v1-exporter.yml"
  pull_request:
    paths:
      - "src/main/cpp/oreslang/frontend/ExperimentalHirV1.hpp"
      - "src/main/cpp/oreslang/main.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.hpp"
      - "src/main/cpp/oreslang/backend/CheckedI64Admission.hpp"
      - "tests/checked_i64_admission_test.cpp"
      - "tests/experimental_hir_v1_exporter_test.cpp"
      - "tests/experimental_hir_v1_codegen_checked_rejection_test.cpp"
      - "tests/experimental_hir_v1_checked_range_property_test.cpp"
      - "tests/checked_i64_failure_status_test.cpp"
      - "src/main/cpp/oreslang/runtime/CheckedI64Failure.hpp"
      - "docs/EXPERIMENTAL_HIR_V1_FRONTEND.md"
      - ".github/workflows/experimental-hir-v1-exporter.yml"

permissions:
  contents: read

jobs:
  header-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile header-only exporter (no LLVM libraries)
        run: |
          c++ -std=c++20 -Wall -Wextra -Isrc/main/cpp tests/experimental_hir_v1_exporter_test.cpp -o "$RUNNER_TEMP/experimental-hir-v1-test"
      - name: Reject invalid AST and validate emitted document
        run: |
          "$RUNNER_TEMP/experimental-hir-v1-test" > "$RUNNER_TEMP/experimental-hir-v1.json"
          python3 -m json.tool "$RUNNER_TEMP/experimental-hir-v1.json" >/dev/null
          python3 - "$RUNNER_TEMP/experimental-hir-v1.json" <<'PY'
          import json, pathlib, sys
          doc = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert doc["ir_family"] == "ores-hir"
          assert doc["schema_version"] == "1.0.0-experimental"
          assert doc["module_id"] == "source"
          assert [f["name"] for f in doc["functions"]] == ["counter_response", "main"]
          assert doc["functions"][0]["body"] == {"kind": "var", "name": "count"}
          assert doc["functions"][1]["body"]["kind"] == "call"
          assert doc["functions"][1]["body"]["function"] == "counter_response"
          PY
      - name: Verify checked-i64 source admission without LLVM libraries
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc/main/cpp \
            tests/checked_i64_admission_test.cpp -o "$RUNNER_TEMP/checked-i64-admission"
          "$RUNNER_TEMP/checked-i64-admission"
      - name: Verify signed-i64 range arithmetic against widened mathematical oracle
        run: |
          c++ -std=c++20 -Wall -Wextra -Isrc/main/cpp tests/experimental_hir_v1_checked_range_property_test.cpp -o "$RUNNER_TEMP/checked-range-property"
          "$RUNNER_TEMP/checked-range-property"

  checked-native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate an LLVM compiler toolchain
        run: |
          set -euo pipefail
          for major in 19 18 17 16; do
            if command -v "llvm-config-$major" >/dev/null; then
              echo "LLVM_CONFIG=$(command -v llvm-config-$major)" >> "$GITHUB_ENV"
              echo "CLANG=$(command -v clang-$major || command -v clang)" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev clang-19
          echo "LLVM_CONFIG=/usr/bin/llvm-config-19" >> "$GITHUB_ENV"
          echo "CLANG=/usr/bin/clang-19" >> "$GITHUB_ENV"
      - name: Compile and run checked-mode fail-closed regression
        run: |
          set -euo pipefail
          c++ $("$LLVM_CONFIG" --cxxflags) -std=c++20 -fexceptions -O0 \
            -Isrc/main/cpp \
            tests/experimental_hir_v1_codegen_checked_rejection_test.cpp \
            src/main/cpp/oreslang/frontend/Parser.cpp \
            src/main/cpp/oreslang/types/OwnershipChecker.cpp \
            src/main/cpp/oreslang/backend/LlvmCodegen.cpp \
            src/main/cpp/oreslang/backend/ScalarLoopLowering.cpp \
            -o "$RUNNER_TEMP/checked-codegen-guard" \
            $("$LLVM_CONFIG" --ldflags --libs core support --system-libs)
          "$RUNNER_TEMP/checked-codegen-guard"
      - name: Compile real LLVM compiler and execute checked guest boundary cases
        run: |
          set -euo pipefail
          c++ $("$LLVM_CONFIG" --cxxflags) -std=c++20 -fexceptions -O0 \
            -Isrc/main/cpp \
            src/main/cpp/oreslang/main.cpp \
            src/main/cpp/oreslang/frontend/Parser.cpp \
            src/main/cpp/oreslang/types/OwnershipChecker.cpp \
            src/main/cpp/oreslang/backend/LlvmCodegen.cpp \
            src/main/cpp/oreslang/backend/ScalarLoopLowering.cpp \
            -o "$RUNNER_TEMP/oreslang-llvmc" \
            $("$LLVM_CONFIG" --ldflags --libs core support --system-libs)
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc scale(int count): int { return count * 43; }' \
            'pub fnc main(): int { return scale(1); }' > "$RUNNER_TEMP/checked-ok.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-ok.ores" > "$RUNNER_TEMP/checked-ok.ll"
          "$CLANG" -Wno-override-module -x ir "$RUNNER_TEMP/checked-ok.ll" -o "$RUNNER_TEMP/checked-ok"
          set +e
          "$RUNNER_TEMP/checked-ok"
          ok=$?
          set -e
          test "$ok" -eq 43
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc main(): int { return 9223372036854775807 + 1; }' > "$RUNNER_TEMP/checked-overflow.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-overflow.ores" > "$RUNNER_TEMP/checked-overflow.ll"
          "$CLANG" -Wno-override-module -x ir "$RUNNER_TEMP/checked-overflow.ll" -o "$RUNNER_TEMP/checked-overflow"
          set +e
          "$RUNNER_TEMP/checked-overflow" > "$RUNNER_TEMP/checked-overflow.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 86
          grep -Fxq ORES_I64_OVERFLOW "$RUNNER_TEMP/checked-overflow.log"
      - name: Validate nested checked effects at O0 and O2
        run: |
          set -euo pipefail
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc explode(int x): int { return x * 2; }' \
            'pub fnc forward(int x): int { return explode(x); }' \
            'pub fnc main(): int { return forward(9223372036854775807) * 0; }' \
            > "$RUNNER_TEMP/checked-nested-overflow.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-nested-overflow.ores" \
            > "$RUNNER_TEMP/checked-nested-overflow.ll"
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc explode(int x): int { return x * 2; }' \
            'pub fnc forward(int x): int { return explode(x); }' \
            'pub fnc main(): int { return forward(0) * 0 + 43; }' \
            > "$RUNNER_TEMP/checked-nested-safe.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-nested-safe.ores" \
            > "$RUNNER_TEMP/checked-nested-safe.ll"
          for opt in 0 2; do
            for name in checked-nested-overflow checked-nested-safe; do
              "$CLANG" -O"$opt" -Wno-override-module -x ir \
                "$RUNNER_TEMP/$name.ll" -o "$RUNNER_TEMP/$name-O$opt"
            done
            set +e
            "$RUNNER_TEMP/checked-nested-overflow-O$opt" > "$RUNNER_TEMP/overflow-O$opt.log" 2>&1
            bad=$?
            "$RUNNER_TEMP/checked-nested-safe-O$opt" > "$RUNNER_TEMP/safe-O$opt.log" 2>&1
            good=$?
            set -e
            test "$bad" -eq 86
            test "$good" -eq 43
            grep -Fxq ORES_I64_OVERFLOW "$RUNNER_TEMP/overflow-O$opt.log"
            test ! -s "$RUNNER_TEMP/safe-O$opt.log"
          done
      - name: Execute invocation-local checked Throw across C ABI and nested calls
        run: |
          set -euo pipefail
          # No guest main: the C harness is the OS host and must regain control.
          # Checked guest arithmetic must NEVER call exit() directly.
          cat > "$RUNNER_TEMP/checked-effect.ores" <<'ORES'
          // oreslang:checked-i64-v1
          pub fnc scale(int count): int { return count * 43; }
          pub fnc outer(int count): int { return scale(count) + 1; }
          pub fnc intermediate(int count): int { return (count * 43) * 0; }
          ORES
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-effect.ores" \
            > "$RUNNER_TEMP/checked-effect.ll"
          "$CLANG" -Wno-override-module -c -x ir "$RUNNER_TEMP/checked-effect.ll" \
            -o "$RUNNER_TEMP/checked-effect.o"
          cat > "$RUNNER_TEMP/checked-effect.c" <<'C'
          #include <stdint.h>
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          extern int64_t scale(int64_t, uint32_t *);
          extern int64_t outer(int64_t, uint32_t *);
          extern int64_t intermediate(int64_t, uint32_t *);
          static void expect(int value, const char *name) {
              if (!value) { fprintf(stderr, "effect ABI failed: %s\n", name); exit(1); }
          }
          int main(void) {
              uint32_t status = 0;
              expect(scale(1, &status) == 43 && status == 0, "scale success");
              status = 0;
              expect(scale(INT64_MAX, &status) == 0 && status == 0x494F0001u,
                     "scale overflow returns typed effect");
              status = 0;
              expect(outer(INT64_MAX, &status) == 0 && status == 0x494F0001u,
                     "nested call propagates typed effect");
              status = 0;
              expect(outer(1, &status) == 44 && status == 0,
                     "nested call success after error isolation");
              status = 0;
              expect(intermediate(INT64_MAX, &status) == 0 && status == 0x494F0001u,
                     "intermediate overflow cannot be optimized away");
              status = 0;
              expect(intermediate(1, &status) == 0 && status == 0,
                     "in-range intermediate product");
              return 0;
          }
          C
          "$CLANG" -std=c11 -Wall -Wextra -Werror \
            "$RUNNER_TEMP/checked-effect.c" "$RUNNER_TEMP/checked-effect.o" \
            -o "$RUNNER_TEMP/checked-effect"
          "$RUNNER_TEMP/checked-effect"
      - name: Compile and execute typed checked-i64 error ABI
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc/main/cpp tests/checked_i64_failure_status_test.cpp -o "$RUNNER_TEMP/checked-i64-abi"
          "$RUNNER_TEMP/checked-i64-abi"
