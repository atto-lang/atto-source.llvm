name: Experimental HIR v1 Source Exporter

on:
  push:
    paths:
      - "src/main/cpp/oreslang/frontend/ExperimentalHirV1.hpp"
      - "src/main/cpp/oreslang/main.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.hpp"
      - "src/main/cpp/oreslang/backend/CheckedI64Admission.hpp"
      - "tests/checked_i64_admission_test.cpp"
      - "tests/experimental_hir_v1_exporter_test.cpp"
      - "tests/experimental_hir_v1_codegen_checked_rejection_test.cpp"
      - "tests/experimental_hir_v1_checked_range_property_test.cpp"
      - "tests/checked_i64_failure_status_test.cpp"
      - "src/main/cpp/oreslang/runtime/CheckedI64Failure.hpp"
      - "src/main/cpp/oreslang/runtime/EffectUnwind.hpp"
      - "docs/EXPERIMENTAL_HIR_V1_FRONTEND.md"
      - ".github/workflows/experimental-hir-v1-exporter.yml"
  pull_request:
    paths:
      - "src/main/cpp/oreslang/frontend/ExperimentalHirV1.hpp"
      - "src/main/cpp/oreslang/main.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.cpp"
      - "src/main/cpp/oreslang/backend/LlvmCodegen.hpp"
      - "src/main/cpp/oreslang/backend/CheckedI64Admission.hpp"
      - "tests/checked_i64_admission_test.cpp"
      - "tests/experimental_hir_v1_exporter_test.cpp"
      - "tests/experimental_hir_v1_codegen_checked_rejection_test.cpp"
      - "tests/experimental_hir_v1_checked_range_property_test.cpp"
      - "tests/checked_i64_failure_status_test.cpp"
      - "src/main/cpp/oreslang/runtime/CheckedI64Failure.hpp"
      - "src/main/cpp/oreslang/runtime/EffectUnwind.hpp"
      - "docs/EXPERIMENTAL_HIR_V1_FRONTEND.md"
      - ".github/workflows/experimental-hir-v1-exporter.yml"

permissions:
  contents: read

jobs:
  header-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified HIR source revision: $EXPECTED_SHA"
      - name: Compile header-only exporter (no LLVM libraries)
        run: |
          c++ -std=c++20 -Wall -Wextra -Isrc/main/cpp tests/experimental_hir_v1_exporter_test.cpp -o "$RUNNER_TEMP/experimental-hir-v1-test"
      - name: Reject invalid AST and validate emitted document
        run: |
          "$RUNNER_TEMP/experimental-hir-v1-test" > "$RUNNER_TEMP/experimental-hir-v1.json"
          python3 -m json.tool "$RUNNER_TEMP/experimental-hir-v1.json" >/dev/null
          python3 - "$RUNNER_TEMP/experimental-hir-v1.json" <<'PY'
          import json, pathlib, sys
          doc = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert doc["ir_family"] == "ores-hir"
          assert doc["schema_version"] == "1.0.0-experimental"
          assert doc["module_id"] == "source"
          assert [f["name"] for f in doc["functions"]] == ["counter_response", "main"]
          assert doc["functions"][0]["body"] == {"kind": "var", "name": "count"}
          assert doc["functions"][1]["body"]["kind"] == "call"
          assert doc["functions"][1]["body"]["function"] == "counter_response"
          PY
      - name: Verify checked-i64 source admission without LLVM libraries
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc/main/cpp \
            tests/checked_i64_admission_test.cpp -o "$RUNNER_TEMP/checked-i64-admission"
          "$RUNNER_TEMP/checked-i64-admission"
      - name: Verify packed checked-i64 status under both native compilers
        run: |
          set -euo pipefail
          for cc in g++ clang++; do
            "$cc" -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
              -Isrc/main/cpp tests/checked_i64_failure_status_test.cpp \
              -o "$RUNNER_TEMP/checked-packed-status-${cc}"
            "$RUNNER_TEMP/checked-packed-status-${cc}"
          done
      - name: Verify signed-i64 range arithmetic against widened mathematical oracle
        run: |
          c++ -std=c++20 -Wall -Wextra -Isrc/main/cpp tests/experimental_hir_v1_checked_range_property_test.cpp -o "$RUNNER_TEMP/checked-range-property"
          "$RUNNER_TEMP/checked-range-property"

  checked-native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Verified LLVM source revision: $EXPECTED_SHA"
      - name: Locate an LLVM compiler toolchain
        run: |
          set -euo pipefail
          for major in 19 18 17 16; do
            if command -v "llvm-config-$major" >/dev/null; then
              echo "LLVM_CONFIG=$(command -v llvm-config-$major)" >> "$GITHUB_ENV"
              echo "CLANG=$(command -v clang-$major || command -v clang)" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-19-dev clang-19
          echo "LLVM_CONFIG=/usr/bin/llvm-config-19" >> "$GITHUB_ENV"
          echo "CLANG=/usr/bin/clang-19" >> "$GITHUB_ENV"
      - name: Compile and run checked-mode fail-closed regression
        run: |
          set -euo pipefail
          c++ $("$LLVM_CONFIG" --cxxflags) -std=c++20 -fexceptions -O0 \
            -Isrc/main/cpp \
            tests/experimental_hir_v1_codegen_checked_rejection_test.cpp \
            src/main/cpp/oreslang/frontend/Parser.cpp \
            src/main/cpp/oreslang/types/OwnershipChecker.cpp \
            src/main/cpp/oreslang/backend/LlvmCodegen.cpp \
            src/main/cpp/oreslang/backend/ScalarLoopLowering.cpp \
            -o "$RUNNER_TEMP/checked-codegen-guard" \
            $("$LLVM_CONFIG" --ldflags --libs core support --system-libs)
          "$RUNNER_TEMP/checked-codegen-guard"
      - name: Compile real LLVM compiler and execute checked guest boundary cases
        run: |
          set -euo pipefail
          c++ $("$LLVM_CONFIG" --cxxflags) -std=c++20 -fexceptions -O0 \
            -Isrc/main/cpp \
            src/main/cpp/oreslang/main.cpp \
            src/main/cpp/oreslang/frontend/Parser.cpp \
            src/main/cpp/oreslang/types/OwnershipChecker.cpp \
            src/main/cpp/oreslang/backend/LlvmCodegen.cpp \
            src/main/cpp/oreslang/backend/ScalarLoopLowering.cpp \
            -o "$RUNNER_TEMP/oreslang-llvmc" \
            $("$LLVM_CONFIG" --ldflags --libs core support --system-libs)
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc scale(int count): int { return count * 43; }' \
            'pub fnc main(): int { return scale(1); }' > "$RUNNER_TEMP/checked-ok.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-ok.ores" > "$RUNNER_TEMP/checked-ok.ll"
          "$CLANG" -Wno-override-module -x ir "$RUNNER_TEMP/checked-ok.ll" -o "$RUNNER_TEMP/checked-ok"
          set +e
          "$RUNNER_TEMP/checked-ok"
          ok=$?
          set -e
          test "$ok" -eq 43
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc main(): int { return 9223372036854775807 + 1; }' > "$RUNNER_TEMP/checked-overflow.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-overflow.ores" > "$RUNNER_TEMP/checked-overflow.ll"
          "$CLANG" -Wno-override-module -x ir "$RUNNER_TEMP/checked-overflow.ll" -o "$RUNNER_TEMP/checked-overflow"
          set +e
          "$RUNNER_TEMP/checked-overflow" > "$RUNNER_TEMP/checked-overflow.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 86
          grep -Fxq ORES_I64_OVERFLOW "$RUNNER_TEMP/checked-overflow.log"
      - name: Validate nested checked effects at O0 and O2
        run: |
          set -euo pipefail
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc explode(int x): int { return x * 2; }' \
            'pub fnc forward(int x): int { return explode(x); }' \
            'pub fnc main(): int { return forward(9223372036854775807) * 0; }' \
            > "$RUNNER_TEMP/checked-nested-overflow.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-nested-overflow.ores" \
            > "$RUNNER_TEMP/checked-nested-overflow.ll"
          printf '%s\n' '// oreslang:checked-i64-v1' \
            'pub fnc explode(int x): int { return x * 2; }' \
            'pub fnc forward(int x): int { return explode(x); }' \
            'pub fnc main(): int { return forward(0) * 0 + 43; }' \
            > "$RUNNER_TEMP/checked-nested-safe.ores"
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-nested-safe.ores" \
            > "$RUNNER_TEMP/checked-nested-safe.ll"
          for opt in 0 2; do
            for name in checked-nested-overflow checked-nested-safe; do
              "$CLANG" -O"$opt" -Wno-override-module -x ir \
                "$RUNNER_TEMP/$name.ll" -o "$RUNNER_TEMP/$name-O$opt"
            done
            set +e
            "$RUNNER_TEMP/checked-nested-overflow-O$opt" > "$RUNNER_TEMP/overflow-O$opt.log" 2>&1
            bad=$?
            "$RUNNER_TEMP/checked-nested-safe-O$opt" > "$RUNNER_TEMP/safe-O$opt.log" 2>&1
            good=$?
            set -e
            test "$bad" -eq 86
            test "$good" -eq 43
            grep -Fxq ORES_I64_OVERFLOW "$RUNNER_TEMP/overflow-O$opt.log"
            test ! -s "$RUNNER_TEMP/safe-O$opt.log"
          done
      - name: Execute nested operand and argument short-circuit at O0 O2 O3
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/checked-argument-overflow.ores" <<'ORES'
          // oreslang:checked-i64-v1
          pub fnc scale(int x): int { return x * 43; }
          pub fnc combine(int a, int b): int { return a + b; }
          pub fnc main(): int { return combine(scale(9223372036854775807), scale(1)); }
          ORES
          cat > "$RUNNER_TEMP/checked-operand-overflow.ores" <<'ORES'
          // oreslang:checked-i64-v1
          pub fnc scale(int x): int { return x * 43; }
          pub fnc main(): int { return scale(9223372036854775807) + scale(1); }
          ORES
          cat > "$RUNNER_TEMP/checked-argument-safe.ores" <<'ORES'
          // oreslang:checked-i64-v1
          pub fnc scale(int x): int { return x * 43; }
          pub fnc combine(int a, int b): int { return a + b; }
          pub fnc main(): int { return combine(scale(0), scale(1)); }
          ORES
          for name in checked-argument-overflow checked-operand-overflow checked-argument-safe; do
            "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/$name.ores" > "$RUNNER_TEMP/$name.ll"
          done
          grep -q 'checked.argument.propagate' "$RUNNER_TEMP/checked-argument-overflow.ll"
          grep -q 'checked.operand.propagate' "$RUNNER_TEMP/checked-operand-overflow.ll"
          for opt in 0 2 3; do
            for name in checked-argument-overflow checked-operand-overflow checked-argument-safe; do
              "$CLANG" -O"$opt" -Wno-override-module -x ir "$RUNNER_TEMP/$name.ll" \
                -o "$RUNNER_TEMP/$name-O$opt"
              set +e
              "$RUNNER_TEMP/$name-O$opt" > "$RUNNER_TEMP/$name-O$opt.log" 2>&1
              status=$?
              set -e
              case "$name" in
                checked-argument-safe)
                  test "$status" -eq 43
                  test ! -s "$RUNNER_TEMP/$name-O$opt.log"
                  ;;
                *)
                  test "$status" -eq 86
                  grep -Fxq ORES_I64_OVERFLOW "$RUNNER_TEMP/$name-O$opt.log"
                  ;;
              esac
            done
          done
      - name: Execute invocation-local checked Throw across C ABI and nested calls
        run: |
          set -euo pipefail
          # The checked source profile requires guest main. Rename ONLY the
          # generated OS entry symbol in this test object so the independent C
          # host can call guest functions and verify their status ABI.
          # Checked guest arithmetic must NEVER call exit() directly.
          cat > "$RUNNER_TEMP/checked-effect.ores" <<'ORES'
          // oreslang:checked-i64-v1
          pub fnc scale(int count): int { return count * 43; }
          pub fnc outer(int count): int { return scale(count) + 1; }
          pub fnc intermediate(int count): int { return (count * 43) * 0; }
          pub fnc plusone(int count): int { return count + 1; }
          pub fnc minuszero(int count): int { return 0 - count; }
          pub fnc negate(int count): int { return -count; }
          pub fnc main(): int { return outer(1); }
          ORES
          "$RUNNER_TEMP/oreslang-llvmc" "$RUNNER_TEMP/checked-effect.ores" \
            > "$RUNNER_TEMP/checked-effect.ll"
          "$CLANG" -Wno-override-module -c -x ir "$RUNNER_TEMP/checked-effect.ll" \
            -o "$RUNNER_TEMP/checked-effect.o"
          command -v objcopy
          # The emitted guest source contains a normal OS main wrapper.
          # Rename it only in this disposable object to avoid two C mains.
          objcopy --redefine-sym main=oreslang_guest_entry_unused \
            "$RUNNER_TEMP/checked-effect.o"
          cat > "$RUNNER_TEMP/checked-effect.c" <<'C'
          #include <stdint.h>
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #define PACKED_ADD UINT64_C(0x1494F0001)
          #define PACKED_SUB UINT64_C(0x2494F0001)
          #define PACKED_MUL UINT64_C(0x3494F0001)
          #define PACKED_NEG UINT64_C(0x4494F0001)
          extern int64_t scale(int64_t, uint64_t *);
          extern int64_t outer(int64_t, uint64_t *);
          extern int64_t intermediate(int64_t, uint64_t *);
          extern int64_t plusone(int64_t, uint64_t *);
          extern int64_t minuszero(int64_t, uint64_t *);
          extern int64_t negate(int64_t, uint64_t *);
          static void expect(int value, const char *name) {
              if (!value) { fprintf(stderr, "effect ABI failed: %s\n", name); exit(1); }
          }
          // Arithmetic oracle independent of LLVM lowering. Return only a
          // scalar and a caller-owned status code; never share status across calls.
          static void check_i64_oracle(int64_t input) {
              const __int128 product = (__int128)input * 43;
              const __int128 next = product + 1;
              const int mul_overflow = product > INT64_MAX || product < INT64_MIN;
              const int add_overflow = mul_overflow || next > INT64_MAX || next < INT64_MIN;
              uint64_t status = 0;
              int64_t actual = scale(input, &status);
              expect(mul_overflow
                  ? actual == 0 && status == PACKED_MUL
                  : actual == (int64_t)product && status == 0, "scale oracle");
              status = 0;
              actual = outer(input, &status);
              expect(add_overflow
                  ? actual == 0 && status == (mul_overflow ? PACKED_MUL : PACKED_ADD)
                  : actual == (int64_t)next && status == 0, "nested oracle");
          }
          int main(void) {
              uint64_t status = PACKED_MUL;
              expect(scale(1, &status) == 0 && status == PACKED_MUL,
                     "stale checked Throw prevents guest execution");
              status = UINT64_MAX;
              expect(outer(1, &status) == 0 && status == UINT64_MAX,
                     "unknown pending effect is not overwritten");
              status = 0;
              expect(scale(1, &status) == 43 && status == 0, "scale success");
              // ABI storage is exactly one uint64_t. A neighboring canary
              // detects an accidental wider write in future codegen changes.
              struct { uint64_t status; uint64_t canary; } guarded = {
                  0, UINT64_C(0xD3A9F197A03B4C52)
              };
              expect(scale(INT64_MAX, &guarded.status) == 0 &&
                     guarded.status == PACKED_MUL &&
                     guarded.canary == UINT64_C(0xD3A9F197A03B4C52),
                     "packed status write must preserve neighboring host memory");
              status = 0;
              expect(scale(INT64_MAX, &status) == 0 && status == PACKED_MUL,
                     "scale overflow returns typed effect");
              status = 0;
              expect(scale(INT64_MIN, &status) == 0 && status == PACKED_MUL,
                     "negative overflow returns typed effect");
              status = 0;
              expect(scale(INT64_MAX / 43, &status) == (INT64_MAX / 43) * 43 &&
                     status == 0, "positive exact boundary remains legal");
              status = 0;
              expect(scale(INT64_MAX / 43 + 1, &status) == 0 &&
                     status == PACKED_MUL, "positive one-past boundary");
              status = 0;
              expect(scale(INT64_MIN / 43, &status) == (INT64_MIN / 43) * 43 &&
                     status == 0, "negative exact boundary remains legal");
              status = 0;
              expect(scale(INT64_MIN / 43 - 1, &status) == 0 &&
                     status == PACKED_MUL, "negative one-past boundary");
              status = 0;
              expect(outer(INT64_MAX, &status) == 0 && status == PACKED_MUL,
                     "nested call propagates typed effect");
              status = 0;
              expect(outer(1, &status) == 44 && status == 0,
                     "nested call success after error isolation");
              status = 0;
              expect(intermediate(INT64_MAX, &status) == 0 && status == PACKED_MUL,
                     "intermediate overflow cannot be optimized away");
              status = 0;
              expect(intermediate(1, &status) == 0 && status == 0,
                     "in-range intermediate product");
              status = 0;
              expect(plusone(INT64_MAX, &status) == 0 && status == PACKED_ADD,
                     "checked add overflow must retain add operation tag");
              status = 0;
              expect(minuszero(INT64_MIN, &status) == 0 && status == PACKED_SUB,
                     "checked subtraction retains subtract operation tag");
              status = 0;
              expect(negate(INT64_MIN, &status) == 0 && status == PACKED_NEG,
                     "checked unary minus retains negate tag, not subtract");
              status = 0;
              expect(plusone(42, &status) == 43 && status == 0,
                     "checked add success must not publish operation");
              status = 0;
              expect(minuszero(-43, &status) == 43 && status == 0,
                     "checked subtraction success remains in range");
              status = 0;
              expect(negate(-43, &status) == 43 && status == 0,
                     "checked negation success remains in range");
              const int64_t edges[] = {
                  0, 1, -1, INT64_MIN, INT64_MAX,
                  INT64_MIN / 43, INT64_MAX / 43,
                  INT64_MIN / 43 - 1, INT64_MAX / 43 + 1,
                  INT64_MIN / 43 + 1, INT64_MAX / 43 - 1
              };
              for (size_t i = 0; i < sizeof edges / sizeof *edges; ++i)
                  check_i64_oracle(edges[i]);
              uint64_t seed = UINT64_C(0x9e3779b97f4a7c15);
              for (int i = 0; i < 8192; ++i) {
                  seed ^= seed << 13;
                  seed ^= seed >> 7;
                  seed ^= seed << 17;
                  // Avoid implementation-defined out-of-range conversion of u64
                  // to i64: subtract a widened 2^63 before narrowing.
                  check_i64_oracle((int64_t)((__int128)seed -
                      ((__int128)1 << 63)));
              }
              return 0;
          }
          C
          "$CLANG" -std=c11 -Wall -Wextra -Werror \
            "$RUNNER_TEMP/checked-effect.c" "$RUNNER_TEMP/checked-effect.o" \
            -o "$RUNNER_TEMP/checked-effect"
          "$RUNNER_TEMP/checked-effect"
          # Optimization must not erase a checked Throw or change its status.
          for opt in 2 3; do
            "$CLANG" -O"$opt" -Wno-override-module -c -x ir \
              "$RUNNER_TEMP/checked-effect.ll" \
              -o "$RUNNER_TEMP/checked-effect-O$opt.o"
            objcopy --redefine-sym main=oreslang_guest_entry_unused \
              "$RUNNER_TEMP/checked-effect-O$opt.o"
            "$CLANG" -std=c11 -Wall -Wextra -Werror \
              "$RUNNER_TEMP/checked-effect.c" \
              "$RUNNER_TEMP/checked-effect-O$opt.o" \
              -o "$RUNNER_TEMP/checked-effect-O$opt"
            "$RUNNER_TEMP/checked-effect-O$opt"
          done
      - name: Compile and execute typed checked-i64 error ABI
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc/main/cpp tests/checked_i64_failure_status_test.cpp -o "$RUNNER_TEMP/checked-i64-abi"
          "$RUNNER_TEMP/checked-i64-abi"
