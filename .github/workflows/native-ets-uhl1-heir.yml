name: LLVM native ETS owner-death heir fencing (host-only)
on:
  pull_request:
    paths:
      - '.github/workflows/native-ets-uhl1-heir.yml'
      - 'src/main/cpp/oreslang/runtime/NativeEtsScalarSet.hpp'
      - 'tests/native_ets_uhl1_heir_handoff_test.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ets-heir:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check source/tree identities
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -n "$(git rev-parse HEAD^{tree})"
          git hash-object src/main/cpp/oreslang/runtime/NativeEtsScalarSet.hpp
          git hash-object tests/native_ets_uhl1_heir_handoff_test.cpp
      - name: GCC and Clang normal + ASan UBSan host tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ets-heir"
          for compiler in g++ clang++; do
            "$compiler" -std=c++17 -O2 -UNDEBUG -Wall -Wextra -Wpedantic -Werror \
              -pthread -Isrc/main/cpp tests/native_ets_uhl1_heir_handoff_test.cpp \
              -o "$RUNNER_TEMP/ets-heir/$compiler"
            "$RUNNER_TEMP/ets-heir/$compiler" \
              | tee "$RUNNER_TEMP/ets-heir/$compiler.log"
            grep -qx 'UHL1_NATIVE_ETS_HEIR_HOSTONLY_PASS=3001' "$RUNNER_TEMP/ets-heir/$compiler.log"
            "$compiler" -std=c++17 -O1 -g -UNDEBUG -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -Isrc/main/cpp \
              tests/native_ets_uhl1_heir_handoff_test.cpp \
              -o "$RUNNER_TEMP/ets-heir/$compiler-sanitized"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1 \
              "$RUNNER_TEMP/ets-heir/$compiler-sanitized" \
              | tee "$RUNNER_TEMP/ets-heir/$compiler-sanitized.log"
            grep -qx 'UHL1_NATIVE_ETS_HEIR_HOSTONLY_PASS=3001' \
              "$RUNNER_TEMP/ets-heir/$compiler-sanitized.log"
          done
      - name: Archive host-only receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: llvm-ets-uhl1-hostonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ets-heir/*.log
          if-no-files-found: error
          retention-days: 7
