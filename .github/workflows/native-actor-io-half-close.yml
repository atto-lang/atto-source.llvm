name: Native actor I/O half-close via Rust harness
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorIoEnvelope.hpp'
      - 'tests/native_actor_io_envelope_test.cpp'
      - 'tests/rust-harness/**'
      - '.github/workflows/native-actor-io-half-close.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-actor-io:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head and native test Git blobs
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse 'HEAD^{tree}'
          git hash-object src/main/cpp/oreslang/runtime/ActorIoEnvelope.hpp \
            tests/native_actor_io_envelope_test.cpp \
            tests/rust-harness/src/actor_io_half_close.rs
      - name: Rust test runner drives genuine C++ actor I/O at O0/O2
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo test --manifest-path tests/rust-harness/Cargo.toml \
            --bin oreslang-llvm-test-harness \
            actor_io_half_close::native_actor_io_half_close_executes_o0_o2 -- --nocapture
