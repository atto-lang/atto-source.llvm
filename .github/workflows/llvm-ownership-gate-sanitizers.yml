name: LLVM ownership gate sanitizers

on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/types/OwnershipChecker.cpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'tests/llvm_emission_ownership_gate_test.cpp'
      - 'src/main/cpp/oreslang/runtime/ActorOwnedGraphHeap.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorGraphSweepPlan.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorHeapRetirementProof.hpp'
      - 'tests/actor_owned_graph_heap_test.cpp'
      - 'tests/actor_graph_sweep_plan_test.cpp'
      - 'tests/actor_graph_sweep_heap_integration_test.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/llvm-ownership-gate-sanitizers.yml'
  push:
    branches: [hardening/ownership-cfg-suspension-fences-20261017]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-gate-asan-ubsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and tree
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          git rev-parse 'HEAD^{tree}'
      - name: Execute bounded cycle-sweep planner under sanitizers (host component)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src/main/cpp tests/actor_graph_sweep_plan_test.cpp \
            -o "$RUNNER_TEMP/actor-graph-sweep-plan-test"
          "$RUNNER_TEMP/actor-graph-sweep-plan-test"
      - name: Execute actual graph heap clone and sweep integration (native host)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src/main/cpp tests/actor_graph_sweep_heap_integration_test.cpp \
            -o "$RUNNER_TEMP/actor-graph-sweep-heap-integration-test"
          "$RUNNER_TEMP/actor-graph-sweep-heap-integration-test"
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake clang llvm-dev
      - name: Configure sanitized ownership gate
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=ON \
            -DCMAKE_C_FLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined' \
            -DCMAKE_CXX_FLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build direct-AST ownership gate and graph heap
        run: cmake --build build-sanitized --target oreslang-llvm-emission-ownership-gate-test oreslang-actor-graph-heap-test --parallel 2
      - name: Run direct-AST ownership and graph heap tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ctest --test-dir build-sanitized \
            -R '^(native_llvm_emission_checks_ownership_and_frame_layout|native_actor_owned_cyclic_graph_heap)$' \
            --output-on-failure --timeout 120
