name: StateGraph LLVM native guest admission
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  stategraph-llvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install native LLVM and Clang build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang llvm-dev
      - name: Build real Oreslang LLVM source compiler
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
      - name: Real LLVM canonical-if source CTest (not full StateGraph parity)
        run: |
          ctest --test-dir build --output-on-failure -R '^stategraph_canonical_then_native_guest        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/test-stategraph-native-llvm.sh

      - name: Compile and execute exact-head StateGraph scalar and canonical-source guests
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/test-stategraph-native-llvm.sh
