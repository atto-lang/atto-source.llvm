name: Native package-local namespace graph (source-only)
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/frontend/**'
      - 'CMakeLists.txt'
      - 'src/main/cpp/oreslang/frontend/PackageNamespaceGraph.hpp'
      - 'tests/native_package_namespace_graph_test.cpp'
      - 'tests/project_root_import_test.cpp'
      - 'docs/NATIVE_PACKAGE_NAMESPACE_GRAPH_PHASE1.md'
      - '.github/workflows/native-package-namespace-graph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-only-gcc-clang:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable exact-head checkout before compilation
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "EXACT_HEAD=$EXPECTED_HEAD EXACT_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Compile source-only package namespace graph contract
        run: |
          "${{ matrix.compiler }}" -std=c++17 -O2 -UNDEBUG \
            -Wall -Wextra -Wpedantic -Werror \
            -I src/main/cpp tests/native_package_namespace_graph_test.cpp \
            -o /tmp/oreslang-native-package-namespace-graph-test
      - name: Execute exact-head host namespace package contract
        run: /tmp/oreslang-native-package-namespace-graph-test
      - name: Compile and execute project-root manifest authority regression
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.compiler }}" -std=c++17 -O2 -UNDEBUG \
            -Wall -Wextra -Wpedantic -Werror \
            -I src/main/cpp tests/project_root_import_test.cpp \
            -o /tmp/oreslang-project-root-import-test
          /tmp/oreslang-project-root-import-test
  clang-sanitized-host-contract:
    # Source-only graph admission. This is not compiled Oreslang guest parity.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout immutable source PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout and source Git blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          for path in src/main/cpp/oreslang/frontend/PackageNamespaceGraph.hpp \
                      src/main/cpp/oreslang/frontend/Parser.hpp \
                      tests/native_package_namespace_graph_test.cpp \
                      src/main/cpp/oreslang/frontend/ProjectRootImport.hpp \
                      tests/project_root_import_test.cpp; do
            test "$(git hash-object "$path")" = "$(git rev-parse "HEAD:$path")"
          done
          echo "EXACT_HOST_HEAD=$EXPECTED_HEAD EXACT_HOST_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Compile and execute Clang ASan/UBSan NDEBUG host-only graph tests
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -g -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src/main/cpp tests/native_package_namespace_graph_test.cpp \
            -o /tmp/oreslang-native-package-namespace-sanitized
          /tmp/oreslang-native-package-namespace-sanitized
      - name: Compile and execute Clang ASan/UBSan project-root marker regression
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -g -DNDEBUG -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I src/main/cpp tests/project_root_import_test.cpp \
            -o /tmp/oreslang-project-root-import-sanitized
          /tmp/oreslang-project-root-import-sanitized
