name: Atto native Atomic and Box v1
on:
  push:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeAtomicBoxV1.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeBoxArenaV1.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorBoxRegionV1.hpp'
      - 'src/main/cpp/oreslang/runtime/SchedulerBoxRegionV1.hpp'
      - 'tests/scheduler_box_region_v1_test.cpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.c'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.h'
      - 'src/main/cpp/oreslang/runtime/ActorHeapIdentity.hpp'
      - 'tests/actor_box_region_v1_test.cpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipChecker.cpp'
      - 'src/main/cpp/oreslang/types/NativeScalarTypes.cpp'
      - 'tests/atto_atomic_main_v1.sh'
      - 'tests/atto-atomic-main-v1/**'
      - 'tests/native_atomic_box_v1_test.cpp'
      - 'src/main/cpp/oreslang/types/NativeBoxCompilerAdmissionV1.hpp'
      - 'tests/native_box_compiler_admission_v1_test.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipCfg.hpp'
      - 'src/main/cpp/oreslang/types/OwnershipDropPlan.hpp'
      - 'src/main/cpp/oreslang/frontend/NativeAtomicAotV1.cpp'
      - 'tests/atto_atomic_aot_v1.sh'
      - 'tests/atto-atomic-aot-v1/**'
      - 'src/main/cpp/oreslang/types/AutoTraitRules.hpp'
      - 'tests/native_atomic_box_traits_bounds_test.cpp'
      - 'tests/ownership_auto_traits_dop_test.cpp'
      - 'src/main/cpp/oreslang/types/DopLogicalAccess.hpp'
      - 'src/main/cpp/oreslang/runtime/DopLayout.hpp'
      - '.github/workflows/atto-native-atomic-box-v1.yml'
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/NativeAtomicBoxV1.hpp'
      - 'src/main/cpp/oreslang/runtime/NativeBoxArenaV1.hpp'
      - 'src/main/cpp/oreslang/runtime/ActorBoxRegionV1.hpp'
      - 'src/main/cpp/oreslang/runtime/SchedulerBoxRegionV1.hpp'
      - 'tests/scheduler_box_region_v1_test.cpp'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.c'
      - 'src/main/cpp/oreslang/runtime/NativeActorScheduler.h'
      - 'src/main/cpp/oreslang/runtime/ActorHeapIdentity.hpp'
      - 'tests/actor_box_region_v1_test.cpp'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/frontend/Parser.hpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipChecker.cpp'
      - 'src/main/cpp/oreslang/types/NativeScalarTypes.cpp'
      - 'tests/atto_atomic_main_v1.sh'
      - 'tests/atto-atomic-main-v1/**'
      - 'tests/native_atomic_box_v1_test.cpp'
      - 'src/main/cpp/oreslang/types/NativeBoxCompilerAdmissionV1.hpp'
      - 'tests/native_box_compiler_admission_v1_test.cpp'
      - 'src/main/cpp/oreslang/types/OwnershipCfg.hpp'
      - 'src/main/cpp/oreslang/types/OwnershipDropPlan.hpp'
      - 'src/main/cpp/oreslang/frontend/NativeAtomicAotV1.cpp'
      - 'tests/atto_atomic_aot_v1.sh'
      - 'tests/atto-atomic-aot-v1/**'
      - 'src/main/cpp/oreslang/types/AutoTraitRules.hpp'
      - 'tests/native_atomic_box_traits_bounds_test.cpp'
      - 'tests/ownership_auto_traits_dop_test.cpp'
      - 'src/main/cpp/oreslang/types/DopLogicalAccess.hpp'
      - 'src/main/cpp/oreslang/runtime/DopLayout.hpp'
      - '.github/workflows/atto-native-atomic-box-v1.yml'
permissions:
  contents: read
jobs:
  lock-free-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run optimized native ownership/atomic contract
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -Isrc/main/cpp tests/native_atomic_box_v1_test.cpp -o /tmp/atto-native-atomic-box
          /tmp/atto-native-atomic-box
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc/main/cpp tests/native_atomic_box_traits_bounds_test.cpp -o /tmp/atto-native-trait-budget
          /tmp/atto-native-trait-budget
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc/main/cpp tests/native_box_compiler_admission_v1_test.cpp -o /tmp/atto-box-compiler-admission
          /tmp/atto-box-compiler-admission
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -Isrc/main/cpp tests/actor_box_region_v1_test.cpp -o /tmp/atto-actor-box-region
          /tmp/atto-actor-box-region
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -Isrc/main/cpp tests/ownership_auto_traits_dop_test.cpp -o /tmp/atto-original-auto-trait-dop
          /tmp/atto-original-auto-trait-dop
      - name: Address and undefined behavior sanitizers
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=address,undefined -Wall -Wextra -Werror -Isrc/main/cpp tests/native_atomic_box_v1_test.cpp -o /tmp/atto-native-atomic-box-sanitized
          /tmp/atto-native-atomic-box-sanitized
          g++ -std=c++20 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=address,undefined -Wall -Wextra -Werror -Isrc/main/cpp tests/actor_box_region_v1_test.cpp -o /tmp/atto-actor-box-region-sanitized
          /tmp/atto-actor-box-region-sanitized
      - name: ThreadSanitizer race detection
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=thread -Wall -Wextra -Werror -Isrc/main/cpp tests/native_atomic_box_v1_test.cpp -o /tmp/atto-native-atomic-box-tsan
          TSAN_OPTIONS="halt_on_error=1" /tmp/atto-native-atomic-box-tsan
          g++ -std=c++20 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=thread -Wall -Wextra -Werror -Isrc/main/cpp tests/actor_box_region_v1_test.cpp -o /tmp/atto-actor-box-region-tsan
          TSAN_OPTIONS="halt_on_error=1" /tmp/atto-actor-box-region-tsan
  atomic-guest-native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check typed Atto source to LLVM atomic IR and native binary
        run: |
          set -euo pipefail
          bash tests/atto_atomic_aot_v1.sh
  main-compiler-atomic-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native LLVM build requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-dev clang cmake
          sudo apt-get install -y -qq "clang-$(llvm-config --version | cut -d. -f1)"
      - name: Compile the real Atto LLVM main compiler and execute Atomic guest AOT fixtures
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/atto-main-aot-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build /tmp/atto-main-aot-build --target oreslang-llvmc -j2
          bash tests/atto_atomic_main_v1.sh /tmp/atto-main-aot-build/oreslang-llvmc

  scheduler-box-real-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build native actor scheduler and Box adapter
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -pthread -Wall -Wextra -Werror -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c -o /tmp/atto-box-scheduler.o
          g++ -std=c++20 -O2 -pthread -Wall -Wextra -Werror -Isrc/main/cpp tests/scheduler_box_region_v1_test.cpp /tmp/atto-box-scheduler.o -o /tmp/atto-box-scheduler
          /tmp/atto-box-scheduler
      - name: Scheduler Box ASan and UBSan
        run: |
          set -euo pipefail
          gcc -std=c11 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=address,undefined -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c -o /tmp/atto-box-scheduler-san.o
          g++ -std=c++20 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=address,undefined -Isrc/main/cpp tests/scheduler_box_region_v1_test.cpp /tmp/atto-box-scheduler-san.o -o /tmp/atto-box-scheduler-san
          ASAN_OPTIONS=detect_leaks=1 /tmp/atto-box-scheduler-san
      - name: Scheduler Box TSan
        run: |
          set -euo pipefail
          gcc -std=c11 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=thread -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c -o /tmp/atto-box-scheduler-tsan.o
          g++ -std=c++20 -O1 -g -pthread -fno-omit-frame-pointer -fsanitize=thread -Isrc/main/cpp tests/scheduler_box_region_v1_test.cpp /tmp/atto-box-scheduler-tsan.o -o /tmp/atto-box-scheduler-tsan
          TSAN_OPTIONS=halt_on_error=1 /tmp/atto-box-scheduler-tsan
