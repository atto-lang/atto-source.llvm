name: Native LLVM Atto scalar-core v1 execution
on:
  pull_request:
    paths:
      - 'contracts/atto-scalar-v1/**'
      - 'src/main/cpp/oreslang/frontend/Parser.cpp'
      - 'src/main/cpp/oreslang/backend/LlvmCodegen.cpp'
      - 'tests/atto_scalar_v1_execution.mjs'
      - '.github/workflows/atto-scalar-core-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-llvm-scalar-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source and canonical fixture bytes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(find contracts/atto-scalar-v1 -name '*.atto' -type f | wc -l)" -eq 19
          echo "ATTO_SCALAR_LLVM_HEAD=$EXPECTED_HEAD"
          echo "ATTO_SCALAR_LLVM_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install native LLVM and Node execution tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang llvm-dev cmake ninja-build nodejs
          llvm-config --version
          clang --version | head -1
          node --version
      - name: Build exact-head oreslang-llvmc
        run: |
          set -euo pipefail
          cmake -G Ninja -S . -B "$RUNNER_TEMP/atto-scalar-build"             -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF             -DLLVM_DIR="$(llvm-config --cmakedir)"
          cmake --build "$RUNNER_TEMP/atto-scalar-build"             --target oreslang-llvmc --parallel 2
          test -x "$RUNNER_TEMP/atto-scalar-build/oreslang-llvmc"
          sha256sum "$RUNNER_TEMP/atto-scalar-build/oreslang-llvmc"
      - name: Compile and execute all 19 canonical scalar guests
        env:
          ORESLANG_LLVMC: ${{ runner.temp }}/atto-scalar-build/oreslang-llvmc
          CLANG: clang
          ATTO_EXECUTED_STEPS: '5'
          ATTO_RECEIPT_PATH: ${{ runner.temp }}/atto-scalar-v1-receipt.json
        run: |
          set -euo pipefail
          node tests/atto_scalar_v1_execution.mjs
          test -s "$ATTO_RECEIPT_PATH"
          cat "$ATTO_RECEIPT_PATH"
      - name: Evidence boundary
        run: |
          echo 'Receipt is internally generated execution evidence only.'
          echo 'Independent workflow/job-step and artifact provenance verification remains required before parity promotion.'
