name: Actor two-peer fault native guest E2E CANDIDATE
on:
  pull_request:
    paths:
      - 'tests/fixtures/actor-two-peer-failure-v1/**'
      - 'scripts/test-actor-two-peer-failure-v1.sh'
      - '.github/workflows/actor-two-peer-failure-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-peer-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Pin exact source and assert local script syntax
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          test "$(git hash-object tests/fixtures/actor-two-peer-failure-v1/two-peer-failure-matrix.atto)" = eaac813262ca184930ba124180ed692e21329969
          bash -n scripts/test-actor-two-peer-failure-v1.sh
          printf 'HEAD=%s\nTREE=%s\nSTATUS=NOT_CERTIFIED\n' "$EXPECTED_HEAD" "$(git rev-parse 'HEAD^{tree}')" > "$RUNNER_TEMP/actor-two-peer-provenance.log"
      - name: Install native compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang llvm-dev python3
      - name: Build exact-head native LLVM compiler and no-GC auditor
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          test -x build/oreslang-llvmc
          test -x build/oreslang-no-gc-ir-audit
      - name: Compile and execute O0/O2 low-stack two-peer native guests (candidate)
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash scripts/test-actor-two-peer-failure-v1.sh 2>&1 | tee "$RUNNER_TEMP/actor-two-peer-execution.log"
      - name: Retain unverified guest candidate logs, even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: actor-two-peer-llvm-candidate
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/actor-two-peer-provenance.log
            ${{ runner.temp }}/actor-two-peer-execution.log
