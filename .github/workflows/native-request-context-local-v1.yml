name: Atto RequestLocal same-actor logical context (host)
on:
  pull_request:
    paths:
      - "src/main/cpp/oreslang/runtime/RequestContextLocalV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.c"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.h"
      - "src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h"
      - "src/main/cpp/oreslang/runtime/RequestLocalSchedulerTurnV1.hpp"
      - "tests/native_request_context_local_v1_test.cpp"
      - "src/main/cpp/oreslang/runtime/RequestContextHandoffV1.hpp"
      - "tests/native_request_context_handoff_v1_test.cpp"
      - ".github/workflows/native-request-context-local-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-local:
    name: "request context - ${{ matrix.cc }} / ${{ matrix.mode }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: gcc, mode: optimized}
          - {cc: clang, mode: optimized}
          - {cc: gcc, mode: asan-ubsan}
          - {cc: clang, mode: asan-ubsan}
          - {cc: gcc, mode: tsan}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head and pin native logical-context dependencies
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestContextLocalV1.hpp)" = "d8da3cd331fc5b9b353179d251a8ea5dc44ad642"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp)" = "7b79138951aa878fe2ee43cfcef21277cb68b256"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp)" = "bcecb54e7750fca7ef84010a2fa3f66e6bf61902"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h)" = "cfd0e7f1d8fbd125a0ca20c7907432fc0407635c"
          test "$(git hash-object tests/native_request_context_local_v1_test.cpp)" = "1a9faffae8412ca2a46e817757cc65f606d76839"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestLocalSchedulerTurnV1.hpp)" = "08f21c4a37aa9836e1343d9a513acb2d9a8614b3"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.c)" = "684cb08fc30bad29bcf615e46321dbec23878d96"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.h)" = "4fd6636d5fbc1b4c13150bb14d1657119debf5b1"
          test "$(git hash-object src/main/cpp/oreslang/runtime/TaskCancellation.hpp)" = "7eafa420e92ba10e552dade1846f3862cb79aec7"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestContextHandoffV1.hpp)" = "b0fc4ac5f1c92e92b8aeee03204603d438e544a7"
          test "$(git hash-object tests/native_request_context_handoff_v1_test.cpp)" = "e7e909861262df0d062350d1d309e91abafe66f6"
      - name: Compile and execute real actor two-request isolation
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if [[ "$CC" == gcc ]]; then CXX=g++; else CXX=clang++; fi
          flags=(-O2 -UNDEBUG)
          if [[ "$MODE" == asan-ubsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -UNDEBUG)
            export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
            export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          elif [[ "$MODE" == tsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=thread -UNDEBUG)
            export TSAN_OPTIONS="halt_on_error=1:report_signal_unsafe=1"
          fi
          "$CC" -std=c11 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o "$tmp/scheduler.o"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_context_local_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-context"
          "$tmp/request-context"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_context_handoff_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-handoff"
          "$tmp/request-handoff"
          printf 'REQUEST_CONTEXT_LOCAL_EXACT_SOURCE_HOST_PASS compiler=%s mode=%s\n' "$CC" "$MODE"
