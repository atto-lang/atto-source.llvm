name: Atto RequestLocal same-actor logical context (host)
on:
  pull_request:
    paths:
      - "src/main/cpp/oreslang/runtime/RequestContextLocalV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.c"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.h"
      - "src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h"
      - "src/main/cpp/oreslang/runtime/RequestLocalSchedulerTurnV1.hpp"
      - "tests/native_request_context_local_v1_test.cpp"
      - "src/main/cpp/oreslang/runtime/RequestContextHandoffV1.hpp"
      - "src/main/cpp/oreslang/runtime/RequestLocalStopGroupV1.hpp"
      - "src/main/cpp/oreslang/runtime/RequestLocalActorTerminationRegistryV1.hpp"
      - "tests/native_request_stop_cancel_v1_test.cpp"
      - "tests/native_actor_termination_observer_v1_test.cpp"
      - "tests/native_request_external_termination_v1_test.cpp"
      - "tests/native_request_context_handoff_v1_test.cpp"
      - "src/main/cpp/oreslang/runtime/NativeRequestDataMailGateV1.hpp"
      - "src/main/cpp/oreslang/runtime/NativeRequestWakeGateV1.hpp"
      - "tests/native_request_actor_lifecycle_guard_v1_test.cpp"
      - "tests/native_request_actor_termination_registry_v1_test.cpp"
      - "tests/native_request_ingress_supervisor_v1_test.cpp"
      - ".github/workflows/native-request-context-local-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-local:
    name: "request context - ${{ matrix.cc }} / ${{ matrix.mode }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: gcc, mode: optimized}
          - {cc: clang, mode: optimized}
          - {cc: gcc, mode: asan-ubsan}
          - {cc: clang, mode: asan-ubsan}
          - {cc: gcc, mode: tsan}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head and pin native logical-context dependencies
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestContextLocalV1.hpp)" = "c9fc12422856d84bd6fdc61e01aec405142d98ba"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp)" = "7b79138951aa878fe2ee43cfcef21277cb68b256"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp)" = "bcecb54e7750fca7ef84010a2fa3f66e6bf61902"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h)" = "cfd0e7f1d8fbd125a0ca20c7907432fc0407635c"
          test "$(git hash-object tests/native_request_context_local_v1_test.cpp)" = "05f071f911650a53b7158135d07f22b2650ea64b"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestLocalSchedulerTurnV1.hpp)" = "813d1f3be2ab90825e6bee4deb31b7a7f74e3796"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.c)" = "0c62b60b5b8b344836fb07e165c016f4f655c6f7"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.h)" = "f4aea5f2e594e34eaf4ec717a20c455225186a5a"
          test "$(git hash-object src/main/cpp/oreslang/runtime/TaskCancellation.hpp)" = "7eafa420e92ba10e552dade1846f3862cb79aec7"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestContextHandoffV1.hpp)" = "80d03fe85c406d2b67898d890bc174850e2a54be"
          test "$(git hash-object tests/native_request_context_handoff_v1_test.cpp)" = "4d66bc7b520d34148b49eb726962819557a6ba74"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestLocalStopGroupV1.hpp)" = "41fd08efa48964297479c2fb1a2e4a8b3e950367"
          test "$(git hash-object tests/native_request_stop_cancel_v1_test.cpp)" = "d41874ea2adb7d69c47a855ae4f1a7cce51ee775"
          test "$(git hash-object tests/native_actor_termination_observer_v1_test.cpp)" = "d0949ec9130de08777a8ad307b2eacbab9fd12e6"
          test "$(git hash-object tests/native_request_external_termination_v1_test.cpp)" = "1ed3ef424dc5cedd2e23174994608930dbb4dd6e"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeRequestDataMailGateV1.hpp)" = "6affba5e1b021bf9f4e5b54584241d873f245451"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeRequestWakeGateV1.hpp)" = "03c6978398bde37ab5260aabb93697dabb60740a"
          test "$(git hash-object tests/native_request_actor_lifecycle_guard_v1_test.cpp)" = "ebba397307a27451492d0c3aa20d8b259807d80f"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestLocalActorTerminationRegistryV1.hpp)" = "f905735fd1b78c441f3b2b9382a972264b97dc29"
          test "$(git hash-object tests/native_request_actor_termination_registry_v1_test.cpp)" = "bb8661b028dbc740e1a501325755a32b8e866953"
          "fcedcdec501218a11c1c4766ea4584926479b5bf5157
      - name: Compile and execute real actor two-request isolation
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if [[ "$CC" == gcc ]]; then CXX=g++; else CXX=clang++; fi
          flags=(-O2 -UNDEBUG)
          if [[ "$MODE" == asan-ubsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -UNDEBUG)
            export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
            export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          elif [[ "$MODE" == tsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=thread -UNDEBUG)
            export TSAN_OPTIONS="halt_on_error=1:report_signal_unsafe=1"
          fi
          "$CC" -std=c11 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o "$tmp/scheduler.o"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_context_local_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-context"
          "$tmp/request-context"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_context_handoff_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-handoff"
          "$tmp/request-handoff"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_actor_lifecycle_guard_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-lifecycle"
          "$tmp/request-lifecycle" | tee "$tmp/request-lifecycle-cases.log"
          test "$(grep -c '^ACTOR_LIFECYCLE_PASS ' "$tmp/request-lifecycle-cases.log")" = "49"
          grep -qx 'ACTOR_LIFECYCLE_GUARD_49_HOST_CASES_PASS' "$tmp/request-lifecycle-cases.log"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_stop_cancel_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-stop-cancel"
          "$tmp/request-stop-cancel" | tee "$tmp/request-stop-cases.log"
          test "$(grep -c '^REQUEST_STOP_CASE_PASS ' "$tmp/request-stop-cases.log")" = "38"
          grep -qx 'REQUEST_STOP_CANCEL_38_HOST_CASES_PASS' "$tmp/request-stop-cases.log"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_actor_termination_observer_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/actor-termination-observer"
          "$tmp/actor-termination-observer" | tee "$tmp/observer-cases.log"
          test "$(grep -c '^ACTOR_TERMINATION_OBSERVER_PASS ' "$tmp/observer-cases.log")" = "131"
          grep -qx 'ACTOR_TERMINATION_OBSERVER_HOST_PASS total=131 race_trials=30' "$tmp/observer-cases.log"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_external_termination_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-external-termination"
          "$tmp/request-external-termination" | tee "$tmp/external-cases.log"
          test "$(grep -c '^EXTERNAL_REQUEST_STOP_PASS ' "$tmp/external-cases.log")" = "62"
          grep -qx 'REQUEST_EXTERNAL_STOP_HOST_PASS total=62 race_trials=20' "$tmp/external-cases.log"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_actor_termination_registry_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/actor-request-registry"
          "$tmp/actor-request-registry" | tee "$tmp/registry-cases.log"
          test "$(grep -c '^REQUEST_REGISTRY_CASE_PASS ' "$tmp/registry-cases.log")" = "118"
          grep -qx 'REQUEST_TERMINATION_REGISTRY_HOST_PASS total=118 race_trials=60' "$tmp/registry-cases.log"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_ingress_supervisor_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-ingress-supervisor"
          "$tmp/request-ingress-supervisor" | tee "$tmp/ingress-cases.log"
          test "$(grep -c '^INGRESS_SUPERVISOR_CASE_PASS ' "$tmp/ingress-cases.log")" = "207"
          grep -qx 'REQUEST_INGRESS_SUPERVISOR_HOST_PASS total=207 races=60' "$tmp/ingress-cases.log"
          # Each deliberate security mutation MUST compile, then fail
          # the matching named regression; a build failure is NOT proof.
          python3 - "$tmp" <<'PY'
          from pathlib import Path
          import sys
          root = Path("src/main/cpp/oreslang/runtime")
          target = Path(sys.argv[1]) / "negative-mutations"
          cases = [
              ("capacity", "RequestLocalActorTerminationRegistryV1.hpp",
               "actor_slots != ores_native_actor_scheduler_actor_capacity_v1(scheduler)",
               "false"),
              ("skip_admit", "RequestLocalActorTerminationRegistryV1.hpp",
               "if (!admit(identity.actor, scope)) {",
               "if (false) {"),
              ("stop_signal", "RequestLocalActorTerminationRegistryV1.hpp",
               "const bool graceful = cause == SupervisorCause::normal_stop;",
               "return false; /* deliberate mutation */\\n        const bool graceful = cause == SupervisorCause::normal_stop;"),
              ("raw_gate", "RequestContextLocalV1.hpp",
               "return actor_lifetime_live_locked() &&\\n            (!actor_lifetime_fence_ || scheduler != nullptr);",
               "(void)scheduler; return actor_lifetime_live_locked();"),
          ]
          for name, filename, old, replacement in cases:
              src = (root / filename).read_text()
              old = old.replace("\\n", "\n")
              replacement = replacement.replace("\\n", "\n")
              if src.count(old) != 1:
                  raise SystemExit(f"mutation guard missing or ambiguous: {name} matches={src.count(old)}")
              dest = target / name / "oreslang/runtime" / filename
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(src.replace(old, replacement, 1))
          PY
          for mutation in capacity skip_admit stop_signal raw_gate; do
            "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
              -I"$tmp/negative-mutations/$mutation" -Isrc/main/cpp \
              tests/native_request_ingress_supervisor_v1_test.cpp \
              "$tmp/scheduler.o" -o "$tmp/negative-$mutation"
            set +e
            "$tmp/negative-$mutation" > "$tmp/negative-$mutation.log" 2>&1
            negative_status=$?
            set -e
            test "$negative_status" -ne 0
            case "$mutation" in
              capacity) expected_case=03_undersized_registry_rejected ;;
              skip_admit|raw_gate) expected_case=24_unregistered_raw_set_bypass_denied ;;
              stop_signal) expected_case=28_lifecycle_stop_committed ;;
              *) exit 2 ;;
            esac
            grep -Fxq "INGRESS_SUPERVISOR_CASE_FAILED $expected_case" \
              "$tmp/negative-$mutation.log"
            printf 'REQUEST_INGRESS_NEGATIVE_MUTATION_KILLED %s\n' "$mutation"
          done
          printf 'REQUEST_CONTEXT_LOCAL_EXACT_SOURCE_HOST_PASS compiler=%s mode=%s\n' "$CC" "$MODE"
