name: Atto RequestLocal same-actor logical context (host)
on:
  pull_request:
    paths:
      - "src/main/cpp/oreslang/runtime/RequestContextLocalV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.c"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.h"
      - "src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h"
      - "src/main/cpp/oreslang/runtime/RequestLocalSchedulerTurnV1.hpp"
      - "tests/native_request_context_local_v1_test.cpp"
      - "src/main/cpp/oreslang/runtime/RequestContextHandoffV1.hpp"
      - "src/main/cpp/oreslang/runtime/RequestLocalStopGroupV1.hpp"
      - "tests/native_request_stop_cancel_v1_test.cpp"
      - "tests/native_request_context_handoff_v1_test.cpp"
      - "src/main/cpp/oreslang/runtime/NativeRequestDataMailGateV1.hpp"
      - "src/main/cpp/oreslang/runtime/NativeRequestWakeGateV1.hpp"
      - "tests/native_request_actor_lifecycle_guard_v1_test.cpp"
      - ".github/workflows/native-request-context-local-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  request-local:
    name: "request context - ${{ matrix.cc }} / ${{ matrix.mode }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cc: gcc, mode: optimized}
          - {cc: clang, mode: optimized}
          - {cc: gcc, mode: asan-ubsan}
          - {cc: clang, mode: asan-ubsan}
          - {cc: gcc, mode: tsan}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head and pin native logical-context dependencies
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestContextLocalV1.hpp)" = "b41aa99e268bf52c42320e89860edd645b01a800"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp)" = "7b79138951aa878fe2ee43cfcef21277cb68b256"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp)" = "bcecb54e7750fca7ef84010a2fa3f66e6bf61902"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h)" = "cfd0e7f1d8fbd125a0ca20c7907432fc0407635c"
          test "$(git hash-object tests/native_request_context_local_v1_test.cpp)" = "05f071f911650a53b7158135d07f22b2650ea64b"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestLocalSchedulerTurnV1.hpp)" = "813d1f3be2ab90825e6bee4deb31b7a7f74e3796"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.c)" = "12af26277192b51a087e9849cc0c4330f8ca503f"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.h)" = "fcfbc18e2c66b3ff1016a4119ed74128f1c757a0"
          test "$(git hash-object src/main/cpp/oreslang/runtime/TaskCancellation.hpp)" = "7eafa420e92ba10e552dade1846f3862cb79aec7"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestContextHandoffV1.hpp)" = "d443f0708a3f21afdf20a8f0567e39bf5033c6ec"
          test "$(git hash-object tests/native_request_context_handoff_v1_test.cpp)" = "e7e909861262df0d062350d1d309e91abafe66f6"
          test "$(git hash-object src/main/cpp/oreslang/runtime/RequestLocalStopGroupV1.hpp)" = "31e456a02ae6bf3039a4a617c62d04b31d765639"
          test "$(git hash-object tests/native_request_stop_cancel_v1_test.cpp)" = "d41874ea2adb7d69c47a855ae4f1a7cce51ee775"
      - name: Verify supplemental lifecycle file source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeRequestDataMailGateV1.hpp)" = "6affba5e1b021bf9f4e5b54584241d873f245451"
      - name: Verify supplemental lifecycle file source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeRequestWakeGateV1.hpp)" = "03c6978398bde37ab5260aabb93697dabb60740a"
      - name: Verify supplemental lifecycle file source blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/native_request_actor_lifecycle_guard_v1_test.cpp)" = "95909d7557fd8d613ed5235c3cb77bd91002cd90"
      - name: Compile and execute real actor two-request isolation
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if [[ "$CC" == gcc ]]; then CXX=g++; else CXX=clang++; fi
          flags=(-O2 -UNDEBUG)
          if [[ "$MODE" == asan-ubsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -UNDEBUG)
            export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
            export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
          elif [[ "$MODE" == tsan ]]; then
            flags=(-O1 -g -fno-omit-frame-pointer -fsanitize=thread -UNDEBUG)
            export TSAN_OPTIONS="halt_on_error=1:report_signal_unsafe=1"
          fi
          "$CC" -std=c11 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o "$tmp/scheduler.o"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_context_local_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-context"
          "$tmp/request-context"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_context_handoff_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-handoff"
          "$tmp/request-handoff"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_actor_lifecycle_guard_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-lifecycle"
          "$tmp/request-lifecycle" | tee "$tmp/request-lifecycle-cases.log"
          test "$(grep -c '^ACTOR_LIFECYCLE_PASS ' "$tmp/request-lifecycle-cases.log")" = "38"
          grep -qx 'ACTOR_LIFECYCLE_GUARD_38_HOST_CASES_PASS' "$tmp/request-lifecycle-cases.log"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_request_stop_cancel_v1_test.cpp \
            "$tmp/scheduler.o" -o "$tmp/request-stop-cancel"
          "$tmp/request-stop-cancel" | tee "$tmp/request-stop-cases.log"
          test "$(grep -c '^REQUEST_STOP_CASE_PASS ' "$tmp/request-stop-cases.log")" = "38"
          grep -qx 'REQUEST_STOP_CANCEL_38_HOST_CASES_PASS' "$tmp/request-stop-cases.log"
          printf 'REQUEST_CONTEXT_LOCAL_EXACT_SOURCE_HOST_PASS compiler=%s mode=%s\n' "$CC" "$MODE"
