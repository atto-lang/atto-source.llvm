name: Native AttoLang local context domains (host only)
on:
  pull_request:
    paths:
      - "src/main/cpp/oreslang/runtime/LocalContextDomainsV1.hpp"
      - "src/main/cpp/oreslang/runtime/ActorLocalSchedulerTurnV1.hpp"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.c"
      - "src/main/cpp/oreslang/runtime/NativeActorScheduler.h"
      - "src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h"
      - "src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp"
      - "tests/native_context_domains_v1_test.cpp"
      - "tests/native_local_read_revocation_v1_test.cpp"
      - "tests/native_actorlocal_stop_during_copy_v1_test.cpp"
      - "tests/native_actorlocal_cross_scheduler_retire_v1_test.cpp"
      - "tests/native_actor_bounded_commit_carrier_stop_v1_test.c"
      - "tests/native_actor_bounded_commit_mutation_witness.sh"
      - "tests/native_actorlocal_stop_mutation_witness.sh"
      - "tests/native_local_read_revocation_mutation_witness.sh"
      - "tests/run_native_local_context_m6_offline.sh"
      - "tests/native_local_payload_budget_v1_test.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/native-local-context-domains-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-local-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: g++, mode: optimized}
          - {compiler: clang++, mode: optimized}
          - {compiler: g++, mode: asan-ubsan}
          - {compiler: clang++, mode: asan-ubsan}
          - {compiler: g++, mode: tsan}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head and checked out native source blobs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalContextDomainsV1.hpp)" = "3ee0121b59927b9a0b40a4bce73e0902c7d1a2bc"
          test "$(git hash-object src/main/cpp/oreslang/runtime/ActorLocalSchedulerTurnV1.hpp)" = "3e43913769a505790f821e604a37d883470a6489"
          test "$(git hash-object tests/native_actorlocal_stop_during_copy_v1_test.cpp)" = "d21b6c525819c277038f2c5f0d393c3b82cf2f35"
          test "$(git hash-object tests/native_actorlocal_cross_scheduler_retire_v1_test.cpp)" = "7af31f5126c8c0627177f259e15f5713a8d73064"
          test "$(git hash-object tests/native_actorlocal_stop_mutation_witness.sh)" = "7435666345b25bafeb3ee97ec01a02e4e90aa0c5"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.c)" = "6ee738cd9e55e735903303cc759fb63a63e1f198"
          test "$(git hash-object src/main/cpp/oreslang/runtime/NativeActorScheduler.h)" = "96716dd2174461898af3d665c4fe989a2c2221f4"
          test "$(git hash-object tests/native_actor_bounded_commit_carrier_stop_v1_test.c)" = "ed2ffe7c72351eb7fdec662614b5422cf961be26"
          test "$(git hash-object tests/native_actor_bounded_commit_mutation_witness.sh)" = "dbef118d7a193c50d0eb45452d041fa31f8dd4e2"
          for dep in src/main/cpp/oreslang/runtime/NativeExecutionAuthority.h; do
            test "$(git hash-object "$dep")" = "$(git rev-parse "HEAD:$dep")"
          done
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp)" = "7b79138951aa878fe2ee43cfcef21277cb68b256"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp)" = "bcecb54e7750fca7ef84010a2fa3f66e6bf61902"
          test "$(git hash-object tests/native_context_domains_v1_test.cpp)" = "c9fd993bd78e4a6b2bd27c384fff43276ca915dd"
          test "$(git hash-object tests/native_local_read_revocation_v1_test.cpp)" = "cf49e51bed5834fae1d76a1191ec18e41f379656"
          test "$(git hash-object tests/native_local_read_revocation_mutation_witness.sh)" = "0d256fe89fd963e520226f7207f434b9e6477be7"
          test "$(git hash-object tests/run_native_local_context_m6_offline.sh)" = "c9af102013c275496d009d97b93aa4cab00e9000"
          test "$(git hash-object tests/native_local_payload_budget_v1_test.cpp)" = "25dec8d5f15bafbc6d28d73f94c9027f21ca9ac5"
          printf 'source_head=%s\nsource_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: Compile and execute local-context native regression
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          flags=(-O2 -UNDEBUG)
          if [[ "$MODE" == asan-ubsan ]]; then
            flags=(-O1 -g -UNDEBUG -fno-omit-frame-pointer -fsanitize=address,undefined)
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          elif [[ "$MODE" == tsan ]]; then
            flags=(-O1 -g -UNDEBUG -fno-omit-frame-pointer -fsanitize=thread)
            export TSAN_OPTIONS='halt_on_error=1'
          fi
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_context_domains_v1_test.cpp \
            -o "$work/local-context-test"
          "$work/local-context-test"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_local_read_revocation_v1_test.cpp \
            -o "$work/local-read-revocation-test"
          "$work/local-read-revocation-test"
          case "$CXX" in g++) CC=gcc ;; clang++) CC=clang ;; *) echo "Unsupported C++ compiler" >&2; exit 2 ;; esac
          "$CC" -std=c11 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp -c src/main/cpp/oreslang/runtime/NativeActorScheduler.c \
            -o "$work/scheduler.o"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_actorlocal_stop_during_copy_v1_test.cpp \
            "$work/scheduler.o" -o "$work/actorlocal-stop-test"
          "$work/actorlocal-stop-test"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_actorlocal_cross_scheduler_retire_v1_test.cpp \
            "$work/scheduler.o" -o "$work/actorlocal-cross-scheduler-retire-test"
          "$work/actorlocal-cross-scheduler-retire-test"
          "$CC" -std=c11 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_actor_bounded_commit_carrier_stop_v1_test.c \
            "$work/scheduler.o" -o "$work/actor-bounded-commit-test"
          "$work/actor-bounded-commit-test"
          if [[ "$MODE" == optimized ]]; then
            CC="$CC" bash tests/native_actor_bounded_commit_mutation_witness.sh
          fi
          if [[ "$MODE" == optimized ]]; then
            bash tests/native_actorlocal_stop_mutation_witness.sh
          fi
          if [[ "$MODE" == optimized ]]; then
            bash tests/native_local_read_revocation_mutation_witness.sh
          fi
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_local_payload_budget_v1_test.cpp \
            -o "$work/local-payload-test"
          "$work/local-payload-test"
          printf 'LOCAL_CONTEXT_DOMAINS_V1_EXACT_HEAD_HOST_PASS compiler=%s mode=%s\n' "$CXX" "$MODE"
