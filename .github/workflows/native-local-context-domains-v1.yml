name: Native AttoLang local context domains (host only)
on:
  pull_request:
    paths:
      - "src/main/cpp/oreslang/runtime/LocalContextDomainsV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp"
      - "src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp"
      - "tests/native_context_domains_v1_test.cpp"
      - "tests/native_local_payload_budget_v1_test.cpp"
      - "src/main/cpp/oreslang/runtime/ScopedLocalStorageV1.hpp"
      - "tests/native_scoped_local_coexistence_v1_test.cpp"
      - "src/main/cpp/oreslang/runtime/ActorLocalSchedulerTurnV1.hpp"
      - "tests/native_actorlocal_scheduler_turn_test.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/native-local-context-domains-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-local-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: g++, mode: optimized}
          - {compiler: clang++, mode: optimized}
          - {compiler: g++, mode: asan-ubsan}
          - {compiler: clang++, mode: asan-ubsan}
          - {compiler: g++, mode: tsan}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact PR head and checked out native source blobs
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalContextDomainsV1.hpp)" = "fd5a8e17402092d3e2734007b6465c18ed346321"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalValueAdmissionV1.hpp)" = "7b79138951aa878fe2ee43cfcef21277cb68b256"
          test "$(git hash-object src/main/cpp/oreslang/runtime/LocalPayloadBudgetV1.hpp)" = "bcecb54e7750fca7ef84010a2fa3f66e6bf61902"
          test "$(git hash-object tests/native_context_domains_v1_test.cpp)" = "08cba6d3b390cf399f73535c044ea949263f5887"
          test "$(git hash-object tests/native_local_payload_budget_v1_test.cpp)" = "25dec8d5f15bafbc6d28d73f94c9027f21ca9ac5"
          test "$(git hash-object tests/native_actorlocal_scheduler_turn_test.cpp)" = "48808661462b8758bff722503d275db7a3c9615d"
          test "$(git hash-object src/main/cpp/oreslang/runtime/ActorLocalSchedulerTurnV1.hpp)" = "3011e40222789dc8161052028abc76941e8444f0"
          test "$(git hash-object CMakeLists.txt)" = "d394b917c73e901dd046013adf49a061c9941c90"
          test "$(git hash-object tests/native_scoped_local_coexistence_v1_test.cpp)" = "63f4b28208b69fc0f68742641c9e417d2fd5a34c"
          test "$(git hash-object src/main/cpp/oreslang/runtime/ScopedLocalStorageV1.hpp)" = "9b6fa46743091dd4bc8dd90da1f6641633b85fde"
          printf 'source_head=%s\nsource_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
      - name: Compile and execute local-context native regression
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          flags=(-O2 -UNDEBUG)
          if [[ "$MODE" == asan-ubsan ]]; then
            flags=(-O1 -g -UNDEBUG -fno-omit-frame-pointer -fsanitize=address,undefined)
            export ASAN_OPTIONS='detect_leaks=1:halt_on_error=1'
            export UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1'
          elif [[ "$MODE" == tsan ]]; then
            flags=(-O1 -g -UNDEBUG -fno-omit-frame-pointer -fsanitize=thread)
            export TSAN_OPTIONS='halt_on_error=1'
          fi
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_context_domains_v1_test.cpp \
            -o "$work/local-context-test"
          "$work/local-context-test"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_scoped_local_coexistence_v1_test.cpp \
            -o "$work/scoped-coexistence"
          "$work/scoped-coexistence" | tee "$work/scoped-coexistence.log"
          test "$(grep -c '^SCOPED_COEXIST_PASS ' "$work/scoped-coexistence.log")" = "17"
          grep -qx 'NATIVE_SCOPED_COEXISTENCE_17_HOST_CASES_PASS' "$work/scoped-coexistence.log"
          "$CXX" -std=c++17 "${flags[@]}" -Wall -Wextra -Wpedantic -Werror -pthread \
            -Isrc/main/cpp tests/native_local_payload_budget_v1_test.cpp \
            -o "$work/local-payload-test"
          "$work/local-payload-test"
          printf 'LOCAL_CONTEXT_DOMAINS_V1_EXACT_HEAD_HOST_PASS compiler=%s mode=%s\n' "$CXX" "$MODE"
