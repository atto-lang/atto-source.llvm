name: Native actor reliability kernel
on:
  pull_request:
    paths:
      - 'src/main/cpp/oreslang/runtime/ActorReliabilityKernel.h'
      - 'tests/actor_reliability_kernel_test.cpp'
      - '.github/workflows/actor-reliability-kernel.yml'
permissions:
  contents: read
jobs:
  host-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile strict C++17 smoke
        run: c++ -std=c++17 -O2 -pthread -Wall -Wextra -Wpedantic -Werror -Isrc/main/cpp tests/actor_reliability_kernel_test.cpp -o /tmp/actor-reliability
      - run: /tmp/actor-reliability
